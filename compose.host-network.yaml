services:
  # On the host's network (its sources may be .local names), on port 8765 of every address the host has, as compose.yaml publishes
  # it: the bot reaches it at http://127.0.0.1:8765/mcp, and other machines at the host's address. (No hostname of its own here: the
  # host's name is its name, and it answers that.)
  ecobot-mcp:
    network_mode: host
    hostname: !reset null
    ports: !reset []
  ecobot:
    network_mode: host
    environment:
      BOT_MCP_URL: http://127.0.0.1:8765/mcp
  # irrigation-mcp (the `irrigation` profile) on the host's network too, on port 8766: it reaches ecobot-mcp at 127.0.0.1, and the bot
  # reaches it with BOT_IRRIGATION_MCP_URL=http://127.0.0.1:8766/mcp in /etc/ecobot.env (not set here: the bot runs without it).
  irrigation-mcp:
    network_mode: host
    hostname: !reset null
    ports: !reset []
    environment:
      IRRIGATION_ECOBOT_MCP_URL: http://127.0.0.1:8765/mcp
