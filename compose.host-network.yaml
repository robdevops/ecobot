services:
  ecobot:
    network_mode: host
  # On the host's network too (its sources may be .local names), on port 8765 of every address the host has, as compose.yaml
  # publishes it: the bot reaches it at http://127.0.0.1:8765/mcp, and other machines at the host's address.
  ecobot-service:
    network_mode: host
    ports: !reset []
