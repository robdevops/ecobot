services:
  # On the host's network (its sources may be .local names), on port 8765 of every address the host has, as compose.yaml publishes
  # it: clients on the host reach it at http://127.0.0.1:8765/mcp, and other machines at the host's address. (No hostname of its own here: the
  # host's name is its name, and it answers that.)
  ecobot-mcp:
    network_mode: host
    hostname: !reset null
    ports: !reset []
  # irrigation-mcp (the `irrigation` profile) on the host's network too, on port 8766: it reaches ecobot-mcp at 127.0.0.1, and clients
  # on the host reach it at http://127.0.0.1:8766/mcp.
  irrigation-mcp:
    network_mode: host
    hostname: !reset null
    ports: !reset []
    environment:
      IRRIGATION_ECOBOT_MCP_URL: http://127.0.0.1:8765/mcp
