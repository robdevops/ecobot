<!DOCTYPE html>
<html lang="en" data-animations="on">
<head>
<meta charset="utf-8">
<!--link preview-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14191D">
<meta name="color-scheme" content="dark">
<title>Weather Dashboard</title>
<!-- The gauges, live (lib/web_dashboard.py): drawn here from /dashboard/data as the PNG (lib/gauges.py) draws them, in the same
     colours and sizes (lib/gauge_look.py, sent with the data); redrawn on each /dashboard/events event, and every minute regardless.
     The tiles can be rearranged in the browser: dragged to reorder (a long press on a touch screen), hidden with their × or the
     remove zone, all put back with "reset preferences"; kept in localStorage ("ecobot.dashboard.v1"), nothing sent to the server.
     The units' switches beside the strip ("°C | °F", "km/h | mph", "hPa | inHg", "mm | in"): the temperatures, the wind, the
     pressure and the rain (its rate with it) shown in those, converted here
     (the server sends metric), kept with the preferences, metric again on "reset preferences".
     A click or tap on a gauge zooms its tile (title and gauge, no table) to fill the window, a gallery paged through by keys, swipes and drags; Esc goes back.
     Behind everything, the weather as pixel art on one canvas (Sky): rain, haze, uv, humidity, wind, heat and ice, each while the
     readings call for it, its tile framed in red; "stop" at the bottom left stops and clears them for this page view only
     (nothing saved: a reload brings them back; the link gone till then). MCP_DASHBOARD_ANIMATIONS: the server sends
     data-animations="on", "low" or "off" on <html> (lib/web_dashboard.py), for every viewer. On: all of the above. Low: the gauges
     sweep and the tiles reflow as on, but no weather (no canvas drawn, no loop, no "stop", no test links) and the zoom at once. Off:
     no weather, and nothing animated: the gauges' needles and readings straight at their new place, the zoom and the reflow at once,
     no transition. A browser asking for reduced motion: as off, whatever the setting. The data's updates as they come in each. -->
<style>
  :root { --bg: #14191D; --ink: #E8EAED; --soft: #B8BDC2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow-x: hidden; overflow-y: auto; }
  #grid { display: grid; justify-content: safe center; max-width: 100%; align-content: center; padding: var(--pad, 8px);
    padding-bottom: calc(var(--pad, 8px) + var(--status, 18px)); min-height: 100%; }   /* (room under the tiles for the status line) */
  /* A tile: its own background clear (whatever is behind the page shows through it), its foreground opaque; a thin opaque frame
     (::before, inset, so neighbours don't share a line), seen only picked up, focused or red (not on mouseover). Its gauge can be dragged (user-select none), its
     title, reading and table keep their text selectable. transform-origin 0 0: the reflow animations' scale is from the corner.
     Its contents are placed by its width alone (cqw), so the zoomed view, its box only their top (the title and gauge), shows them alike. */
  .tile { position: relative; container-type: inline-size; overflow: hidden; background: transparent; transform-origin: 0 0;
    transition: opacity 0.9s ease, transform 0.22s ease; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile::before { content: ""; position: absolute; inset: 0.9cqw; border: 1px solid transparent; border-radius: 2.5cqw; pointer-events: none; }
  .tile.faded { opacity: var(--fade, 0.4); }   /* no reading now: dimmed towards the card (as the PNG blends its colours) */
  .tile svg { position: absolute; left: 0; top: 0; width: 100%; display: block; }   /* (its height: by the width, drawTile()) */
  .tile svg text { font-family: inherit; }
  .title, .unit, .chip, .figure, .tile svg text.reading { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .at { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 1; }
  .title { left: 0; right: 0; }
  .chip { border-radius: 1.875cqw; }
  /* The grip and the × (hide), shown only on mouseover, on a tile picked up, or (touch) on one long-pressed and let go in place */
  .grip, .close { position: absolute; top: 6px; z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .grip { left: 8px; width: 15px; height: 20px; cursor: grab;   /* (dots 5px apart: three across, four down) */
    background: radial-gradient(circle, var(--soft) 1.1px, transparent 1.5px) 0 0 / 5px 5px; }
  .close { right: 5px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--soft);
    font: 18px/22px system-ui, sans-serif; cursor: pointer; }
  .close:hover, .close:focus-visible { color: var(--ink); background: #262E34; outline: none; }
  @media (hover: hover) { .tile:hover .grip, .tile:hover .close { opacity: 1; pointer-events: auto; } }
  .tile.lifted .grip, .tile.lifted .close, .tile.armed .grip, .tile.armed .close, .tile:focus-visible .close, .tile:has(.close:focus-visible) .close
    { opacity: 1; pointer-events: auto; }
  /* A tile can take the keyboard's focus (Enter or Space zooms it): its frame lit then, rather than the browser's outline. (A click
     on the text focuses it too, unseen: hence the × above shown for the keyboard's focus only.) */
  .tile:focus { outline: none; }
  .tile:focus-visible::before { border-color: var(--soft); }
  body.dragging .tile:not(.lifted) .grip, body.dragging .tile:not(.lifted) .close { opacity: 0; }
  /* A tile whose reading calls up an effect behind the tiles (Sky): framed in red, its frame alone (thin, as the others'); before the
     drag's frames below, so a framed tile lifted, or over the remove zone, shows those as any other */
  /* (Off for now, the class still set: to bring the red frames back, restore these two rules.)
  .tile.alert::before { border-color: #D9363E; }
  .tile.alert:focus-visible:not(.lifted)::before { border-color: #FF9EA1; } */
  .tile.lifted { z-index: 2; transition: opacity 0.9s ease; }    /* follows the pointer: no easing of its own */
  .tile.lifted::before { border-color: #5A6670; }
  .tile.doomed::before { border-color: #E5484D; }
  body.dragging, body.dragging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }
  /* The remove zone: slides down from the top while a tile is dragged; a tile dropped on it is hidden */
  #remove { position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 3; display: flex; align-items: center; justify-content: center;
    font-size: 15px; letter-spacing: 0.04em; color: #F2B8B5; background: rgba(58, 22, 26, 0.92); pointer-events: none;
    transform: translateY(-100%); transition: transform 0.2s ease; }
  #remove.on { transform: none; }
  #remove.over { color: #FFFFFF; background: rgba(150, 34, 42, 0.95); }
  /* The weather behind everything (Sky, below): one canvas, the window's size, fixed, first in the page; its pixels scaled up crisply */
  /* (Past the window's top and bottom by --over: a phone's address bar sliding away shows more page than the layout viewport was when
     the weather was sized, for a moment or on some browsers for good. The first canvas is the window's own size, the other two the
     margins above and below it (Sky mirrors the first's top and bottom rows into them), placed by Sky's resize().) */
  #sky { --over: 100px; position: fixed; left: 0; right: 0; top: calc(-1 * var(--over)); bottom: calc(-1 * var(--over)); z-index: 0; overflow: hidden; pointer-events: none; }
  #sky canvas { position: absolute; left: 0; top: var(--over); image-rendering: crisp-edges; image-rendering: pixelated; }
  #status { position: fixed; right: 0; bottom: 0; height: var(--status, 18px); padding: 0 10px; font-size: 12px;
    line-height: var(--status, 18px); color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; z-index: 1; }
  #status .link, #reset .link, #motion .link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    text-decoration-color: #5A6670; text-underline-offset: 2px; }
  #status .link:hover, #status .link:focus-visible, #reset .link:hover, #reset .link:focus-visible, #motion .link:hover, #motion .link:focus-visible { color: var(--ink); }
  /* The bottom left corner: "stop" (while an effect is called for), as the strip; beside the strip, or just above it where
     there's too little room beside it (placeCorner()). Whatever else comes before it in the corner sits to its left. */
  #corner { position: fixed; left: 0; bottom: 0; z-index: 1; display: flex; height: var(--status, 18px); max-width: 100vw; }
  #motion { flex: none; padding: 0 10px; font-size: 12px; line-height: var(--status, 18px); white-space: nowrap; color: var(--soft);
    background: rgba(20, 25, 29, 0.85); border-top-right-radius: 6px; }
  #motion:empty { display: none; }
  /* "tilt": on an iPhone or iPad only (its motion sensors ask first, from a tap), till it's answered */
  #tilt { flex: none; padding: 0 10px; font-size: 12px; line-height: var(--status, 18px); white-space: nowrap; color: var(--soft);
    background: rgba(20, 25, 29, 0.85); border-top-right-radius: 6px; }
  #tilt:empty { display: none; }
  #tilt .link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    text-decoration-color: #5A6670; text-underline-offset: 2px; }
  #tilt .link:hover, #tilt .link:focus-visible { color: var(--ink); }
  /* MCP_DASHBOARD_ANIMATIONS low or off, or reduced motion: no weather behind the tiles at all, nor its link or test links */
  html:not([data-animations="on"]) :is(#sky, #corner) { display: none; }
  @media (prefers-reduced-motion: reduce) { :is(#sky, #corner) { display: none; } }
  html.scroll { scroll-snap-type: y proximity; scroll-padding-top: var(--pad, 8px); }
  .tile { scroll-snap-align: start; }
  html.scroll:has(body.dragging) { scroll-snap-type: none; }   /* (a drag's own scrolling stops where it stops) */
  /* The units' switches ("°C | °F", "km/h | mph", "hPa | inHg", "mm | in"), the active one lit: just left of the strip, as one with it; where the window is
     too narrow for both side by side (a phone, a long strip), just above it at the right (placeCorner()) */
  #units { position: fixed; right: 0; bottom: 0; z-index: 1; display: flex; align-items: center; gap: 4px; height: var(--status, 18px);
    padding: 0 0 0 8px; font-size: 11px; color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; white-space: nowrap; }
  body[data-units="above"] #units { padding-right: 10px; }
  body[data-units="beside"] #status { border-top-left-radius: 0; }
  /* "reset preferences", when something is changed: its own piece of the bar, left of the units' switches (so they never move for it:
     it grows the bar leftwards), on their row where it fits, else just above that row (placeCorner()) */
  #reset { position: fixed; right: 0; bottom: 0; z-index: 1; height: var(--status, 18px); padding: 0 8px 0 10px; font-size: 12px;
    line-height: var(--status, 18px); white-space: nowrap; color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; }
  #reset:empty { display: none; }
  #reset .link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    text-decoration-color: #5A6670; text-underline-offset: 2px; }
  body[data-reset="row"] #units { border-top-left-radius: 0; }
  #units .switch { display: inline-flex; height: 14px; border: 1px solid #3A444C; border-radius: 4px; overflow: hidden; }
  #units button { font: inherit; line-height: 12px; padding: 0 3px; margin: 0; border: 0; border-radius: 0; background: none; color: #8A9299; cursor: pointer; }
  #units button + button { border-left: 1px solid #3A444C; }
  #units button:hover { color: var(--ink); }
  #units button[aria-pressed="true"] { background: #3A444C; color: var(--ink); cursor: default; }
  #units button:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
  #status.lost { color: #F4A93B; }
  /* A device whose reading is over an hour old (showStatus): its name and time, or with none fresh the whole time, greyed out */
  #status .stale { color: #737B82; }
  #message { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center;
    font-size: 20px; color: var(--soft); }
  body.unavailable #message { display: flex; }
  /* The cursor: over a gauge, a magnifier with + (a click zooms it, a single tile too), with − in the zoomed view (a click goes
     back); over the text, the usual one. (.tablearea: under the table's chips, so the gaps between them count as the table.) */
  body:not(.zoomed) .tile { cursor: zoom-in; }
  body.zoomed #grid { cursor: zoom-out; }
  .title, .unit, .chip, .figure, .tile svg text.reading { cursor: auto; }
  .tablearea { cursor: default; }
  /* The zoomed view, a gallery: #grid becomes a strip of the visible tiles side by side, each as large as fits and centred in its own
     window-wide place (the strip as wide as them all, so it's under the pointer wherever it is), slid sideways (its transform) to page
     through them; the page itself doesn't scroll meanwhile, and a
     sideways swipe never reaches the browser (no back/forward). The grip and × aren't needed here: hidden. */
  html.zoomed, html.zoomed body { overflow: hidden; overscroll-behavior-x: contain; }
  body.zoomed #grid { max-width: none; position: fixed; inset: 0 auto 0 0; width: calc(var(--n) * var(--pitch)); display: block; padding: 0; min-height: 0;
    touch-action: pinch-zoom;
    -webkit-user-select: none; user-select: none; }
  body.zoomed .tile { position: absolute; top: var(--zy); left: calc(var(--zx) + var(--i) * var(--pitch)); width: var(--zw); height: var(--zh); }
  body.zoomed .grip, body.zoomed .close { display: none; }
  /* Zoomed (the gallery's tiles too), only the title and the gauge: the tile's box just their part of it (--zh), the Daily/Monthly/
     Yearly table hidden: gone at once as the tile grows, and while it shrinks back (never drawn large over the others), then fading
     in, in its place */
  .unit, .chip, .figure, .tablearea { transition: opacity 0.15s ease; }
  body.zoomed .tile.fading { height: var(--zfull); }   /* (fading out where they were: whole, their table too) */
  body.zoomed .tile:not(.fading) :is(.unit, .chip, .figure, .tablearea), .tile.zooming :is(.unit, .chip, .figure, .tablearea)
    { opacity: 0; visibility: hidden; transition: none; }
  .tile.zooming { z-index: 2; }        /* (the tile zooming in or out, over the others) */
  body.paging, body.paging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }
  /* MCP_DASHBOARD_ANIMATIONS low: the zoom at once, so the tables shown again at once too as it ends */
  html[data-animations="low"] .tile :is(.unit, .chip, .figure, .tablearea) { transition: none !important; }
  /* MCP_DASHBOARD_ANIMATIONS off, or reduced motion: no transition anywhere, each change in one step */
  html[data-animations="off"] :is(*, *::before, *::after) { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { :is(*, *::before, *::after) { transition: none !important; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><canvas></canvas><canvas></canvas><canvas></canvas></div>
<main id="grid" aria-live="polite"></main>
<div id="message"></div>
<div id="remove" aria-hidden="true">× remove</div>
<div id="corner"><div id="motion"></div><div id="tilt"></div></div>
<div id="reset"></div>
<div id="units" role="group" aria-label="Units"></div>
<div id="status">loading…</div>
<script>
"use strict";
// The room the page really has: the root element's client size (not window.innerWidth/Height, which a phone's browser zooms out
// (reports the zoomed-out width) when a stale, too wide frame overflows after a rotation: the page then stays zoomed and off-centre)
const screenRoom = () => ({w: document.documentElement.clientWidth, h: document.documentElement.clientHeight});
// ---------- the weather behind the tiles: pixel art on one canvas filling the window, behind everything ----------
// Drawn at a low resolution (one art pixel: P CSS px, about a third of the window across) and scaled up crisply (image-rendering:
// pixelated). Every sprite and texture is drawn once to a small offscreen canvas and blitted; one loop (at most 30 frames a second)
// for every effect, each frame cleared once and drawn back to front (ORDER). The effects share a particle budget and a cap on their
// strength together, so several at once are no busier or brighter than one strong one; but the humidity's beads stay out of the
// budget (OWN_BUDGET: their own limits bound them, so heavy rain keeps every drop beside them), and the rain out of the cap
// (OWN_STRENGTH: drawn at its own strength whatever else is on). Nothing runs while no effect is on or fading
// out; the tab hidden, it waits. Only with MCP_DASHBOARD_ANIMATIONS on and no reduced motion asked for: otherwise the page never
// sets it going (animate false), and nothing is drawn, no loop, no frame.
//   Sky.set(want, animate): want {rain: 0-1 (its strength), haze: 0-5 (the AQI's band above Good), humidity: 0-1 (90 % to
//   100 %), uv: 0-1 (the UV index from 6 to 11), wind: 0 or 1, heat: 0-1 (35 °C to 43 °C), ice: how far below 0 °C it is (0: none), flood: 0-1 (the bucket's depth of full, from 0.05; 2: the test link's, full, its first frog
//   sooner)}; animate false (the page's "stop", MCP_DASHBOARD_ANIMATIONS low or off, or reduced motion): nothing drawn (and
//   anything blown across gone).
//   Sky.setSun({rise, set, now, az, el, noon_el}): the station's sunrise and sunset and the time of day now (minutes since its local midnight: the page's
//   data's `sun`; az and el: the sun's real place there, degrees from north clockwise and above the horizon; noon_el: the day's highest elevation), by which
//   the sun (the heat's white ball, the UV's beams round it) travels its arc across the window (the day fraction t from sunrise to sunset; none outside
//   daylight) and the UV's beams lean (-atan(sin az / tan el), at most 75 degrees, toward the sun: down-left in the morning, down-right in the afternoon,
//   straight down at solar noon; without az and el the sunrise-sunset curve: straight down at midday, 70 degrees by sunrise and sunset);
//   Sky.setSunPosition(az, el) (test-only): the place pinned (null: unpinned); Sky.setTime(minutes) (test-only): the time of day fixed there
//   (null: by the clock again; window.__skyTest.time: at the start). Sky.state().beam: {lean: degrees from vertical now, negative
//   down-left (morning), positive down-right, az, el (null on the curve), up, real, minutes, rise, set, noon, noonEl, t, day, fixed, and the UV's
//   own: level, index, uvn, amp, count, diameter, lobe, beams [{angle, length, width, bright, weight, off}], at(i, f)}.
//   Sky.setWindSpeed(speed, gust): the live wind's speed and gust, km/h (the Wind tile's reading and the gust, from the page's data): the
//   rain's slant follows them continuously (per layer, tan of its angle from vertical = speed / its drops' terminal speed, see Sky.setRainRate: 25 km/h at 5 mm/h about 66, 55 and 48 degrees far, mid, near; none at no wind: straight
//   down; at most 70 degrees; the gust adding 0.3 of what it is over the speed; the speed eased, rising over about 2 s, falling over
//   about 4); the haze's sideways pan follows them too (about 0.4 px/s at 3 km/h to 2.6 at 40: none at no wind). The wind's leaves follow it too: their pace (and the gust bands', the turbulence's and the eddies' drift) is scaled by k = clamp(0.4 + 0.024 s, 0.5, 1.6), s the same effective speed eased the same way (25 km/h: the old pace, 1); a third argument true (the test links', over a real speed under their 11 km/h) holds k at 1. Sky.state().wind: {k, speed (the eased s), ...}.
//   A strong wind pushes the humidity's beads off straight down, downwind: with the speed s (the same eased effective speed, gust share
//   included), p = 0.6 * smoothstep((s - 15) / 30) (none under 15 km/h, 0.3 at 30, 0.6 from 45), the beads' way = the gravity (straight
//   down, or the phone's tilt) plus p * dir.f * (the steepness factor) along the screen's row, normalized: at most about 31 degrees off
//   vertical, downwind; pooled (flat) beads stay put; their speed is unchanged. Sky.state().humidity.windPush: {p, speed, side, factor,
//   push, angle (degrees off straight down, positive rightward)}; each bead's `angle` while it runs. The page's ?windspeed=40 (km/h) sets
//   the effective speed while a test link is on (?fx=humidity2,wind-west for a rightward wind).
//   Sky.setPm25(pm): the air sensor's PM2.5 now, µg/m³ (null: the band's midpoint): the haze's opacity (1 - exp(-0.01457 pm), at most 0.97) and tint follow it continuously.
//   Sky.setRainRate(rate): the live rain rate, mm/h (the gauge's; none: a nominal 5): the median drop D0 = 0.9 R^0.21 mm (R clamped 0.5-100, Marshall-Palmer)
//   sizes the layers (0.6, 1, 1.5 times D0), each with its terminal speed v_t = 9.65 - 10.3 exp(-0.6 D) m/s, its fall speed and its lean; the heavy rain's beads on the glass grow with D0 (2.6 to 2.97 px).
//   Sky.state().rain also has rate, d0, beadR and layers: [{angle (radians), angleDeg, vt, D, v (px/s)}] far to near (slant, slantDeg: the mid layer's).
//   Sky.state().rain: {slant (radians from vertical, positive leftward), slantDeg, speed (the eased km/h), target (the speed it
//   heads for), tilts (the streak sprites' steps in use, of tiltSteps: 21, 3.5 degrees apart), vxMax (the fastest drop across)}.
//   Sky.setWind(d): the way the wind blows, -1 leftward (the default: a reading from the east side, 0 < degrees < 180) or +1
//   rightward (from the west side, 180 < degrees < 360); 0 holds the way it is (due north or south: 0, 180, 360; or no reading).
//   Everything that follows the wind follows it: the wind's leaves (where they come in: upwind), the haze's pan (with the live wind's
//   speed only), the
//   rain's slant (by the wind's speed: Sky.setWindSpeed) and push (its streaks mirrored), the flood's frog (in from upwind, swimming downwind, its sprite mirrored) and
//   its waves (carried downwind), the leaves floating on it, the gust's cow, barn or chicken (mirrored): rightward the exact mirror of
//   leftward. (The humidity's beads aren't mirrored: they follow gravity, pushed downwind by a strong wind: see aim().) A change eases over DIR_S s: the factor dir.f, -1 to +1, applied to
//   every velocity and slant; the sprites turning over as it passes 0. Sky.state(): windDir (the side now, -1 or +1), windTarget,
//   windFactor (-1 to +1), windFlips (how often the side has turned over); wind.dir and wind.factor the same. The air's eddies are
//   not turned by it: the leaves' mean wind is the steady drift, the eddies' swirl on top (the turbulence and the vortices) goes on
//   round the same way throughout. A leaf in an eddy doesn't stop and reverse along its line: its mean wind VEERS, its heading
//   turning 180 degrees over VEER_S (9 s) at its full speed, through up (the first turn of a page) and down (the next), alternating,
//   so it goes round in a U in front of the eddy (or an S, where the swirl opposes the veer); a leaf in none (how much of one it is
//   in: 0 to 1, by how fast a vortex swirls the air there against the mean wind) reverses along its line as the factor does, one
//   in a weak eddy partly each. Sky.state(): windVeerSide (+1 up, -1 down, 0 before the first turn), windVeerAngle (radians, 0
//   rightward, pi/2 up), windVeering; wind.leafStates: each leaf's {x, y, vx, vy, eddy, straight, veer, mean, heading} on screen.
//   Test-only: Sky.lab({still, eddy: {x, y, r, spin}, leaf: {x, y, layer, pinned}}): the wind's air set up by hand (null: back to
//   itself), Sky.air(x, y, layer): the air there in parts (the eddies' swirl, the leaf's mean wind).
//   Sky.fling(kind): something big blown across far behind (a gust over 99 km/h): "cow", "barn" or "chicken", else one at random;
//   its kind, or null (nothing drawn: stopped, no weather, the tab hidden). The gust effect is on while one is crossing.
//   Sky.state(): {effects, running, frames, cost (ms a frame, averaged), clock (the weather's time, s), size: [art width, art height,
//   P], particles (each effect's
//   now), budget (theirs together, at most: the humidity's (own) aside), drawn (each effect's strength as last drawn: the cap's,
//   and the rain's own), cap, levels, iceReach (art px), wind (its leaves on screen: {vx: their mean speed across,
//   negative leftward, against: how many go rightward, hits: how many the rain's drops have hit, push: their mean push, px/s,
//   kick: the mean change in a hit leaf's own velocity a hit made, px/s,
//   whirl: the most spin knocks have left on one now}), rain (its drops: {xs: where across, those in the window's lower half,

    // streak()). The landing rate per area is the same at every angle (the same fall speed: the same count in flight); each layer
    // spawns over its own lean's extent.
    const CAP = 70 * Math.PI / 180, TAN_CAP = Math.tan(CAP);
    const OLD_SLANT = 0.45, PATH = Math.sqrt(1 + OLD_SLANT * OLD_SLANT);   // (the old default's path over its vertical: 1.097, the calm streak's length over its (n - 1) rows)
    const STREAK_MOST = 1.6;           // a streak grows with the path speed to at most this many times its calm length
    const cosOf = (slant) => 1 / Math.sqrt(1 + slant * slant);   // (the cosine of the angle whose tangent is `slant`)
    const STEPS = 20;                  // the streaks drawn at STEPS + 1 slants, evenly in angle from vertical to CAP (3.5 degrees apart)
    const SLANTS = Array.from({length: STEPS + 1}, (_, i) => Math.tan(CAP * i / STEPS));
    let speed = 0, seeded = false;     // the smoothed speed (km/h) the slant follows
    const effective = effectiveSpeed;
    const LAYERS = [                   // far (short, dim, small drops) to near (large); [tail, body, head] shades
      // (size: the layer's drop diameter over D0; near: how near it is, 0-1, the wind's air at that strength on it (the old speeds
      // over the fastest's: 150 / 330, 230 / 330, 1); ripple: a flood's, where it lands, px down)
      {size: 0.6, near: 150 / 330, length: [3, 4], alpha: 0.55, shades: [0, 1, 2], share: 0.45, ripple: 0.3},
      {size: 1.0, near: 230 / 330, length: [5, 6], alpha: 0.8, shades: [1, 2, 3], share: 0.33, ripple: 0.6},
      {size: 1.5, near: 1, length: [8, 10], alpha: 1, shades: [1, 3, 4], share: 0.22, splash: true, ripple: 1.1}];
    // The layers' physics for the rain rate now (R, from gale.rain): D0, each layer's drop size D = size * D0 (mm) and terminal speed
    // v_t (m/s), its fall speed (px/s, art: the old defaults 150 / 230 / 330 were these at the mid layer's 230 for R = 5 mm/h, in
    // the v_t ratios, the whole scaled by the mid layer's v_t over its v_t at 5 mm/h, 0.7 to 1.3: drizzle slower, a downpour faster),
    // and its lean: tan(angle) = wind / v_t (the wind in km/h, v_t * 3.6), so small drops lean further than big ones, and heavy rain
    // (larger drops, faster) less than drizzle; capped at CAP below.
    const MID_SPEED = 230, REF_VT = vtOf(d0Of(RAIN_NOMINAL));
    const physics = () => {
      const R = rainRate(), d0 = d0Of(R), vts = LAYERS.map((l) => vtOf(l.size * d0)), scale = clamp(vts[1] / REF_VT, 0.7, 1.3);
      return {R, d0, beadR: beadROf(d0), layers: LAYERS.map((l, k) => ({D: l.size * d0, vt: vts[k], fall: vts[k] * 3.6, v: MID_SPEED * scale * vts[k] / vts[1]}))};
    };
    let phys = physics();
    const slantOf = (kmh, k) => Math.min(TAN_CAP, Math.max(kmh, 0) / phys.layers[k].fall);   // px across for each px down, of layer k
    // A streak: its bright head at the bottom left, its tail fading up to the right
    // (n: the rows it has at the old default's slant; its length along its path is (n - 1) * PATH when calm, growing with the path
    // speed (1 / cos(angle)) to STREAK_MOST times that: rows and columns from that length's cosine and sine)
    const streak = (n, [tail, body, head], tan) => {
      const len = (n - 1) * PATH * Math.min(STREAK_MOST, 1 / cosOf(tan)), rows = Math.max(1, Math.round(len * cosOf(tan))), across = Math.round(len * tan * cosOf(tan)), slant = across / rows;
      const w = across + 1, h = rows + 1;
      return painted(w, h, (x, y) => {
        if (x !== Math.round((h - 1 - y) * slant)) return null;
        const p = y / (h - 1);
        return [...RAIN[p > 0.8 ? head : p > 0.35 ? body : tail], Math.round(255 * (0.3 + 0.7 * p))];
      });
    };
    const sprites = LAYERS.map((l) => l.length.map((n) => SLANTS.map((slant) => streak(n, l.shades, slant))));   // [layer][length][slant]
    // ... and each one's mirror image, for rain slanting rightward (head at the bottom right, drawn so: see draw())
    const mirrors = sprites.map((layer) => layer.map((lengths) => lengths.map(flipped)));
    const leaning = (slant) => clamp(Math.round(Math.atan(Math.max(slant, 0)) / CAP * STEPS), 0, STEPS);   // the nearest of SLANTS
    const tilt = (d, slant) => {   // (its streak leaning at `slant`: the sprite, mirrored for rightward)
      d.tilt = leaning(slant);
      d.sprite = (d.flip ? mirrors : sprites)[d.layer][d.li][d.tilt];
    };
    // The drops' count is the plain budget (need() times the share) at every slant: the fall speed is the same, and a drop blown out of
    // the window's side starts again (step), so the landing rate per area is too.
    const push = (k) => slantOf(speed, k) / OLD_SLANT;   // (the wind effect's push and bands, in proportion to the slant: none at no wind, as the gusts are of the wind's own strength; the old fixed slant's as 1)
    // A splash, frame by frame: a bead, a crown, droplets thrown wider, falling back ([dx, dy, shade] from where the drop landed)
    const SPLASH = [[[0, 0, 4], [0, -1, 3]],
                    [[0, 0, 2], [-1, -1, 4], [1, -2, 3]],
                    [[-2, -2, 3], [2, -3, 2], [0, 0, 1]],
                    [[-3, -1, 2], [3, -2, 1]],
                    [[-4, 0, 1], [3, -1, 1]]].map((dots) =>
      painted(9, 5, (x, y) => { const d = dots.find(([dx, dy]) => dx + 4 === x && dy + 4 === y); return d && RAIN[d[2]]; }));
    const SPLASH_R = SPLASH.map(flipped);
    let drops = [], splashes = [], under = 0, landed = 0;
    const spawn = (d, anywhere) => {
      const l = LAYERS[d.layer];
      d.li = random() < 0.5 ? 0 : 1;   // (its length: the shorter or the longer)
      d.flip = dir.f > 0;
      tilt(d, slantOf(speed, d.layer));
      d.jit = between(0.85, 1.15);
      d.v = phys.layers[d.layer].v * d.jit;   // (its vertical fall speed, its layer's, the same at every slant)
      d.y = anywhere ? between(-10, H) : between(-H * 0.25, -10);
      // Where it comes in: over the top edge, or, the wind blowing it across, in over the upwind side (right, or left blowing
      // rightward), each in proportion to the air they let in (the top's width, the side's height times the lean: its slant, and with the wind effect its steady push on this drop), so the rain falls evenly across the
      // whole window whatever the slant and none is wasted off to the side: the spawn extent grows with the slant. (Starting out, over
      // the window itself, evenly.)
      const lean = (slantOf(speed, d.layer) + wind.steady(l.near) * push(d.layer) / (d.v * (0.8 + 0.4 * e.level))) * Math.abs(dir.f);   // (this layer's own lean: the most leaning layer's region covers the width)
      const u = anywhere ? 0 : between(0, W + H * lean);
      if (anywhere) d.x = between(0, W);
      else if (u < W) d.x = u - dir.side * Math.max(-d.y, 0) * lean;   // (over the top: back along its path from where it crosses the top edge)
      else {                     // (over the side: as far down it as the air it let in, its head just outside)
        d.x = dir.side < 0 ? W + 1 : -1;
        d.y = (u - W) / lean;
      }

      strength: () => 0.55 + 0.35 * e.level,
      need: () => (W * H / 1000) * (0.1 + 2.4 * Math.pow(e.level, 1.5)),   // (light: about 71 drops on a laptop, 480 x 300; heavy: 360)
      count: () => drops.length,
      // (for the tests: where the drops are across, on screen in the window's lower half (art px), and their mean speed across, px/s,
      // negative leftward)
      probe: () => (phys = physics(), {landed,   // (the drops that have landed in the window: on the floor or a flood)

                     // the mean length of their streaks along the path over (n - 1) (px; PATH when calm)
                     pathRatio: drops.reduce((m, d) => m + Math.hypot(d.vx, d.vy) / (d.v * (0.8 + 0.4 * e.level)), 0) / Math.max(drops.length, 1),
                     downRatio: drops.reduce((m, d) => m + d.vy / (d.v * (0.8 + 0.4 * e.level)), 0) / Math.max(drops.length, 1),
                     streakLen: drops.reduce((m, d) => m + Math.hypot(d.sprite.width - 1, d.sprite.height - 1) / (LAYERS[d.layer].length[d.li] - 1), 0) / Math.max(drops.length, 1),
                     xs: drops.filter((d) => d.y > H / 2 && d.y < H && d.x >= 0 && d.x < W).map((d) => Math.round(d.x)), width: W,
                     under,   // (drawn last with its head below a flood's surface)
                     mirrored: drops.filter((d) => d.flip).length,   // (those slanting rightward: their sprites mirrored)
                     // the slant now (the base, without its breathing): radians and degrees from vertical, positive leftward (negative
                     // rightward); the smoothed speed (km/h) it follows, and the speed it is heading for; the streak tilts in use (of 21);
                     // the most any drop moves across (px/s)
                     slant: -dir.f * Math.atan(slantOf(speed, 1)), slantDeg: -dir.f * Math.atan(slantOf(speed, 1)) * DEG, speed, target: effective(),
                     // the drop sizes now: the rain rate R (mm/h), the median diameter d0 (mm), the landing bead's radius (px), and each layer's
                     // (far to near) lean angle (radians from vertical, positive leftward, and in degrees), terminal speed vt (m/s), drop
                     // diameter D (mm) and vertical fall speed v (art px/s); slant and slantDeg are the mid layer's
                     rate: phys.R, d0: phys.d0, beadR: phys.beadR,
                     layers: phys.layers.map((l, k) => ({angle: -dir.f * Math.atan(slantOf(speed, k)), angleDeg: -dir.f * Math.atan(slantOf(speed, k)) * DEG, vt: l.vt, D: l.D, v: l.v})),
                     tilts: [...new Set(drops.map((d) => d.tilt))].sort((a, b) => a - b), tiltSteps: STEPS + 1,

      forget() { drops = []; splashes = []; under = 0; landed = 0; seeded = false; },
      resize() {
        drops = [];
      },
      step(dt, t, share) {

          const k = drops.length / Math.max(n, 1);

        // them as carried along at its own pace across (rate), so each bunches, whatever the slant: the layers' speeds across
        // spread further apart the steeper it is)

        const ridden = Math.max(carried(1), 1);

        const hard = 0.04 + 0.96 * Math.pow(e.level, 2.5);

          if (windy) {   // (the wind's air where it is, leftward px/s; the streak leaning to match: sideways over down)
            // (in a lull it can blow back against the drop's own lean, so they fall almost straight down; never back up the window)
            // (it leans over by the air's push on top of its own across, its fall as it was)
            const own = down * sway, air = Math.max(wind.across(d.x, LAYERS[d.layer].near, carried(d.layer) / ridden) * gain, -0.7 * own);
            const lean = (own + air) / down;   // (leftward: dir.f -1, rightward +1; between, it swings over)
            d.vy = down;
            d.vx = dir.f * down * lean;
            d.y += d.vy * dt;
            d.x += d.vx * dt;
            d.flip = dir.f > 0;
            tilt(d, lean * Math.abs(dir.f));
            if (wind.knock(d.layer, x0, y0, d.x, d.y + d.sprite.height - 1, d.vx, d.vy, hard)) { spawn(d, false); continue; }
          } else {
            d.vy = down;
            d.vx = dir.f * down * sway;
            d.y += d.vy * dt;
            d.x += d.vx * dt;
            d.flip = dir.f > 0;
            tilt(d, sway * Math.abs(dir.f));
          }

          // the window and the rate they land at per area is the same at every slant: what a constant fall speed gives)
          if (d.vx < 0 ? d.x + d.sprite.width < 0 : d.vx > 0 && d.x - d.sprite.width > W) { spawn(d, false); continue; }

            flood.hit(d.x, LAYERS[d.layer].ripple, !!LAYERS[d.layer].splash);

            spawn(d, false);
            continue;
          }

      draw(g, alpha) {

          const y = Math.round(d.y);

    };

  // No clouds and no sprites, and nothing evolving: one veil over the whole window, thickening and thinning unevenly, BAKED ONCE off
  // screen into a static image that wraps sideways (twice the window's width or more, the window's height) and then only PANNED
  // sideways behind the window. Three depth layers of baked, domain-warped noise (value noise displaced by more noise, once: its
  // features stretched four to eight to one along the wind, each row sheared a little so the streaks lean, as for the wind blowing
  // leftward) are summed into that one image: the denser cores more opaque and darker, the thin edges clearer and lighter, its shade
  // chosen by the band (the AQI gauge's own scale, lib/gauge_look.py's EPA colours yellow, orange, red, purple and maroon, as smog:

  const HAZE = [   // each band's look: its thin edge's tint, its dense core's (dark), the cut in the layers' summed texture (lo: 0-1, lower with the band: more of it past), how far above it takes to the thickest, its top opacity
    {thin: [204, 200, 156], core: [150, 144, 86], lo: 0.50, span: 0.50, open: 0.7},   // Moderate (the gauge's yellow, grey and faint)
    {thin: [216, 190, 100], core: [172, 140, 42], lo: 0.42, span: 0.55, open: 0.7},   // Unhealthy for Sensitive Groups (orange: sulphur-yellow, ochre)
    {thin: [198, 148, 84], core: [146, 98, 38], lo: 0.32, span: 0.60, open: 0.8},     // Unhealthy (red: ochre-brown)
    {thin: [176, 106, 80], core: [122, 58, 42], lo: 0.22, span: 0.65, open: 0.9},      // Very Unhealthy (purple: brown-red)
    {thin: [136, 70, 64], core: [82, 30, 38], lo: 0.10, span: 0.70, open: 1}];          // Hazardous (maroon: dense, dark, murky)
  // The opacity follows the air sensor's PM2.5 itself, continuously (Beer-Lambert with Koschmieder's view: extinction (1/m) =
  // 4e-6 * PM2.5 (µg/m³; 4 m²/g mass extinction), over an effective viewing distance L = 3643 m: opacity = 1 - exp(-0.01457 * PM2.5),

  // PM2.5 reading the band's midpoint is taken. Its tint runs continuously between the bands' (by the PM2.5's place among the bands'

  const PM_EXT = 0.01457, PM_CAP = 0.97, PM_EDGES = [9, 35.4, 55.4, 125.4, 225.4, 325.4];   // (1/(µg/m³), cap, the bands' edges: the last's top for its midpoint)

    const FADE = 1;                    // s: the old image and the new cross-faded
    const HOLLOW = 10;                 // how far each texture's values are dropped (0-255) before summing
    const LAYERS = [   // far to near: its noise's cells [across, down] in three octaves, how much it adds, its shear (px across per px down), its seed
      {cells: [[128, 16], [64, 8], [32, 8]], weight: 0.6, shear: 0.07, seed: 7100},
      {cells: [[256, 32], [128, 16], [64, 8]], weight: 0.85, shear: 0.12, seed: 7200},
      {cells: [[256, 32], [256, 16], [128, 8]], weight: 1, shear: 0.18, seed: 7300}];

  // ---------- wind: autumn leaves blowing past right to left (or left to right: see dir), three deep, caught in eddies and gusts ----------

    // the leaf where it hit. A flood: none blown in under its water; one its surface reaches is the flood's (wade()).

    // drops bunch; on narrow art (a phone's) shorter, so a curtain and a gap or two still fit across. And how strongly, more after a gust

    // draws what is near onto) times `lam` (default |dir.f|: the wind's turn: it stops and reverses along its line as it turns), plus

      // eddies: each a vortex, still at its eye, swirling fastest a little way out, fading beyond; near it the air goes along with it.
      // While it lasts it draws what comes near onto a ring round its eye (so leaves are caught and go round), then flings them off.

    // straight scale of the flip (-1 to +1 along its line) and where it veers, its full speed turned by the veer's heading; the
    // two blended by w. Returns [worked vx, worked vy, curl, w, straight, veer, mean] (the arrays fresh).

      const mean = [straight[0] + (veer[0] - straight[0]) * w, straight[1] + (veer[1] - straight[1]) * w];
      return [e[0] + dir.side * mean[0], e[1] + mean[1], e[2], w, straight, veer, mean];
    }
    const eddy = (d, anywhere) => {
      // (on narrow art, a phone's, an eddy's radius at most 0.3 of the art's narrower side, and drifting slower, so it lasts its life
      // on screen rather than being swept across in a moment)
      const narrow = clamp(W / 360, 0.35, 1);
      d.r = Math.min(between(26, 46), 0.3 * Math.min(W, H));
      const edge = Math.min(0.6 * d.r, 0.3 * W);
      d.x = between(edge, anywhere ? W - edge : Math.max(edge, 0.6 * W));   // (springing up on screen, spinning up in place)
      d.y = between(Math.max(H * 0.12, d.r * 0.6), Math.min(H * 0.88, H - d.r * 0.6));
      d.spin = (random() < 0.5 ? -1 : 1) * between(4.5, 6) * d.r;   // (its fastest swirl about 0.43 this, px/s: a turn in 2 s or so)
      d.v = DRIFT * between(0.6, 0.85) * narrow;   // (lagging the wind: swirling faster than it moves, so leaves loop)
      d.sd = dir.target;   // (the way it drifts, on screen: leftward -1; worked out as downwind +x with the side now: see step)
      d.vx = d.u = d.v; d.vy = 0;
      d.age = anywhere ? between(0, 4) : 0;
      d.life = between(5, 9);
      d.wander = between(0, 7);
      d.on = 0; d.draw = 1; d.rest = 0;
    };
    // An eddy's cycle: its life (5 to 9 s, 7 on average), then a REST (5 to 9 s, as long again on average: nothing of it, no swirl, drawn or
    // counted) before the next rises, so a new eddy spawns half as often as it did (a mean interval of 14 s a slot, not 7; the page's
    // slots, `want` of them, as before). A page opening is part way through: half the slots resting, for a random part of one.
    const EDDY_REST = [5, 9];
    const spawn = (f, anywhere) => {
      const set = leafSprites(dir.side)[f.layer], i = Math.floor(random() * set.length);
      f.i = i;
      f.frames = set[i];
      f.flat = set[i | 1];   // (the same leaf turning end over end: its frames squeezed flat, lying on water)
      f.id = ++born;
      f.x = anywhere ? between(-10, W) : between(-30, -8);
      f.y = between(H * 0.05, clamp(flood.clear() - 7, H * 0.05, H * 0.95));   // (never in a flood: above its highest crest)
      f.gap = Infinity;            // (its lowest row's height over the water as last drawn, px: none yet)
      f.vx = LAYERS[f.layer].speed * pacing * calm * Math.abs(dir.f); f.vy = 0;
      f.weight = between(0.12, 0.3);   // (s: how long it takes to catch the air's speed)
      f.turn = between(0, 10);
      f.spin = between(4, 9);
      f.sink = between(2, 10);
      f.phase = between(0, 7);
      f.whirl = 0; f.batter = 0;   // (rain's knocks: spin on top of its own, frames/s; sink on top of its own, px/s; both dying away)
      f.hw = -1;                   // (where it is on screen, for the rain: not yet)
    };
    // Where a leaf is drawn at time t: its frame, its left column and top row on screen (art px)
    const drawn = (f, t) => {
      const frame = f.frames[Math.floor(f.turn) % f.frames.length];
      return [frame, Math.round(sx(f.x) - frame.width / 2), Math.round(f.y + Math.sin(t * 2.3 + f.phase) * 1.2 - frame.height / 2)];   // (a flutter)
    };
    // How far its lowest row is above the flood's surface under it (the highest the water reaches across its columns on screen), px:
    // 0 or less, touching it (Infinity: no water under it)
    const gapOf = (f, t) => {
      const [frame, x0, y0] = drawn(f, t), bottom = y0 + frame.height - 1;
      if (bottom < flood.clear()) return Infinity;   // (well above its highest crest: no need to look)
      let top = Infinity;
      for (let x = Math.max(0, x0), end = Math.min(W - 1, x0 + frame.width - 1); x <= end; x++) top = Math.min(top, Math.round(flood.surface(x)));
      return top - bottom;
    };
    return {
      strength: () => 0.8,
      need: () => W * H / 2600 + flood.count(),   // (as many flying as ever, a flood's floating and sinking ones on top: its own)
      count: () => flying.length,
      // The air across, on screen at x (art px), on something `k` (0-1) as near as the nearest rain: leftward, px/s (none without the
      // wind); and its steady part. (Its bands not slowed on narrow art: there they are what's left of the wind in the rain.)
      across: (x, k, rate = 1) => e.amount * k * (calm * STEADY * (1 + gust) + BANDS * gusting() * bandAt(sx(x) - swept * rate)),
      steady: (k) => e.amount * k * calm * STEADY * (1 + gust),
      ride: (v) => { riding = v * Math.abs(dir.f); },   // (this frame, the gust bands carried along at v px/s, as hard as it blows now: the rain's)
      // (on screen: the leaves' mean speed across, px/s, negative leftward; how many go rightward, against the wind, in a loop)
      // (and the rain's hits on them so far, and their mean push, px/s, and the mean change it made in a hit leaf's own velocity, px/s;
      // the most spin knocks have left on one now, frames/s)
      probe: () => ({k: pacing, speed: wspeed,   // (the leaves' pace factor, and the effective wind speed it follows, eased: km/h)
                     vx: dir.side * flying.reduce((sum, f) => sum + f.vx, 0) / Math.max(flying.length, 1),
                     dir: dir.side, factor: dir.f,
                     against: flying.filter((f) => f.vx < 0).length, hits, push: pushed / Math.max(hits, 1),
                     kick: kicked / Math.max(hits, 1),
                     whirl: flying.reduce((most, f) => Math.max(most, f.whirl), 0),
                     // (in a flood: the leaves in it, the flood's own (flood.leaves()): see there; leaves: those flying and those)
                     ...flood.leaves(),
                     leaves: flying.length + flood.count(),
                     // (each flying leaf as drawn last: [id, its lowest row's height over the flood's surface under it (null: no
                     // water under it), x, y on screen])
                     flyers: flying.map((f) => { const gap = gapOf(f, lastT); return [f.id, gap < Infinity ? gap : null, sx(f.x), f.y]; }),
                     // (and each as it goes, on screen: where, its velocity, how much it is in an eddy 0-1, the mean wind it takes now (and
                     // its straight and veering parts), and the veer's heading now (radians, 0 rightward, pi/2 up), and the way it bulges)
                     leafStates: flying.map((f) => ({id: f.id, x: sx(f.x), y: f.y, vx: dir.side * f.vx, vy: f.vy, eddy: f.eddy, straight: f.straight,
                                                     veer: f.veer, mean: f.mean, heading: veerAngle()})),
                     veerAngle: veerAngle(), veerSide: dir.veer.side,
                     eddyRises: rises, eddySlots: eddies.length,   // (the eddies risen after a rest so far, and the slots they rise in: for the tests)
                     eddyStates: eddies.filter((d) => !(d.rest > 0)).map((d) => ({x: sx(d.x), y: d.y, r: d.r, spin: dir.side * d.spin}))}),
      // A drop of rain layer `layer` going from (x0, y0) to (x1, y1) this frame (its head, on screen, art px), at vx across and vy down
      // (px/s): if it hits a leaf as far off as itself, the leaf knocked (`hard` 0-1: how heavy the rain) and true (the drop ends)
      knock(layer, x0, y0, x1, y1, vx, vy, hard) {
        if (e.amount <= 0 || y1 <= y0) return false;   // (a drop that didn't fall this frame: no hit)
        for (const f of flying) {
          if (f.layer !== layer || f.hw < 0 || f.y + f.hh < y0 || f.y - f.hh > y1) continue;
          const at = sx(f.x), k = clamp((f.y - f.hh - y0) / (y1 - y0), 0, 1), x = x0 + (x1 - x0) * k;   // (where it meets the top)
          if (Math.abs(x - at) > f.hw) continue;
          const push = KNOCK * hard * LAYERS[layer].speed / LAYERS[2].speed * between(0.7, 1.3), v = Math.hypot(vx, vy);
          const was = [f.vx, f.vy];
          f.vx += dir.side * vx * push / v;   // (downwind: leftward on screen, or rightward)
          f.vy += vy * push / v;
          pushed += push;
          kicked += Math.hypot(f.vx - was[0], f.vy - was[1]);   // (the leaf's own speed, as it changed)
          f.whirl = Math.min(f.whirl + between(5, 12) * hard, 40);
          f.batter = Math.min(f.batter + between(8, 16) * hard, 70);
          hits++;
          if (splashes.length < 40) splashes.push({f, dx: Math.round(x - at), dy: Math.round(Math.max(y0 + (y1 - y0) * k, f.y - f.hh) - f.y), age: 0});
          return true;
        }
        return false;
      },
      resize() { flying = []; eddies = []; splashes = []; lab = null; },
      forget() { flying = []; eddies = []; splashes = []; gust = 0; owed = 0; lab = null; wseeded = false; },
      // (test-only) The air set up by hand, nothing random: `eddy` {x, y (on screen), r, spin (px/s a ring away, either sign), drift,
      // u} a vortex held where it is (or, with `drift`, drifting on its own way at u px/s), or none; `leaf` {x, y (on screen), layer, pinned} the only leaf; `still` the turbulence off. gust 0.
      // lab(null) puts the wind back to itself.
      lab(spec) {
        lab = spec ? {still: !!spec.still, hold: true} : null;
        flying = []; eddies = []; splashes = []; gust = 0;
        if (!spec) return;
        if (spec.eddy) {
          const e = spec.eddy, d = {};
          eddy(d, true);
          Object.assign(d, {x: sx(e.x), y: e.y, r: e.r || 36, spin: dir.side * (e.spin || 5 * (e.r || 36)), age: 5, life: 10, on: 1, draw: 1, vy: 0, u: e.u || 45, sd: dir.side, v: e.u || 45});
          lab.drift = !!e.drift;
          eddies.push(d);
        }
        if (spec.leaf) {
          const f = {layer: spec.leaf.layer || 0};
          spawn(f, false);
          Object.assign(f, {x: sx(spec.leaf.x), y: spec.leaf.y, pinned: !!spec.leaf.pinned, sink: 0, spin: 0});
          flying.push(f);
        }
      },
      // (test-only) the air at screen (x, y) for a layer, in parts as a leaf takes them, on screen: the eddies' [vx, vy] and curl, the mean
      // wind's at full strength, the eddy strength 0-1, the straight and veering mean wind and what the leaf takes of them
      sample(x, y, layer, t = lastT) {
        const [vx, vy, curl, w, straight, veer, mean] = leafAir(sx(x), y, LAYERS[layer].speed * pacing, t);
        const [ex, ey, ec] = airAt(sx(x), y, LAYERS[layer].speed * pacing, t, 0);
        return {eddy: [dir.side * ex, ey], curl: dir.side * ec, strength: w, straight, veer, mean, total: [dir.side * vx, vy]};
      },   // (not those in a flood: the flood's now)
      // The wind has turned (its factor crossed 0: dir.side is the new side, the steady wind nothing just now): everything worked out
      // downwind turned over to it, standing where it was on screen: x to W - x, the leaves' speed along reversed, their sprites the
      // other way (those on the water or the bottom as they were)
      flip() {
        for (const f of flying) {
          f.x = W - f.x; f.vx = -f.vx;
          if (f.px !== undefined) f.px = W - f.px;
          const set = leafSprites(dir.side)[f.layer];
          f.frames = set[f.i]; f.flat = set[f.i | 1];
        }
        // (the eddies' swirl is mirrored with the frame, so its spin is turned over to keep its sense on screen: undisturbed by the flip)
        tau = -tau;
        for (const d of eddies) { d.x = W - d.x; d.vx = -d.vx; d.spin = -d.spin; }
        splashes = splashes.map((s) => ({...s, dx: -s.dx}));
      },
      // Every flying leaf the flood's surface has reached (its lowest row on it or under it, in any column it covers, the waves as
      // they are now: the flood's step calls this once its waves have moved) handed to it, stuck there: none passes through it,
      // skims it or is blown out again. One that crossed it between frames, where it crossed (along its path), lying on it.
      // (Those it took, and those it has done with since, blown in again at the window's upwind edge: as many leaves as ever.)
      wade(t) {
        lastT = t;
        if (!flying.length) return;
        if (flood.lift() <= 0) { for (const f of flying) f.gap = Infinity; return; }
        let kept = 0;
        for (const f of flying) {
          const gap = gapOf(f, t);
          if (gap > 0) { f.gap = gap; flying[kept++] = f; continue; }
          const k = f.gap < Infinity && f.px !== undefined ? clamp(f.gap / (f.gap - gap), 0, 1) : 1;
          flood.take(f, sx(f.px + (f.x - f.px) * k), LAYERS[f.layer].alpha);
          f.hw = -1;
        }
        flying.length = kept;
        while (flying.length + flood.count() < owed) {
          const k = random(), f = {layer: k < LAYERS[0].share ? 0 : k < LAYERS[0].share + LAYERS[1].share ? 1 : 2};
          spawn(f, false);
          f.gap = gapOf(f, t);
          flying.push(f);
        }
      },
      step(dt, t, share) {
        calm = clamp(W / 360, CALM, 1);
        lastT = t;
        owed = Math.round(this.need() * share);
        const n = lab ? flying.length : Math.max(0, owed - flood.count());   // (those in a flood its share too)
        while (flying.length < n) {
          const k = flying.length / Math.max(n, 1);
          const f = {layer: k < LAYERS[0].share ? 0 : k < LAYERS[0].share + LAYERS[1].share ? 1 : 2};
          spawn(f, true);
          flying.push(f);
        }
        if (flying.length > n) flying.length = n;
        flying.sort((a, b) => a.layer - b.layer);
        // gusts: a sudden push now and then, dying away
        if (lab) gust = 0;
        else if ((nextGust -= dt) <= 0) { gust += between(0.5, 1.1); nextGust = between(2.5, 6); }
        gust *= Math.exp(-0.9 * dt);
        const m = Math.abs(dir.f);   // (how hard it blows: 1, or less as it turns)
        // (the pace factor: the wind's effective speed eased as the rain's is, at once the first time; a link's wind: the usual pace)
        const goal = gale.forced ? PACE.at : effectiveSpeed();
        wspeed = wseeded ? wspeed + (goal - wspeed) * (1 - Math.exp(-dt / (goal > wspeed ? TAU_UP : TAU_DOWN))) : goal;
        if (Math.abs(goal - wspeed) < 0.02) wspeed = goal;
        wseeded = true;
        pacing = paceOf(wspeed);
        tdrift += tau * DRIFT * pacing * calm * (1 + gust) * m * dt;
        const slid = (riding || DRIFT * pacing * calm * (1 + gust) * 1.15 * m) * dt;
        swept += slid;
        lswept += tau * slid;
        riding = 0;
        const want = Math.max(4, Math.round(W * H / 30000));   // (at least four, a phone's too)
        while (eddies.length < want && !lab) { const d = {}; eddy(d, true); if (random() < 0.5) d.rest = between(0, EDDY_REST[1]); eddies.push(d); }
        for (const d of eddies) {
          if (d.rest > 0 && !lab) { d.rest -= dt; d.on = 0; if (d.rest <= 0) rises++; continue; }   // (between eddies: none there)
          if (!lab || !lab.hold) d.age += dt;
          const k = clamp(d.age / d.life, 0, 1);
          d.on = Math.pow(Math.sin(Math.PI * k), 0.6);   // (spinning up, and down)
          d.draw = clamp((0.72 - k) * 6, -1, 1);          // (drawing in, then flinging off)
          // (its drift the way the wind blew when it rose, whatever the wind does since: an eddy in progress isn't stopped or turned
          // round by the wind turning, it drifts on to the end of its life, as swirling the same way; the leaves in it veer, see leafAir)
          d.u = d.v * pacing * (1 + 0.6 * gust);
          d.vx = d.sd * dir.side * d.u;
          d.vy = Math.sin(t * 0.5 + d.wander) * 6;
          if (lab && lab.hold) { d.vy = 0; if (!lab.drift) d.vx = 0; }   // (a test's: it stays where it was put, or drifts on)
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          if (!lab && (d.age >= d.life || d.x > W + 2 * d.r || d.x < -2 * d.r)) { eddy(d, false); d.rest = between(...EDDY_REST); }
        }
        const flooded = flood.lift() > 0;
        for (const f of flying) {
          f.px = f.x;   // (where it was: if it crosses a flood's surface this frame, where it did)
          // (the eddies' swirl as it is; the mean wind straight along its line, or, in an eddy, veering round: see leafAir)
          const [vx, vy, curl, w, straight, veer, mean] = leafAir(f.x, f.y, LAYERS[f.layer].speed * pacing, t), ease = 1 - Math.exp(-dt / f.weight);
          f.eddy = w; f.straight = straight; f.veer = veer; f.mean = mean;
          f.vx += (vx - f.vx) * ease;
          f.vy += (vy + f.sink + f.batter - f.vy) * ease;
          if (!f.pinned) { f.x += f.vx * dt; f.y += f.vy * dt; }
          f.turn += (f.spin + Math.min(Math.abs(curl) * 2.5, 14) + f.whirl) * dt;
          if (f.whirl) { f.whirl *= Math.exp(-1.6 * dt); f.batter *= Math.exp(-0.6 * dt); if (f.whirl < 0.05) f.whirl = f.batter = 0; }
          // (out of the window: blown in again; but below it in a flood only through the water, so the flood takes it: wade())
          if (f.x > W + 14 || f.x < -60 || f.y < -14 || (f.y > H + 14 && !flooded)) { spawn(f, false); continue; }
          const frame = f.frames[Math.floor(f.turn) % f.frames.length];   // (its size as drawn: what a drop can hit, a little inside it)
          f.hw = frame.width * 0.4; f.hh = frame.height * 0.4;
        }
        for (const s of splashes) s.age += dt;
        if (splashes.length) splashes = splashes.filter((s) => s.age < 0.16 && s.f.hw >= 0);
      },
      draw(g, alpha, t) {
        let layer = -1;
        for (const f of flying) {   // (those in a flood the flood draws: its own)
          if (f.layer !== layer) { layer = f.layer; g.globalAlpha = alpha * LAYERS[layer].alpha; }
          const [frame, x, y] = drawn(f, t);
          g.drawImage(frame, x, y);
        }
        for (const s of splashes) {   // (riding on the leaf it hit, as it flutters)
          if (s.f.hw < 0) continue;   // (the leaf gone: into a flood)
          const f = s.f, y = f.y + Math.sin(t * 2.3 + f.phase) * 1.2;
          g.globalAlpha = alpha * LAYERS[f.layer].alpha * 0.9;
          g.drawImage((dir.side > 0 ? SPLASH_R : SPLASH)[Math.min(3, Math.floor(s.age / 0.04))], Math.round(sx(f.x) + s.dx) - 3, Math.round(y + s.dy) - 3);
        }
      },
    };
  });

  // ---------- humidity: the glass fogging over, beads condensing in the fog and running down it; heavy rain's drops sticking ----------
  // The fog first (the humidity 90 % or more): a pale haze forming on the window over FORM s, a fairly even one (only a soft, gentle
  // variation, no gaps or islands), dithered, a little denser toward the sides and the bottom corners; none in the top rows. How
  // thick follows the humidity (the effect's level: 90 % to 100 %, a light haze to a heavy fog), eased to a new level over a few s.
  // Then the beads, condensing out of the fog only (where it has formed and shows, not in a trail wiped through it; more often where
  // it's thick, a little more toward the top), tiny (BORN: a px), fading in; a few a second (MISTING; the more humid, the more), on and
  // on, the glass more and more densely beaded, up to the most the budget allows (there, no more condensing until some merge, run
  // off or dry on dry glass). Tiny ones never run (nor shrink): each stays where it condensed, sitting on the fog swelling slowly with
  // it (SWELL: its water adding as the fog there is thick, each bead its own rate, SWELLS; on clear glass or a trail, none: tiny it
  // stays; the fog under it left as it is: a px drawing so little from it), in a minute or two a small bead (no longer tiny: as
  // small ones are, below), or before that snaps together with
  // another close by (SNAP px between their edges or less, a pixel's gap, not only touching): the higher one pulled into the
  // lower quickly, quicker and quicker, merged there (their water adding up: two tiny, a small one) with a tiny jump (a size bigger
  // for POP s; one of the largest (GULP_R up, the sprite sizes) taking in a tiny one swells a moment, GULP bigger, its own clock). A bead not running (under 1 px/s) and a tiny one close below it the same; a running one takes in any tiny one
  // beside or above it as it passes. Only large ones (RUN_R and up: about sixteen tiny ones' water) run (as below); smaller ones stay
  // put (snapping as tiny ones do), a small one growing on the fog till it's large enough. Heavy rain (HEAVY_RAIN or more, the humidity high or not): now and
  // then (LANDING a second, RAIN_MOST on the glass at most) a drop sticks, landing at once as a large bead (rainR), hard: squashed
  // flat and wide for a frame or two, wobbling back to round (SQUASH), with a splash (a ring of tiny droplets (THROWN), some of them
  // short spray streaks, bursting out fast, lopsided (LEAN), falling a little and fading in a few frames, a few of them (STAY) thrown
  // out to varied distances and left there as tiny beads; all of it harder in heavier rain: from then on tiny beads like any other, the humidity on or not, drying away (DRYING) on glass with no fog shown
  // if nothing takes them first); none in lighter rain, and none forming once the rain eases.
  // Every bead, condensed or rain, one set of rules (a merged one too):
  //   The glass under it (the row just below it): FOG (fog shown there: FOG_AT or more), a TRAIL (a streak a bead has left: wiped
  //   through the fog, or wet on clear glass) or DRY (clear glass, no trail).
  //   Its speed: none under RUN_R (on a device with a tilt sensor, under r_crit(s) = RUN_R / sqrt(s): see LEAN_FROM; a bead from 0.6 of that leans toward downhill); from there (for r of 2.8 and above its water, r³; below that x^5) times SPEED times the glass's PACE (dry slowest, fog quicker, a trail
  //   fastest: water on water); so it rises gradually with its size (tiny and small ones not at all, large ones creeping extremely slowly at
  //   first, larger ones faster and faster: no fastest); on a trail, never slower than a freshly landed rain bead (rainR's least (2.6))
  //   would go there, however small (from RUN_R: a condensed one as quick as a rain one down a track), each
  //   stretch of a run a little quicker or slower than that, stop-start (a pause after a stretch now and then, most often on dry
  //   glass; none for the biggest beads, r from STEADY_R, on fog or in a trail: they run on), wandering a little (a kink here, a slant there, kept a while; never more than MEANDER px from where it began); on dry
  //   glass it steers into a trail close beside it, on a trail it follows it. Once it has locked on to another's run (steered into it
  //   and reached it) it keeps to it all the way down, row by row on the run's middle wherever that wanders (a break of up to LOCK_GAP
  //   rows, or the bead ahead on it, held straight across), no wandering back off, till it merges, runs off the bottom, or the run ends (then on as it was).
  //   Its size (its water: continuous, no largest): on fog it gathers the fog it passes (GATHER a px, CONDENSE a s as it sits; the
  //   fog wiped) and grows; on a trail it keeps its size; on dry glass, only there, it shrinks, leaving its water behind (LEAVE a px, a rain bead's RAIN_LEAVE of that,
  //   EVAPORATE a s). Shrunk to nothing (GONE): gone. A run (trail) is wet glass as fog is: no bead condenses in one, none shrinks in one, and a bead on fog never dries, shrinks or disappears: it only grows (a tiny one
  //   swelling at least MIN_FELT as thick as the fog, thin or wiped through, a bigger one gathering at least that) till it runs;

      const eyeParts = blink ? [] : eyes.map(([ex, ey, er]) => ball(ex, ey, er, er, "eye"));
      return sculpt(W2, H2, [
        ...legsOf(18, l, 1), ...legsOf(26, r, -1),
        ...[ball(22, 30, 12.5, 11, "feather"),
            limb(11, 27.5, 5, 24.5, 3.1, "feather", 0.95), limb(33, 27.5, 39, 24.5, 3.1, "feather", 0.8),   // (its wings, splayed stiffly)
            ball(19.5 + t * 0.4, 4.6, 1.9, 2.1, "comb"), ball(22 + t * 0.5, 3.6, 2.1, 2.6, "comb"), ball(24.5 + t * 0.4, 4.8, 1.8, 2, "comb"),
            ball(22 + t * 0.6, 13.5, 10, 9.2, "feather"),
            ...eyeParts,
            ball(22.6 + t, 21.6, 1.3, 2, "comb"),
            ball(22 + t, 18.6, 2.2, 1.3, "beak"), ball(22 + t, 20, 1.6, 0.9, "beak", 0.6)].map(tilted),
      ], over);
    };
    // A sprite turned `angle` rad about its middle (a canvas S x S, S its diagonal): each pixel the most common colour of its 3x3 points
    function turned({w, h, px}, angle) {
      const S = Math.ceil(Math.hypot(w, h)) + 2, out = canvasOf(S, S), g = out.getContext("2d"), img = g.createImageData(S, S);
      const d = new Uint32Array(img.data.buffer), c = Math.cos(angle), s = Math.sin(angle), got = new Uint32Array(9), n = new Uint8Array(9);
      for (let ty = 0; ty < S; ty++) for (let tx = 0; tx < S; tx++) {

      g.putImageData(img, 0, 0);

    // Its picture now: the cow and the barn turned to the nearest of TURNS angles, the chicken in its frame and its sway's nearest 3°
    // (each made once, when first needed: a millisecond or two; at most one a frame, the others keeping theirs till the next)

    const base = (kind) => bases.get(kind) || (bases.set(kind, kind === "cow" ? cow() : barn()), bases.get(kind));
    let made = false;
    function picture(f) {
      const chick = f.kind === "chicken", step = chick ? Math.PI / 60 : 2 * Math.PI / TURNS, turn = Math.round(f.angle / step);
      const key = chick ? `chicken ${f.turn} ${f.legs} ${f.blink < 0} ${turn}` : `${f.kind} ${((turn % TURNS) + TURNS) % TURNS}`;
      let pic = pictures.get(key);
      if (!pic) {
        if (made && f.pic) return f.pic;
        if (pictures.size > 400) pictures.clear();
        pictures.set(key, pic = chick ? shown(chicken(f.turn, f.legs, f.blink < 0, turn * step)) : turned(base(f.kind), turn * step));
        made = true;
      }
      return f.pic = pic;
    }
    const KINDS = ["cow", "barn", "chicken"];
    const SHED = {cow: [C("grass", 2), C("grass", 3), C("dirt", 2)], barn: [C("hay", 2), C("hay", 3), C("red", 2), C("trim", 1)],
                  chicken: [C("feather", 3), C("feather", 2)]};
    let flyers = [], bits = [], bag = [], sent = [], shed = 0;
    const along = () => 1 + 0.35 * wind.amount;
    return {
      strength: () => 0.45,
      need: () => flyers.length ? BITS : 0,
      count: () => bits.length,
      want() {},                       // (no condition of its own: fling() sends one, and it's on while one is crossing)
      fade() { e.level = e.amount = flyers.length || bits.length ? 1 : 0; },
      clear() { flyers = []; bits = []; e.level = e.amount = 0; },
      forget() { this.clear(); },
      fling(kind) {
        if (!KINDS.includes(kind)) {
          if (!bag.length) bag = KINDS.slice().sort(() => random() - 0.5);
          kind = bag.pop();
        }
        const size = kind === "chicken" ? 52 : 66;
        // (in from upwind, flown across downwind the way it blows as it's sent: its sprite mirrored if rightward)
        const to = dir.side;
        flyers.push({kind, size, to, x: to < 0 ? W + size * 0.75 : -size * 0.75, y0: H * between(0.16, 0.42), rise: between(-3, 3), vx: between(...SPEED),
                     angle: kind === "chicken" ? 0 : between(0, 2 * Math.PI), spin: between(...SPIN), t: 0, phase: between(0, 6.3),
                     turn: 0, legs: 0, blink: between(1.5, 4), y: 0});

        return kind;
      },
      step(dt) {
        for (const f of flyers) {
          f.t += dt;
          f.x += f.to * f.vx * along() * dt;
          f.y = f.y0 + f.rise * f.t + 6 * Math.sin(0.55 * f.t + f.phase);
          if (f.kind === "chicken") {   // (facing the viewer: swaying and bobbing, its legs swinging, its head turning a little)
            f.angle = 0.17 * Math.sin(1.1 * f.t + f.phase);
            f.y += 2.5 * Math.sin(2.3 * f.t);
            f.legs = Math.floor(((2.6 * f.t + f.phase) / (Math.PI / 2)) % 4 + 4) % 4;
            f.turn = clamp(Math.round(1.4 * Math.sin(0.6 * f.t + 2 * f.phase)), -1, 1);
            if ((f.blink -= dt) < -0.16) f.blink = between(1.5, 4.5);
          } else f.angle -= f.spin * dt;   // (anticlockwise: rolling over leftward; a rightward one's picture mirrored, so clockwise)
          if ((shed -= dt) <= 0 && bits.length < BITS) {   // (a few bits shed now and then)
            shed = between(0.15, 0.45);
            const r = f.size * 0.3;
            bits.push({x: f.x + between(-r, r), y: f.y + between(-r, r), to: f.to, vx: f.to * f.vx * along() * between(1.05, 1.4), vy: between(-4, 8),
                       life: between(2, 4), age: 0, c: SHED[f.kind][Math.floor(random() * SHED[f.kind].length)],
                       big: f.kind !== "cow" && random() < 0.4, sway: f.kind === "chicken" ? between(1.5, 3) : 0});

        }
        flyers = flyers.filter((f) => f.to < 0 ? f.x > -f.size * 0.75 : f.x < W + f.size * 0.75);
        for (const b of bits) { b.age += dt; b.x += b.vx * dt; b.y += (b.vy + b.sway * 6 * Math.sin(3 * b.age)) * dt; }
        bits = bits.filter((b) => b.age < b.life && (b.to < 0 ? b.x > -4 : b.x < W + 4));
        e.level = e.amount = flyers.length || bits.length ? 1 : 0;
      },
      draw(g, a) {
        made = false;
        for (const f of flyers) {
          const pic = picture(f);
          g.globalAlpha = Math.min(1, a);
          blit(g, pic, Math.round(f.x - pic.width / 2), Math.round(f.y - pic.height / 2), f.to > 0);   // (mirrored when it goes right)
        }
        for (const b of bits) {
          g.globalAlpha = Math.min(1, a) * Math.min(1, 2 * (1 - b.age / b.life));
          g.fillStyle = `rgb(${b.c})`;
          g.fillRect(Math.round(b.x), Math.round(b.y), b.big ? 2 : 1, 1);
        }
      },
      // (for the tests: those crossing now {kind, x, y (their middle, art px), angle (rad), size, turn, legs}, how many sent and
      // their kinds, the bits now, the pictures made)
      probe: () => ({flyers: flyers.map(({kind, x, y, angle, size, turn, legs, to}) => ({kind, x, y, angle, size, turn, legs, to})),
                     sent: sent.length, kinds: sent.slice(),
                     bits: bits.length, pictures: pictures.size}),
    };
  });

  const effects = {gust, haze, heat, uv, rain, wind, humidity, flood, ice};

  // ---------- the loop ----------
  // (test-only, window.__skyTest (see TEST): {step: s}, each frame the weather's time steps exactly s (times timeScale), however
  // long the frame really took, so a busy machine changes how soon a test sees a thing, never what it sees; {driven: true} too, no
  // frames of its own: only those Sky.advance(n) makes)
  const DRIVEN = !!TEST.driven;
  let animate = true, frame = 0, last = 0, clock = 0, frames = 0, cost = 0, scale = 1;
  const drawn = {};                    // (each effect's strength as last drawn, the cap and the fading in: for the tests)
  const alive = () => ORDER.some((k) => effects[k].alive());

  function resize() {   // (the art made again for the window's size: only if that has changed)
    const {w, h} = screenRoom();
    const p = Math.max(3, Math.round(Math.max(w, h) / ART_PX));
    if (W && p === P && W === Math.ceil(w / p) && H === Math.ceil(h / p)) return;
    P = p;
    W = Math.ceil(w / P);
    H = Math.ceil(h / P);
    M = Math.ceil(OVER / P);
    canvas.width = above.width = below.width = W;
    canvas.height = H;
    above.height = below.height = M;
    Object.assign(canvas.style, {width: `${W * P}px`, height: `${H * P}px`});
    // (the window's top is OVER px down in #sky, which starts that far above the window: the margins end where the window's does)
    Object.assign(above.style, {width: `${W * P}px`, height: `${M * P}px`, top: `${OVER - M * P}px`});
    Object.assign(below.style, {width: `${W * P}px`, height: `${M * P}px`, top: `${OVER + H * P}px`});
    for (const k of ORDER) effects[k].sized = false;   // (each made to the new size when it's next on: none made for nothing)
  }

  // The wind's direction eased toward its target (dt s on): the factor f sliding -1 to +1 (or back) over DIR_S s; as it crosses 0 its
  // side changes, and the effects worked out in the wind's own frame turned over to the other side
  function steer(dt) {
    const step = dt * 2 / DIR_S;
    dir.p += clamp(dir.target - dir.p, -step, step);
    dir.f = Math.sin(dir.p * Math.PI / 2);
    dir.veer.u = Math.min(dir.veer.u + dt / dir.veer.dur, 1);
    const side = dir.f < 0 ? -1 : dir.f > 0 ? 1 : dir.side;
    if (side !== dir.side) {
      dir.side = side;
      dir.flips++;
      for (const k of ORDER) if (effects[k].flip) effects[k].flip();
    }
  }
  // setWind(d): which way the wind blows now, -1 leftward (from the east side of the compass), +1 rightward (from the west side); 0,
  // or anything else, holds the current one (a reading due north or south, or none). Eased over DIR_S s (steer()); with nothing
  // drawn, at once. The way it blows (the target): returned
  function setWind(d) {
    if (!(d < 0) && !(d > 0)) return dir.target;
    const was = dir.target, v = dir.veer;
    dir.target = d < 0 ? -1 : 1;
    const to = dir.target < 0 ? Math.PI : 0;   // (the heading the mean wind is going to)
    if (!alive()) {   // (nothing on screen: no one to see it turn)
      dir.p = dir.target;
      dir.f = dir.side = dir.target;
      Object.assign(v, {u: 1, from: to, delta: 0});
    } else if (dir.target !== was) {
      // the mean wind's veer from its heading now to the new one, round through up on odd turns, down on even
      const now = veerAngle(), tau = 2 * Math.PI;
      v.side = ++v.count % 2 ? 1 : -1;
      const plus = (((to - now) % tau) + tau) % tau;   // (counter-clockwise: up from rightward)
      let delta = [plus, plus - tau].find((x) => Math.sin(now + x / 2) * v.side > 0);
      if (delta === undefined || Math.abs(delta) < 0.2) delta = plus < Math.PI ? plus : plus - tau;
      Object.assign(v, {from: now, delta, u: 0, dur: Math.max(VEER_S * Math.abs(delta) / Math.PI, 1)});
    }
    return dir.target;
  }

  function tick(dt) {
    let need = 0;
    steer(dt);
    blow(dt);
    for (const k of ORDER) if (effects[k].alive() && !effects[k].sized) { effects[k].resize(); effects[k].sized = true; }
    for (const k of ORDER) {
      const fx = effects[k];
      fx.fade(dt);
      if (fx.alive()) fx.held = true;
      else if (fx.held) { fx.held = false; fx.forget(); }   // (gone all the way: whatever it had, forgotten)
      if ((fx.amount > 0 || fx.level > 0) && !OWN_BUDGET.has(k)) need += fx.need();
    }
    const share = Math.min(1, W * H * BUDGET / Math.max(need, 1));
    for (const k of ORDER) if (effects[k].alive()) effects[k].step(dt, clock, OWN_BUDGET.has(k) ? 1 : share);
    for (const k of ORDER) if (effects[k].settle && effects[k].alive()) effects[k].settle();   // (after them all: see humidity's)
  }
  function wipe() { ctx.clearRect(0, 0, W, H); aboveG.clearRect(0, 0, W, M); belowG.clearRect(0, 0, W, M); }
  // The weather carried on past the window's top and bottom: its first and last rows mirrored into the margins (the fog, the haze,
  // the frost's edge and the flood's water all go on; whatever is drawn at the edge only mirrors, never moves or acts there)
  function margins() {
    const n = Math.min(M, H);
    for (const [g, from, to] of [[aboveG, 0, 0], [belowG, H - n, M - n]]) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, W, M);
      g.setTransform(1, 0, 0, -1, 0, M);

    belowG.setTransform(1, 0, 0, 1, 0, 0);

  function draw() {
    ctx.globalAlpha = 1;

    for (const k of ORDER) if (!OWN_STRENGTH.has(k)) sum += effects[k].strength() * effects[k].amount;

      if (fx.amount > 0) fx.draw(ctx, a, clock);

  function step(dt) {   // one frame, dt s of the weather's time on
    clock += dt;
    const start = performance.now();
    tick(dt);
