<!DOCTYPE html>
<html lang="en" data-animations="on">
<head>
<meta charset="utf-8">
<!--link preview-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14191D">
<meta name="color-scheme" content="dark">
<title>Weather Dashboard</title>
<!-- The gauges, live (lib/web_dashboard.py): drawn here from /dashboard/data as the PNG (lib/gauges.py) draws them, in the same
     colours and sizes (lib/gauge_look.py, sent with the data); redrawn on each /dashboard/events event, and every minute regardless.
     The tiles can be rearranged in the browser: dragged to reorder (a long press on a touch screen), hidden with their × or the
     remove zone, all put back with "reset preferences"; kept in localStorage ("ecobot.dashboard.v1"), nothing sent to the server.
     The units' switches beside the strip ("°C | °F", "km/h | mph", "hPa | inHg", "mm | in"): the temperatures, the wind, the
     pressure and the rain (its rate with it) shown in those, converted here
     (the server sends metric), kept with the preferences, metric again on "reset preferences".
     A click or tap on a gauge zooms its tile (title and gauge, no table) to fill the window, a gallery paged through by keys, swipes and drags; Esc goes back.
     Behind everything, the weather as pixel art on one canvas (Sky): rain, haze, uv, humidity, wind, heat and ice, each while the
     readings call for it, its tile framed in red; "stop" at the bottom left stops and clears them for this page view only
     (nothing saved: a reload brings them back; the link gone till then). MCP_DASHBOARD_ANIMATIONS: the server sends
     data-animations="on", "low" or "off" on <html> (lib/web_dashboard.py), for every viewer. On: all of the above. Low: the gauges
     sweep and the tiles reflow as on, but no weather (no canvas drawn, no loop, no "stop", no test links) and the zoom at once. Off:
     no weather, and nothing animated: the gauges' needles and readings straight at their new place, the zoom and the reflow at once,
     no transition. A browser asking for reduced motion: as off, whatever the setting. The data's updates as they come in each. -->
<style>
  :root { --bg: #14191D; --ink: #E8EAED; --soft: #B8BDC2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow-x: hidden; overflow-y: auto; }
  #grid { display: grid; justify-content: center; align-content: center; padding: var(--pad, 8px);
    padding-bottom: calc(var(--pad, 8px) + var(--status, 18px)); min-height: 100%; }   /* (room under the tiles for the status line) */
  /* A tile: its own background clear (whatever is behind the page shows through it), its foreground opaque; a thin opaque frame
     (::before, inset, so neighbours don't share a line), seen only picked up, focused or red (not on mouseover). Its gauge can be dragged (user-select none), its
     title, reading and table keep their text selectable. transform-origin 0 0: the reflow animations' scale is from the corner.
     Its contents are placed by its width alone (cqw), so the zoomed view, its box only their top (the title and gauge), shows them alike. */
  .tile { position: relative; container-type: inline-size; overflow: hidden; background: transparent; transform-origin: 0 0;
    transition: opacity 0.9s ease, transform 0.22s ease; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile::before { content: ""; position: absolute; inset: 0.9cqw; border: 1px solid transparent; border-radius: 2.5cqw; pointer-events: none; }
  .tile.faded { opacity: var(--fade, 0.4); }   /* no reading now: dimmed towards the card (as the PNG blends its colours) */
  .tile svg { position: absolute; left: 0; top: 0; width: 100%; display: block; }   /* (its height: by the width, drawTile()) */
  .tile svg text { font-family: inherit; }
  .title, .unit, .chip, .figure, .tile svg text.reading { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .at { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 1; }
  .title { left: 0; right: 0; }
  .chip { border-radius: 1.875cqw; }
  /* The grip and the × (hide), shown only on mouseover, on a tile picked up, or (touch) on one long-pressed and let go in place */
  .grip, .close { position: absolute; top: 6px; z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .grip { left: 8px; width: 15px; height: 25px; cursor: grab;   /* (dots 5px apart: three across, five down) */
    background: radial-gradient(circle, var(--soft) 1.1px, transparent 1.5px) 0 0 / 5px 5px; }
  .close { right: 5px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--soft);
    font: 18px/22px system-ui, sans-serif; cursor: pointer; }
  .close:hover, .close:focus-visible { color: var(--ink); background: #262E34; outline: none; }
  @media (hover: hover) { .tile:hover .grip, .tile:hover .close { opacity: 1; pointer-events: auto; } }
  .tile.lifted .grip, .tile.lifted .close, .tile.armed .grip, .tile.armed .close, .tile:focus-visible .close, .tile:has(.close:focus-visible) .close
    { opacity: 1; pointer-events: auto; }
  /* A tile can take the keyboard's focus (Enter or Space zooms it): its frame lit then, rather than the browser's outline. (A click
     on the text focuses it too, unseen: hence the × above shown for the keyboard's focus only.) */
  .tile:focus { outline: none; }
  .tile:focus-visible::before { border-color: var(--soft); }
  body.dragging .tile:not(.lifted) .grip, body.dragging .tile:not(.lifted) .close { opacity: 0; }
  /* A tile whose reading calls up an effect behind the tiles (Sky): framed in red, its frame alone (thin, as the others'); before the
     drag's frames below, so a framed tile lifted, or over the remove zone, shows those as any other */
  /* (Off for now, the class still set: to bring the red frames back, restore these two rules.)
  .tile.alert::before { border-color: #D9363E; }
  .tile.alert:focus-visible:not(.lifted)::before { border-color: #FF9EA1; } */
  .tile.lifted { z-index: 2; transition: opacity 0.9s ease; }    /* follows the pointer: no easing of its own */
  .tile.lifted::before { border-color: #5A6670; }
  .tile.doomed::before { border-color: #E5484D; }
  body.dragging, body.dragging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }
  /* The remove zone: slides down from the top while a tile is dragged; a tile dropped on it is hidden */
  #remove { position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 3; display: flex; align-items: center; justify-content: center;
    font-size: 15px; letter-spacing: 0.04em; color: #F2B8B5; background: rgba(58, 22, 26, 0.92); pointer-events: none;
    transform: translateY(-100%); transition: transform 0.2s ease; }
  #remove.on { transform: none; }
  #remove.over { color: #FFFFFF; background: rgba(150, 34, 42, 0.95); }
  /* The weather behind everything (Sky, below): one canvas, the window's size, fixed, first in the page; its pixels scaled up crisply */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #sky canvas { position: absolute; left: 0; top: 0; image-rendering: crisp-edges; image-rendering: pixelated; }
  #status { position: fixed; right: 0; bottom: 0; height: var(--status, 18px); padding: 0 10px; font-size: 12px;
    line-height: var(--status, 18px); color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; z-index: 1; }
  #status .link, #motion .link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    text-decoration-color: #5A6670; text-underline-offset: 2px; }
  #status .link:hover, #status .link:focus-visible, #motion .link:hover, #motion .link:focus-visible { color: var(--ink); }
  /* The bottom left corner: "stop" (while an effect is called for), as the strip; beside the strip, or just above it where
     there's too little room beside it (placeCorner()). Whatever else comes before it in the corner sits to its left. */
  #corner { position: fixed; left: 0; bottom: 0; z-index: 1; display: flex; height: var(--status, 18px); max-width: 100vw; }
  #motion { flex: none; padding: 0 10px; font-size: 12px; line-height: var(--status, 18px); white-space: nowrap; color: var(--soft);
    background: rgba(20, 25, 29, 0.85); border-top-right-radius: 6px; }
  #motion:empty { display: none; }
  /* MCP_DASHBOARD_ANIMATIONS low or off, or reduced motion: no weather behind the tiles at all, nor its link or test links */
  html:not([data-animations="on"]) :is(#sky, #corner) { display: none; }
  @media (prefers-reduced-motion: reduce) { :is(#sky, #corner) { display: none; } }
  html.scroll { scroll-snap-type: y proximity; scroll-padding-top: var(--pad, 8px); }
  .tile { scroll-snap-align: start; }
  html.scroll:has(body.dragging) { scroll-snap-type: none; }   /* (a drag's own scrolling stops where it stops) */
  /* The units' switches ("°C | °F", "km/h | mph", "hPa | inHg", "mm | in"), the active one lit: just left of the strip, as one with it; where the window is
     too narrow for both side by side (a phone, a long strip), just above it at the right (placeCorner()) */
  #units { position: fixed; right: 0; bottom: 0; z-index: 1; display: flex; align-items: center; gap: 4px; height: var(--status, 18px);
    padding: 0 0 0 8px; font-size: 11px; color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; white-space: nowrap; }
  body[data-units="above"] #units { padding-right: 10px; }
  body[data-units="beside"] #status { border-top-left-radius: 0; }
  #units .switch { display: inline-flex; height: 14px; border: 1px solid #3A444C; border-radius: 4px; overflow: hidden; }
  #units button { font: inherit; line-height: 12px; padding: 0 3px; margin: 0; border: 0; border-radius: 0; background: none; color: #8A9299; cursor: pointer; }
  #units button + button { border-left: 1px solid #3A444C; }
  #units button:hover { color: var(--ink); }
  #units button[aria-pressed="true"] { background: #3A444C; color: var(--ink); cursor: default; }
  #units button:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
  #status.lost { color: #F4A93B; }
  /* A device whose reading is over an hour old (showStatus): its name and time, or with none fresh the whole time, greyed out */
  #status .stale { color: #737B82; }
  #message { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center;
    font-size: 20px; color: var(--soft); }
  body.unavailable #message { display: flex; }
  /* The cursor: over a gauge, a magnifier with + (a click zooms it, a single tile too), with − in the zoomed view (a click goes
     back); over the text, the usual one. (.tablearea: under the table's chips, so the gaps between them count as the table.) */
  body:not(.zoomed) .tile { cursor: zoom-in; }
  body.zoomed #grid { cursor: zoom-out; }
  .title, .unit, .chip, .figure, .tile svg text.reading { cursor: auto; }
  .tablearea { cursor: default; }
  /* The zoomed view, a gallery: #grid becomes a strip of the visible tiles side by side, each as large as fits and centred in its own
     window-wide place (the strip as wide as them all, so it's under the pointer wherever it is), slid sideways (its transform) to page
     through them; the page itself doesn't scroll meanwhile, and a
     sideways swipe never reaches the browser (no back/forward). The grip and × aren't needed here: hidden. */
  html.zoomed, html.zoomed body { overflow: hidden; overscroll-behavior-x: contain; }
  body.zoomed #grid { position: fixed; inset: 0 auto 0 0; width: calc(var(--n) * var(--pitch)); display: block; padding: 0; min-height: 0;
    touch-action: pinch-zoom;
    -webkit-user-select: none; user-select: none; }
  body.zoomed .tile { position: absolute; top: var(--zy); left: calc(var(--zx) + var(--i) * var(--pitch)); width: var(--zw); height: var(--zh); }
  body.zoomed .grip, body.zoomed .close { display: none; }
  /* Zoomed (the gallery's tiles too), only the title and the gauge: the tile's box just their part of it (--zh), the Daily/Monthly/
     Yearly table hidden: gone at once as the tile grows, and while it shrinks back (never drawn large over the others), then fading
     in, in its place */
  .unit, .chip, .figure, .tablearea { transition: opacity 0.15s ease; }
  body.zoomed .tile.fading { height: var(--zfull); }   /* (fading out where they were: whole, their table too) */
  body.zoomed .tile:not(.fading) :is(.unit, .chip, .figure, .tablearea), .tile.zooming :is(.unit, .chip, .figure, .tablearea)
    { opacity: 0; visibility: hidden; transition: none; }
  .tile.zooming { z-index: 2; }        /* (the tile zooming in or out, over the others) */
  body.paging, body.paging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }
  /* MCP_DASHBOARD_ANIMATIONS low: the zoom at once, so the tables shown again at once too as it ends */
  html[data-animations="low"] .tile :is(.unit, .chip, .figure, .tablearea) { transition: none !important; }
  /* MCP_DASHBOARD_ANIMATIONS off, or reduced motion: no transition anywhere, each change in one step */
  html[data-animations="off"] :is(*, *::before, *::after) { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { :is(*, *::before, *::after) { transition: none !important; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><canvas></canvas></div>
<main id="grid" aria-live="polite"></main>
<div id="message"></div>
<div id="remove" aria-hidden="true">× remove</div>
<div id="corner"><div id="motion"></div></div>
<div id="units" role="group" aria-label="Units"></div>
<div id="status">loading…</div>
<script>
"use strict";
// ---------- the weather behind the tiles: pixel art on one canvas filling the window, behind everything ----------
// Drawn at a low resolution (one art pixel: P CSS px, about a third of the window across) and scaled up crisply (image-rendering:
// pixelated). Every sprite and texture is drawn once to a small offscreen canvas and blitted; one loop (at most 30 frames a second)
// for every effect, each frame cleared once and drawn back to front (ORDER). The effects share a particle budget and a cap on their
// strength together, so several at once are no busier or brighter than one strong one; but the humidity's beads stay out of the
// budget (OWN_BUDGET: their own limits bound them, so heavy rain keeps every drop beside them), and the rain out of the cap
// (OWN_STRENGTH: drawn at its own strength whatever else is on). Nothing runs while no effect is on or fading
// out; the tab hidden, it waits. Only with MCP_DASHBOARD_ANIMATIONS on and no reduced motion asked for: otherwise the page never
// sets it going (animate false), and nothing is drawn, no loop, no frame.
//   Sky.set(want, animate): want {rain: 0-1 (its strength), haze: 0-5 (the AQI's band above Good), humidity: 0-1 (90 % to
//   100 %), uv, wind: 0 or 1, heat: 0-1 (35 °C to 43 °C), ice: how far below 0 °C it is (0: none), flood: 0 or 1 (2: the test link's, its first frog
//   sooner)}; animate false (the page's "stop", MCP_DASHBOARD_ANIMATIONS low or off, or reduced motion): nothing drawn (and
//   anything blown across gone).
//   Sky.fling(kind): something big blown across far behind (a gust over 99 km/h): "cow", "barn" or "chicken", else one at random;
//   its kind, or null (nothing drawn: stopped, no weather, the tab hidden). The gust effect is on while one is crossing.
//   Sky.state(): {effects, running, frames, cost (ms a frame, averaged), clock (the weather's time, s), size: [art width, art height,
//   P], particles (each effect's
//   now), budget (theirs together, at most: the humidity's (own) aside), drawn (each effect's strength as last drawn: the cap's,
//   and the rain's own), cap, levels, iceReach (art px), wind (its leaves on screen: {vx: their mean speed across,
//   negative leftward, against: how many go rightward, hits: how many the rain's drops have hit, push: their mean push, px/s,
//   kick: the mean change in a hit leaf's own velocity a hit made, px/s,
//   whirl: the most spin knocks have left on one now}), rain (its drops: {xs: where across, those in the window's lower half,
//   width: the art's, vx: their mean speed across}), humidity (the glass fogging over, its beads condensing in the fog and running
//   down it, and heavy rain's drops stuck to it: {height, width: the art's, meander: how far either side of where it showed a bead
//   may wander, crisp: how fresh a trail through the fog is while it's still wiped clear, life: [shortest, longest] a trail's
//   life (s), trails: the trail pixels now, dried: how many have gone (fogged over or dry), merges: how many, merged: the latest
//   [{vol: the two's water, into: the one's, r: the two radii, intoR: the one's}], absorbed: the latest beads merged into another
//   (ids), left: the latest run off the bottom edge (ids), ranOff, shrunk (to nothing), faded (dried away): how many, largest: the
//   largest radius a merge has made, born: the latest condensed [{id, kind, r, fog: shown there, y: its middle, of the height}],
//   first: the first bead to show since the glass was fresh {after: s, cover, fog: the fog where it showed (not wiped), formed:
//   fog() then} or null, landed: heavy rain's drops stuck, rainMost: the most of them at once, splashes: the latest {id, r, dots, stay: its droplets left on the glass,
//   meant, cut, off, room, squash: how far it landed squashed, aim, lean: its burst's lopsidedness, thrown: its droplets [angle, px/s, streak (1), left (1)]},
//   glass: {dry, trail, fog: each {px, s: run and taken there by beads of r 1.8-3.2, band: what they'd have run on fog (each at its
//   size then), gained, lost: water, moves: steps, all, norm, pace:
//   px run by any, what they'd have run on fog in that time, and at that glass's own mean speed}}, restarts: the biggest beads (STRETCH_R
//   up) setting off again after a pause, stretches: those of them elongating as they did, sizes: [px, s] on fog by size (under bands[0], ..., the last and
//   over), bands, swept: the trail pixels the latest frame's sweep looked at again (sweepMost at most), physics: {speed(r, glass):
//   px/s (0 under run), after(r, glass, px, s, fog): its radius after (0: gone), gone, run: the size a bead runs from}, hasten(k): the
//   trails' time k times as fast (test-only), clock(): the trails', wetAt(x, y): how fresh a trail is there (1 just left, 0 none),
//   lifeAt(x, y): its life, glassAt(x, y): "dry", "trail" or "fog", fogAt(x, y): [its fog as shown, its fog not wiped] (0-1),
//   shownAt(x, y): what the fog's canvas shows there [r, g, b, alpha], trailOf(id): a bead's trail as it looks now, its latest rows (paused: one it had paused at, a blob)
//   ({y, w, left, wet, alpha, life, fog}: see the probe), marks(): {trails, listed: trail pixels, ink: its canvas's pixels showing
//   anything, beads, cover, amount}, fog(): {cover: how far formed, 0-1, dense, thickness,
//   middle, edge: its mean shown, over the window, its middle and its edges, opacity: its mean alpha as drawn (0-1), most: its
//   thickest shade's alpha, haze: its mean not wiped inside (the window less its outer sixth), spread: its standard deviation there
//   over that, gaps: the pixels there under half that}, colours(): the beads' sprites' colours [r, g, b, alpha], stray(): pixels on
//   the fog's canvas showing otherwise than they should where no trail is any more, beads: [{id, kind ("fog": condensed, "rain", "splash": a heavy-rain splash's droplet left on the glass),
//   x, x0 and y0: where it showed, y: its top, cy: its middle, r, vol: its water, w, laidW: its width as it last left its trail,
//   bottom: its sprite's lowest row + 1, glass: under it, v: px/s now, fading, alpha, drawn: [x, y, w, h, alpha] as drawn last,
//   age: s shown, behind: its trail there behind it, trail: [x, y] a pixel of it, stretch: how far elongated now, 0-1 (as drawn: none while squashed), impact: a rain
//   bead's s since it landed (9 at most; null: none), squash: how far squashed now (above 0 wider, below taller), thrown: a splash's
//   droplet's [dx, dy] from where its drop struck}]}), joined: how many have run into a flood, joins: the latest of them
//   (each {x, bottom: its sprite's lowest row + 1, surface: the flood's surface there then, level: the flood's level, trail: its trail's
//   last row + 1, or null: not running, wet: its trail there, in its middle)},
//   flood (a flash flood: its depth, its surface, its frog and its waves, as flood.probe() gives them; the wind's water, took, rested,
//   floating, resting, wet, all, shows(): its leaves in it, as flood.leaves() gives them (the flood's too, as leaves), and flyers: the leaves
//   flying, each [id, its lowest row over the water under it or null, x, y]; the rain's under: drops drawn below its surface), gust (what's blown across: gust.probe()), for the tests. Sky.timeScale(k): the
//   weather's time k times as fast, each frame (test-only). Sky.advance(n) (test-only): n frames now (window.__skyTest: see the
//   loop); Sky.clock() (test-only): {frames, clock, running}, as Sky.state() has them, cheaply. Sky.frost() (test-only):
//   the ice now, {extent, target: where it's going (on its own measure), growing, frosted, crystals: the share of the window under
//   any frost, under its crystals, fresh: the growth front's fresh tip pixels, deepest: the crystal furthest from its nearest edge,
//   of the window's shorter side, rim: the share of the window's outer 3 px frosted, fingers: in 32 stretches of the edges (between
//   the corners) how far in the furthest crystal reaches, of the shorter side, sparkles: how many now, pixels: the crystals there
//   could be, ink: its canvas's pixels showing anything, made: what was grown {forms: how many of each ({fern, plume, needles,
//   speck}), specks: each speck's size (px), fronds: each fern's and plume's stem {kind, length, branches, spacing: its length a branch, angle: its branches' mean
//   to it, degrees}, seeds: [edge (0 top, 1 bottom, 2 left, 3 right), where along it] each along the edges, scratches: how many
//   from a little way in}, shades: the crystals shown now (not the fresh tips) {mean, spread: their alphas' standard deviation,
//   tints: how many tints, stem, side, barb: the mean alpha of each}} (null till first made); Sky.frost(true): only {extent,
//   target, sparkles}, cheap.
const Sky = (() => {
  const holder = document.getElementById("sky"), canvas = holder.querySelector("canvas"), ctx = canvas.getContext("2d");
  const FRAME_MS = 1000 / 30;          // the frame rate's cap: art moving a pixel at a time needs no more
  const FADE_S = 1.5;                  // an effect fades in, and out, over this long
  const ART_PX = 480;                  // the art's width (or height, if taller) about this many pixels: P = 3 on a laptop, 4 on 1920
  const BUDGET = 1 / 400;              // the particles of every effect together: this many per art pixel² (480 x 300: 360)
  const CAP = 1.5;                     // ... and their strengths together at most this (one strong effect: about 0.8)
  const ORDER = ["gust", "haze", "heat", "uv", "rain", "wind", "humidity", "flood", "ice"];   // back to front
  const OWN_BUDGET = new Set(["humidity"]);   // (its beads outside the shared budget: their own limits keep their cost bounded)
  const OWN_STRENGTH = new Set(["rain"]);     // (drawn at its own strength whatever else is on: outside the cap)
  let W = 0, H = 0, P = 3;             // the art's size (art px) and one art pixel's (CSS px)

  // ---------- tools: seeded randomness, colours, dithering, noise, little canvases ----------
  const seeded = (seed) => () => {     // (mulberry32: the same art every time)
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const TEST = window.__skyTest || {};   // (test-only, set before the page loads: {step, driven} (see the loop), seed)
  // Each part of the weather its own randomness (a stream named for it, seeded apart: each effect's, and inside one, each of its
  // concerns'), so a change in how often one draws leaves every other's sequence as it was: streamOf(name), a function giving 0-1,
  // with .between(a, b)
  const streamOf = (name) => {
    let h = 2166136261;
    for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 16777619);
    const r = seeded((h ^ Math.imul(TEST.seed || 1115, 2654435761)) | 0);
    r.between = (a, b) => a + (b - a) * r();
    return r;
  };
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  // Dithering without a grid: a threshold 0-1 at each pixel from a 32 px tile of blue noise (made once, void and cluster: its
  // points as evenly spread as can be, no pattern), each tile of the window that tile turned, flipped and shifted its own way

      layered(t.wisp, w, h, [[2 * cell, cell / 1.5, 1, seed + 3]]);
      return (textures[depth] = t);
    }
    function light(c) {   // the cloud's look now: its density, lit from above, into its band's shades
      const tex = texture(c.depth), tw = tex.w, ty = Math.floor(c.place * Math.max(1, tex.h - c.h));
      const {w, h} = c, d = DEPTHS[c.depth], ramp = HAZE[built - 1], px = c.img.data, dens = density.length >= w * h ? density : new Float32Array(w * h);
      // (its shape: the most of its puffs' cones at each pixel, each puff's only over its own box: below -0.5 nothing shows)
      const r0 = Math.floor(c.roll), f = c.roll - r0, under = h - c.base, shape = sharp.length >= w * h ? sharp : new Float32Array(w * h);
      shape.fill(-0.5, 0, w * h);
      for (const p of c.puffs) {
        const r = p.r * (1 + p.beat * Math.sin(c.age * p.rate + p.phase)), rx = r * 1.25;
        const x0 = Math.max(0, Math.floor(p.x - 1.5 * rx)), x1 = Math.min(w - 1, Math.ceil(p.x + 1.5 * rx));
        const y0 = Math.max(0, Math.floor(p.y - 1.5 * r)), y1 = Math.min(h - 1, Math.ceil(p.y + 1.5 * r));
        for (let y = y0; y <= y1; y++) {
          const dy = (y - p.y) / r, dy2 = dy * dy;
          for (let x = x0, i = y * w + x0; x <= x1; x++, i++) {
            const dx = (x - p.x) / rx, v = 1 - Math.sqrt(dx * dx + dy2);
            if (v > shape[i]) shape[i] = v;

      }
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let s = shape[y * w + x];
        if (s <= -0.5) { dens[y * w + x] = 0; continue; }
        if (y > c.base) s -= 0.9 * (y - c.base) / under;   // (a soft underside)
        const row = (y + ty) * tw, a = row + (x + r0) % tw, b = row + (x + r0 + 1) % tw, tn = tex.noise, tk = tex.wisp;
        const n = tn[a] + (tn[b] - tn[a]) * f, k = tk[a] + (tk[b] - tk[a]) * f;

        // most to the right, behind it)
        const edge = Math.min(x + 1, w - x, y + 1, h - y) / 3;   // (nothing at the sprite's own edge)
        dens[y * w + x] = clamp(v, 0, 1) * Math.min(1, edge);

          const step = Math.min(4, Math.max(0, Math.floor(v * 4.4 + (v < 0.3 ? 0.8 : 0.35) * (t2 - 0.5) + 0.35)));
          if (!step) { px[o + 3] = 0; continue; }

          let tone = 0.95 * Math.exp(-tau[x] / deep) + 0.2 * (1 - v) - 0.08;
          tone = 0.45 + (tone - 0.45) * d.contrast;

          const col = ramp[shade];

      const area = -Math.log(1 - COVER[level - 1]) * W * H;

    };
    function build(level) {   // the band's clouds: those there kept (lit in its shades), more fading in or some fading out
      const fresh = !clouds.length;

        const mine = clouds.filter((c) => c.depth === depth && !c.leaving), leaving = clouds.filter((c) => c.depth === depth && c.leaving);
        if (mine.length > want[depth]) {   // (fewer: those kept spread across the window, the rest fading out)
          mine.sort((a, b) => a.x - b.x);
          const keep = new Set(Array.from({length: want[depth]}, (_, i) => mine[Math.floor((i + 0.5) * mine.length / want[depth])]));
          for (const c of mine) if (!keep.has(c)) { c.leaving = true; leaving.push(c); }

        for (let k = 0, more = want[depth] - mine.length; k < more; k++) {

    const place = (m, anywhere) => {
      m.id = ++born;
      m.x = anywhere ? between(0, W) : W + between(0, 6);

      m.phase = between(0, 7);
      m.bob = between(0.6, 2);         // (px/s: a slow wander up and down)
    };
    // (for the tests: a cloud's look as lit last: the mean luminance (by alpha) of the upper half of its rows that show anything,
    // and of the lower half; the mean alpha (0-1) of the pixels its density puts deep inside (alpha's top step) and at its edges
    // (the lowest step); or null)
    function look(id) {

      if (!c) return null;

      for (let y = 0; y < c.h; y++) for (let x = 0; x < c.w; x++) if (px[(y * c.w + x) * 4 + 3]) { rows.push(y); break; }
      if (!rows.length) return null;
      const mid = (rows[0] + rows[rows.length - 1] + 1) / 2, sum = [0, 0], weight = [0, 0];
      for (let y = rows[0]; y <= rows[rows.length - 1]; y++) for (let x = 0; x < c.w; x++) {

      strength: () => [0.44, 0.52, 0.6, 0.7, 0.82][Math.max(1, built || e.level) - 1],
      need: () => (W * H / 1800) * (0.6 + 0.2 * Math.max(1, e.level || built)),   // (the motes: about 65 at Moderate on a laptop)
      count: () => motes.length,
      forget() { motes = []; slide = 0; clouds = []; built = 0; },
      resize() { built = 0; motes = []; clouds = []; textures = []; },
      // (for the tests: its band as drawn, how far it has drifted leftward (px, the middle depth's), its drift now (px/s), its motes
      // [id, x, y], its clouds [id, depth, x, y, w, h] (art px, on the window), how many times a cloud has been lit, how many on show
      // are yet to be lit in its band's shades (a few frames after it changes), how many are fading in or out (FADE_S after),
      // look(id))
      probe: () => ({level: built, slide, speed, motes: motes.map((m) => [m.id, m.x, m.y]), lit, look,

                     settling: clouds.filter((c) => c.leaving || c.shown < 1).length,

  });

  // ---------- uv and heat: soft shafts of light coming in from the top, slowly swaying and breathing ----------
  // Each shaft a dithered wedge, widening and fading as it comes down; drawn twice, a wide faint halo and a narrow bright core, the two
  // breathing out of step, so it seems to waver. Each sways a pixel or so side to side about its own place, very slowly (a minute
  // and a half to two a sway), never travelling on. shaftOf(colours, wide, long, slope, bright): one (its top `rows` rows only: the

  // ---------- heat: soft shafts of faint red light from the top, as the UV's, between the UV's (with both on, the two interleave) ----------
  // One in each gap between the UV's shafts' places (halfway between two, and one half a spacing past the last), each 40 % longer
  // than the UV's shaft to its left, leaning as its two neighbours do (so never crossing them); its own width, breathing and sway.
  // Stronger the hotter (its level: 0.3 at 35 °C to 1 at 43 °C): brighter, and more of them (about that share of them on, the
  // others fading out), the first few on at 35 °C spread about at random. Drawn behind the flood (nothing below its water).
  const EMBER = ["#3A0503", "#6E0B05", "#B8160A", "#FF2A14", "#FF7A66"].map(rgb);   // scarlet, infrared imagery's red (no orange, hardly any blue), faint (the UV's violet's way)
  const HEAT_LONGER = 1.4;             // each this much longer than a UV shaft
  const heat = effect((e) => {
    const random = streamOf("heat"), between = random.between;   // (its own randomness)
    let shafts = [], last = null;
    return {
      strength: () => 0.4 + 0.4 * e.level,
      // (for the tests: the UV's places (art px) and its shafts' tops' middles there (unswayed), each shaft {x: its place, long (art px), uvLong: the UV shaft's to its left, on: how
      // far shown (0-1), at: its left as last drawn (null: not drawn), top: its top's middle then}, the window's size)
      probe: () => ({level: e.level, size: [W, H], uv: uvShafts().map((s) => s.x),

                     shafts: shafts.map((s) => ({x: s.x, long: s.long, uvLong: s.uvLong, on: s.on, at: s.at,

  // ---------- wind: autumn leaves blowing past right to left, three deep, caught in eddies and gusts; wisps of the wind itself ----------
  const LEAF_COLOURS = [   // [shadow, base, light] for: red, amber, ochre, green, brown; and the stem
    ["#5A1915", "#922B20", "#C24C34"], ["#66290F", "#A94B1B", "#D87A33"], ["#62420F", "#9E7024", "#D2A142"],

    [["..l...", ".lml.d", "lmvmmd", ".mvmd.", "..s..."], ["..lll..", "slvvvmd", "..mmdd."]],

  const TURN = [1, 0.7, 0.35, -0.35, -0.7, -1, -0.7, -0.35, 0.35, 0.7];   // a leaf turning over and back (negative: its underside)
  const wind = effect((e) => {
    const random = streamOf("wind"), between = random.between;   // (its own randomness)
    // The air: a steady wind to the left, pulsing with gusts; slow turbulence over it (the curl of a few drifting waves: it swirls,
    // never piles up); and a few eddies drifting along behind it, each a vortex that draws leaves near it onto a ring and sweeps them
    // round and round, then flings them off as it dies away. A leaf eases toward the air's speed where it is (it has a little
    // weight), turning over faster the faster the air turns about it. A few wisps of the wind itself trace the same air. Gust bands
    // roll along with it, one set for everything: the air faster in a band, slower between, harder after a gust; the rain rides them
    // (across(), below), the leaves a little (with or without the rain). In the rain, a drop that hits a leaf knocks it (knock()):
    // a push along the drop's slant, down and on, and a burst of spin; hit after hit, it tumbles and is battered down. A tiny splash on
    // the leaf where it hit. A flood: none blown in under its water; one its surface reaches is the flood's (wade()).
    // (All of it is worked out downwind along +x, from the left edge, and drawn mirrored: on screen x is W - x, the sprites mirrored
    // too, so everything, the gusts, turbulence and eddies, goes right to left, the leaves and wisps coming in at the right edge.)
    const LAYERS = [{speed: 40, alpha: 0.5, share: 0.4}, {speed: 60, alpha: 0.75, share: 0.35}, {speed: 85, alpha: 1, share: 0.25}];
    const CALM = 0.6;                  // on narrow art (a phone's) the wind slower, down to this (else leaves cross before they loop)
    const DRIFT = 60;                  // the turbulence's own speed along (px/s, at no gust); the eddies lag it
    const EDDY_DRAW = 150;             // how hard an eddy draws leaves onto its ring, and flings them off (px/s, about)
    const STEADY = 45, BANDS = 190;    // the rain's push from the wind (leftward px/s on the nearest drops): steady, and in its bands, each way
    const LEAF_BANDS = 0.3;            // ... the leaves' from the bands (of their own speed, each way)

        limb(23, 26, 21, 38, 2.4, "hide", 0.55), limb(47, 26, 49, 38, 2.4, "hide", 0.55),
        slab(18, 37, 24, 40, "hoof", () => 0.3), slab(47, 37, 52, 40, "hoof", () => 0.3),

        ball(38, 19, 20, 11, piebald),
        limb(28, 27, 28, 38, 2.6, "hide"), limb(52, 25, 53, 38, 2.6, "hide"),

        ball(29, 53.5, 24, 2.5, "dirt"), ball(14, 54, 5, 1.8, "grass"), ball(43, 54.5, 6, 1.6, "grass"),
        poly([[0, 25], [7, 10], [29, 0], [51, 10], [58, 25], [55, 25], [48, 12], [29, 4], [10, 12], [3, 25]], "slate", shingles),

    // comb and wattle; its stubby wings splayed out stiffly, its thin legs dangling straight down from under it (`legs`: their swing's

      const t = turn, [l, r] = LEG_SWING[legs], pupil = C("dark", 0), shine = C("eye", 3), shut = C("feather", 0);
      const W2 = 44, H2 = 50, cx = 22, cy = 26, c = Math.cos(tilt), s = Math.sin(tilt);
      const at = (x, y) => [cx + c * (x - cx) - s * (y - cy), cy + s * (x - cx) + c * (y - cy)];   // (a point of the upright chicken, tilted)
      const tilted = (part) => ({m: part.m, at: (x, y) => {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;

      const over = [];
      for (const [ex, ey, er] of eyes) {
        const [x, y] = at(ex, ey), px = Math.floor(x), py = Math.floor(y);
        if (blink) { for (let i = -Math.round(er) + 1; i < Math.round(er); i++) over.push([px + i, py, shut]); continue; }
        const ox = er > 3.5 ? 0 : 1;   // (the smaller one's pupil drifting off outward: not quite looking at the same thing)
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) over.push([px + ox + i, py + j, (i < 0 && j < 0) ? shine : pupil]);   // (a glint)
      }
      const legsOf = (hip, swing, side) => {   // (from under it, tilted with it, straight down; toes drooping)
        const [x0, y0] = at(hip, 37), fx = x0 + swing, fy = y0 + 8;
        return [limb(x0, y0, fx, fy, 0.7, "beak"), limb(fx, fy, fx - 1.5 * side, fy + 3, 0.55, "beak"),
                limb(fx, fy, fx + side, fy + 3.5, 0.55, "beak"), limb(fx, fy, fx, fy + 4, 0.55, "beak")];
      };
      const eyeParts = blink ? [] : eyes.map(([ex, ey, er]) => ball(ex, ey, er, er, "eye"));
      return sculpt(W2, H2, [
        ...legsOf(18, l, 1), ...legsOf(26, r, -1),
        ...[ball(22, 30, 12.5, 11, "feather"),
            limb(11, 27.5, 5, 24.5, 3.1, "feather", 0.95), limb(33, 27.5, 39, 24.5, 3.1, "feather", 0.8),   // (its wings, splayed stiffly)
            ball(19.5 + t * 0.4, 4.6, 1.9, 2.1, "comb"), ball(22 + t * 0.5, 3.6, 2.1, 2.6, "comb"), ball(24.5 + t * 0.4, 4.8, 1.8, 2, "comb"),
            ball(22 + t * 0.6, 13.5, 10, 9.2, "feather"),
            ...eyeParts,
            ball(22.6 + t, 21.6, 1.3, 2, "comb"),
            ball(22 + t, 18.6, 2.2, 1.3, "beak"), ball(22 + t, 20, 1.6, 0.9, "beak", 0.6)].map(tilted),

    };
    // A sprite turned `angle` rad about its middle (a canvas S x S, S its diagonal): each pixel the most common colour of its 3x3 points

      const S = Math.ceil(Math.hypot(w, h)) + 2, out = canvasOf(S, S), g = out.getContext("2d"), img = g.createImageData(S, S);

    };

    // (each made once, when first needed: a millisecond or two; at most one a frame, the others keeping theirs till the next)

      const chick = f.kind === "chicken", step = chick ? Math.PI / 60 : 2 * Math.PI / TURNS, turn = Math.round(f.angle / step);
      const key = chick ? `chicken ${f.turn} ${f.legs} ${f.blink < 0} ${turn}` : `${f.kind} ${((turn % TURNS) + TURNS) % TURNS}`;

        made = true;
      }
      return f.pic = pic;
    }
    const KINDS = ["cow", "barn", "chicken"];
    const SHED = {cow: [C("grass", 2), C("grass", 3), C("dirt", 2)], barn: [C("hay", 2), C("hay", 3), C("red", 2), C("trim", 1)],
                  chicken: [C("feather", 3), C("feather", 2)]};

      strength: () => 0.45,
      need: () => flyers.length ? BITS : 0,
      count: () => bits.length,
      want() {},                       // (no condition of its own: fling() sends one, and it's on while one is crossing)
      fade() { e.level = e.amount = flyers.length || bits.length ? 1 : 0; },
      clear() { flyers = []; bits = []; e.level = e.amount = 0; },
      forget() { this.clear(); },

    // so each starts afresh once the animations are on again)

  });

  // Something big blown across far behind (a gust over 99 km/h; `kind`: "cow", "barn" or "chicken", else one at random): its kind,

    start();
    return sent;
  }

  return {set, fling, timeScale: (k) => { scale = k; },   // (test-only: the weather's time this many times as fast, each frame)
          advance, frost: (quick) => effects.ice.probe(quick),   // (test-only: frames now; the frost as it is now)
          clock: () => ({frames, clock, running: running()}),   // (test-only: Sky.state()'s, cheaply)
          state: () => ({effects: ORDER.filter((k) => effects[k].level > 0), running: running(), frames, cost, clock, size: [W, H, P],
                              particles: Object.fromEntries(ORDER.map((k) => [k, effects[k].count()])), budget: W * H * BUDGET,
                              own: [...OWN_BUDGET], drawn: {...drawn}, cap: CAP,
                              levels: Object.fromEntries(ORDER.map((k) => [k, effects[k].level])), iceReach: effects.ice.reach(),
                              wind: effects.wind.probe(), rain: effects.rain.probe(), haze: effects.haze.probe(),
                              humidity: effects.humidity.probe(), flood: effects.flood.probe(), heat: effects.heat.probe(),

})();
