<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--link preview-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14191D">
<meta name="color-scheme" content="dark">
<title>Weather Dashboard</title>
<!-- The gauges, live (lib/web_dashboard.py): drawn here from /dashboard/data as the PNG (lib/gauges.py) draws them, in the same
     colours and sizes (lib/gauge_look.py, sent with the data); redrawn on each /dashboard/events event, and every minute regardless.
     The tiles can be rearranged in the browser: dragged to reorder (a long press on a touch screen), hidden with their × or the
     remove zone, all put back with "reset preferences"; kept in localStorage ("ecobot.dashboard.v1"), nothing sent to the server.
     A click or tap on a gauge zooms its tile (title and gauge, no table) to fill the window, a gallery paged through by keys, swipes and drags; Esc goes back.
     Behind everything, the weather as pixel art on one canvas (Sky): rain, smog, uv, humidity, wind, heat and ice, each while the
     readings call for it, its tile framed in red; "stop animations" in the strip stops them. -->
<style>
  :root { --bg: #14191D; --ink: #E8EAED; --soft: #B8BDC2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow-x: hidden; overflow-y: auto; }
  #grid { display: grid; justify-content: center; align-content: center; padding: var(--pad, 8px);
    padding-bottom: calc(var(--pad, 8px) + var(--status, 18px)); min-height: 100%; }   /* (room under the tiles for the status line) */
  /* A tile: its own background clear (whatever is behind the page shows through it), its foreground opaque; a thin opaque frame
     (::before, inset, so neighbours don't share a line), seen only on mouseover, picked up, focused or red. Its gauge can be dragged (user-select none), its
     title, reading and table keep their text selectable. transform-origin 0 0: the reflow animations' scale is from the corner.
     Its contents are placed by its width alone (cqw), so the zoomed view, its box only their top (the title and gauge), shows them alike. */
  .tile { position: relative; container-type: inline-size; overflow: hidden; background: transparent; transform-origin: 0 0;
    transition: opacity 0.9s ease, transform 0.22s ease; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile::before { content: ""; position: absolute; inset: 0.9cqw; border: 1px solid transparent; border-radius: 2.5cqw; pointer-events: none; }
  @media (hover: hover) { .tile:hover::before { border-color: #262E34; } }   /* (its frame unseen until the mouse is over it) */
  .tile.faded { opacity: var(--fade, 0.4); }   /* no reading now: dimmed towards the card (as the PNG blends its colours) */
  .tile svg { position: absolute; left: 0; top: 0; width: 100%; display: block; }   /* (its height: by the width, drawTile()) */
  .tile svg text { font-family: inherit; }
  .title, .unit, .chip, .figure, .tile svg text.reading { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .at { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 1; }
  .title { left: 0; right: 0; }
  .chip { border-radius: 1.875cqw; }
  /* The grip and the × (hide), shown only on mouseover, on a tile picked up, or (touch) on one long-pressed and let go in place */
  .grip, .close { position: absolute; top: 6px; z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .grip { left: 8px; width: 10px; height: 15px; cursor: grab;
    background: radial-gradient(circle, var(--soft) 1.1px, transparent 1.5px) 0 0 / 5px 5px; }
  .close { right: 5px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--soft);
    font: 18px/22px system-ui, sans-serif; cursor: pointer; }
  .close:hover, .close:focus-visible { color: var(--ink); background: #262E34; outline: none; }
  @media (hover: hover) { .tile:hover .grip, .tile:hover .close { opacity: 1; pointer-events: auto; } }
  .tile.lifted .grip, .tile.lifted .close, .tile.armed .grip, .tile.armed .close, .tile:focus-visible .close, .tile:has(.close:focus-visible) .close
    { opacity: 1; pointer-events: auto; }
  /* A tile can take the keyboard's focus (Enter or Space zooms it): its frame lit then, rather than the browser's outline. (A click
     on the text focuses it too, unseen: hence the × above shown for the keyboard's focus only.) */
  .tile:focus { outline: none; }
  .tile:focus-visible::before { border-color: var(--soft); }
  body.dragging .tile:not(.lifted) .grip, body.dragging .tile:not(.lifted) .close { opacity: 0; }
  /* A tile whose reading calls up an effect behind the tiles (Sky): framed in red, its frame alone (thin, as the others'); before the
     drag's frames below, so a framed tile lifted, or over the remove zone, shows those as any other */
  /* (Off for now, the class still set: to bring the red frames back, restore these two rules.)
  .tile.alert::before { border-color: #D9363E; }
  .tile.alert:focus-visible:not(.lifted)::before { border-color: #FF9EA1; } */
  .tile.lifted { z-index: 2; transition: opacity 0.9s ease; }    /* follows the pointer: no easing of its own */
  .tile.lifted::before { border-color: #5A6670; }
  .tile.doomed::before { border-color: #E5484D; }
  body.dragging, body.dragging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }
  /* The remove zone: slides down from the top while a tile is dragged; a tile dropped on it is hidden */
  #remove { position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 3; display: flex; align-items: center; justify-content: center;
    font-size: 15px; letter-spacing: 0.04em; color: #F2B8B5; background: rgba(58, 22, 26, 0.92); pointer-events: none;
    transform: translateY(-100%); transition: transform 0.2s ease; }
  #remove.on { transform: none; }
  #remove.over { color: #FFFFFF; background: rgba(150, 34, 42, 0.95); }
  /* The weather behind everything (Sky, below): one canvas, the window's size, fixed, first in the page; its pixels scaled up crisply */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #sky canvas { position: absolute; left: 0; top: 0; image-rendering: crisp-edges; image-rendering: pixelated; }
  #status { position: fixed; right: 0; bottom: 0; height: var(--status, 18px); padding: 0 10px; font-size: 12px;
    line-height: var(--status, 18px); color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; z-index: 1; }
  #status .link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    text-decoration-color: #5A6670; text-underline-offset: 2px; }
  #status .link:hover, #status .link:focus-visible { color: var(--ink); }
  html.scroll { scroll-snap-type: y proximity; scroll-padding-top: var(--pad, 8px); }
  .tile { scroll-snap-align: start; }
  html.scroll:has(body.dragging) { scroll-snap-type: none; }   /* (a drag's own scrolling stops where it stops) */
  #status.lost { color: #F4A93B; }
  #message { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center;
    font-size: 20px; color: var(--soft); }
  body.unavailable #message { display: flex; }
  /* The cursor: over a gauge, a magnifier with + while there's more than one tile (a click zooms it), with − in the zoomed view (a
     click goes back); over the text, the usual one. (.tablearea: under the table's chips, so the gaps between them count as the table.) */
  body.many:not(.zoomed) .tile { cursor: zoom-in; }
  body.zoomed #grid { cursor: zoom-out; }
  .title, .unit, .chip, .figure, .tile svg text.reading { cursor: auto; }
  .tablearea { cursor: default; }
  /* The zoomed view, a gallery: #grid becomes a strip of the visible tiles side by side, each as large as fits and centred in its own
     window-wide place (the strip as wide as them all, so it's under the pointer wherever it is), slid sideways (its transform) to page
     through them; the page itself doesn't scroll meanwhile, and a
     sideways swipe never reaches the browser (no back/forward). The grip and × aren't needed here: hidden. */
  html.zoomed, html.zoomed body { overflow: hidden; overscroll-behavior-x: contain; }
  body.zoomed #grid { position: fixed; inset: 0 auto 0 0; width: calc(var(--n) * var(--pitch)); display: block; padding: 0; min-height: 0;
    touch-action: pinch-zoom;
    -webkit-user-select: none; user-select: none; }
  body.zoomed .tile { position: absolute; top: var(--zy); left: calc(var(--zx) + var(--i) * var(--pitch)); width: var(--zw); height: var(--zh); }
  body.zoomed .grip, body.zoomed .close { display: none; }
  /* Zoomed (the gallery's tiles too), only the title and the gauge: the tile's box just their part of it (--zh), the Daily/Monthly/
     Yearly table hidden: gone at once as the tile grows, and while it shrinks back (never drawn large over the others), then fading
     in, in its place */
  .unit, .chip, .figure, .tablearea { transition: opacity 0.15s ease; }
  body.zoomed .tile.fading { height: var(--zfull); }   /* (fading out where they were: whole, their table too) */
  body.zoomed .tile:not(.fading) :is(.unit, .chip, .figure, .tablearea), .tile.zooming :is(.unit, .chip, .figure, .tablearea)
    { opacity: 0; visibility: hidden; transition: none; }
  .tile.zooming { z-index: 2; }        /* (the tile zooming in or out, over the others) */
  body.paging, body.paging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }
  @media (prefers-reduced-motion: reduce) { .tile, .grip, .close, #remove, .tile :is(.unit, .chip, .figure, .tablearea) { transition: none !important; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><canvas></canvas></div>
<main id="grid" aria-live="polite"></main>
<div id="message"></div>
<div id="remove" aria-hidden="true">× remove</div>
<div id="status">loading…</div>
<script>
"use strict";
// ---------- the weather behind the tiles: pixel art on one canvas filling the window, behind everything ----------
// Drawn at a low resolution (one art pixel: P CSS px, about a third of the window across) and scaled up crisply (image-rendering:
// pixelated). Every sprite and texture is drawn once to a small offscreen canvas and blitted; one loop (at most 30 frames a second)
// for every effect, each frame cleared once and drawn back to front (ORDER). The effects share a particle budget and a cap on their
// strength together, so several at once are no busier or brighter than one strong one. Nothing runs while no effect is on or fading
// out; the tab hidden, it waits; with reduced motion, one still, faint frame and no loop.
//   Sky.set(want, animate): want {rain: 0-1 (its strength), smog: 0-5 (the AQI's band above Good), uv, humidity, wind, heat: 0 or
//   1, ice: how far below 0 °C it is (0: none)}; animate false (the page's "stop animations"): nothing drawn.
//   Sky.state(): {effects, running, frames, cost (ms a frame, averaged), size: [art width, art height, P], particles (each effect's
//   now), budget (theirs together, at most), levels, iceReach (art px)}, for the tests.
const Sky = (() => {
  const holder = document.getElementById("sky"), canvas = holder.querySelector("canvas"), ctx = canvas.getContext("2d");
  const STILL = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FRAME_MS = 1000 / 30;          // the frame rate's cap: art moving a pixel at a time needs no more
  const FADE_S = 1.5;                  // an effect fades in, and out, over this long
  const ART_PX = 480;                  // the art's width (or height, if taller) about this many pixels: P = 3 on a laptop, 4 on 1920
  const BUDGET = 1 / 400;              // the particles of every effect together: this many per art pixel² (480 x 300: 360)
  const CAP = 1.5;                     // ... and their strengths together at most this (one strong effect: about 0.8)
  const STILL_HINT = 0.5;              // reduced motion: the still frame this faint
  const ORDER = ["smog", "heat", "uv", "rain", "wind", "humidity", "ice"];        // back to front
  let W = 0, H = 0, P = 3;             // the art's size (art px) and one art pixel's (CSS px)

  // ---------- tools: seeded randomness, colours, dithering, noise, little canvases ----------
  const seeded = (seed) => () => {     // (mulberry32: the same art every time)
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const random = seeded(1115);
  const between = (a, b) => a + (b - a) * random();
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  // Ordered dithering (Bayer 4x4): a level 0-1 at pixel (x, y) as one of n shades (0 to n-1), or -1 for none
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const shadeOf = (v, x, y, n) => Math.min(n - 1, Math.floor(v * n + BAYER[(y & 3) * 4 + (x & 3)] - 1));
  // Value noise, smooth, 0-1, repeating every `period` cells across (a texture that wraps sideways)
  const hash = (i, j, s) => {
    let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  function noise(x, y, period, s) {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const i0 = ((xi % period) + period) % period, i1 = (i0 + 1) % period;
    const top = hash(i0, yi, s) + (hash(i1, yi, s) - hash(i0, yi, s)) * sx;
    const bottom = hash(i0, yi + 1, s) + (hash(i1, yi + 1, s) - hash(i0, yi + 1, s)) * sx;
    return top + (bottom - top) * sy;
  }
  function canvasOf(w, h) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  }
  // A canvas painted pixel by pixel: paint(x, y) gives a colour [r, g, b] (or [r, g, b, alpha 0-255]), or nothing for clear
  function painted(w, h, paint) {
    const c = canvasOf(w, h), g = c.getContext("2d"), img = g.createImageData(c.width, c.height), d = img.data;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
      const p = paint(x, y);
      if (!p) continue;
      const i = (y * c.width + x) * 4;
      d[i] = p[0]; d[i + 1] = p[1]; d[i + 2] = p[2]; d[i + 3] = p.length > 3 ? p[3] : 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  // A sprite from a pixel map: rows of characters, each a key of `palette` ({char: [r, g, b]}), any other character clear
  const mapped = (rows, palette) => painted(rows[0].length, rows.length, (x, y) => palette[rows[y][x]]);
  // ... mirrored and squeezed sideways to `scale` of its width (a leaf turning over): negative, mirrored
  function squeezed(rows, scale) {
    const w = rows[0].length, n = Math.max(1, Math.round(w * Math.abs(scale)));
    return rows.map((row) => Array.from({length: n}, (_, i) => {
      const j = Math.min(w - 1, Math.floor((i + 0.5) / n * w));
      return row[scale < 0 ? w - 1 - j : j];
    }).join(""));
  }

  // An effect: its level (0 off), how present it is (0-1: fading in and out), its strength (how bright at full) and the particles it
  // would like (at full), resized to the window, stepped and drawn each frame. Each one below fills in its own. One that takes a
  // share of the particles (need() above 0) says how many it has with count(), so the budget can be checked.
  function effect(own) {
    const e = {level: 0, amount: 0, strength: () => 0.8, need: () => 0, count: () => 0, resize() {}, step() {}, draw() {},
               want(v) { e.level = v; },
               fade(dt) { e.amount = STILL ? (e.level > 0 ? 1 : 0) : clamp(e.amount + (e.level > 0 ? dt : -dt) / FADE_S, 0, 1); },
               alive: () => e.level > 0 || e.amount > 0};
    return Object.assign(e, own(e));
  }

  // ---------- rain: streaks from the top right, three layers deep, splashing at the bottom ----------
  const RAIN = ["#2A4560", "#3A6688", "#5A90B8", "#8FC2E2", "#D6F0FF"].map(rgb);
  const rain = effect((e) => {
    const SLANT = 0.45;                // px left for each px down
    const LAYERS = [                   // far (short, dim, slow) to near; [tail, body, head] shades
      {speed: 150, length: [3, 4], alpha: 0.55, shades: [0, 1, 2], share: 0.45},
      {speed: 230, length: [5, 6], alpha: 0.8, shades: [1, 2, 3], share: 0.33},
      {speed: 330, length: [8, 10], alpha: 1, shades: [1, 3, 4], share: 0.22, splash: true}];
    // A streak: its bright head at the bottom left, its tail fading up to the right
    const streak = (n, [tail, body, head]) => {
      const w = Math.round((n - 1) * SLANT) + 1;
      return painted(w, n, (x, y) => {
        if (x !== Math.round((n - 1 - y) * SLANT)) return null;
        const p = y / (n - 1);
        return [...RAIN[p > 0.8 ? head : p > 0.35 ? body : tail], Math.round(255 * (0.3 + 0.7 * p))];
      });
    };
    const sprites = LAYERS.map((l) => l.length.map((n) => streak(n, l.shades)));
    // A splash, frame by frame: a bead, a crown, droplets thrown wider, falling back ([dx, dy, shade] from where the drop landed)
    const SPLASH = [[[0, 0, 4], [0, -1, 3]],
                    [[0, 0, 2], [-1, -1, 4], [1, -2, 3]],
                    [[-2, -2, 3], [2, -3, 2], [0, 0, 1]],
                    [[-3, -1, 2], [3, -2, 1]],
                    [[-4, 0, 1], [3, -1, 1]]].map((dots) =>
      painted(9, 5, (x, y) => { const d = dots.find(([dx, dy]) => dx + 4 === x && dy + 4 === y); return d && RAIN[d[2]]; }));
    let drops = [], splashes = [], mist = null;
    const spawn = (d, anywhere) => {
      const l = LAYERS[d.layer];
      d.sprite = sprites[d.layer][random() < 0.5 ? 0 : 1];
      d.v = l.speed * between(0.85, 1.15);
      d.y = anywhere ? between(-10, H) : between(-H * 0.25, -10);
      d.x = between(0, W + H * SLANT);
      d.floor = l.splash ? between(H * 0.8, H + 2) : H + 12;
    };
    return {
      strength: () => 0.55 + 0.35 * e.level,
      need: () => (W * H / 1000) * (0.1 + 2.4 * Math.pow(e.level, 1.5)),   // (light: about 85 drops on a laptop; heavy: 360)
      count: () => drops.length,
      resize() {
        drops = [];
        mist = painted(W, Math.ceil(H * 0.12), (x, y) => {   // heavy rain's spray, low down
          const s = shadeOf(Math.pow(y / (H * 0.12), 2) * 0.55, x, y, 3);
          return s < 0 ? null : RAIN[s];
        });
      },
      step(dt, t, share) {
        const n = Math.round(this.need() * share);
        while (drops.length < n) {   // (the layers in their shares, far first: drawn back to front)
          const k = drops.length / Math.max(n, 1);
          const d = {layer: k < LAYERS[0].share ? 0 : k < LAYERS[0].share + LAYERS[1].share ? 1 : 2};
          spawn(d, true);
          drops.push(d);
        }
        if (drops.length > n) drops.length = n;
        drops.sort((a, b) => a.layer - b.layer);
        const pace = 0.8 + 0.4 * e.level, sway = SLANT * (1 + 0.12 * Math.sin(t * 0.37));
        for (const d of drops) {
          const fall = d.v * pace * dt;
          d.y += fall;
          d.x -= fall * sway;
          if (d.y + d.sprite.height >= d.floor) {
            if (d.floor < H && splashes.length < 40) splashes.push({x: d.x, y: d.floor, age: 0});
            spawn(d, false);
          }
        }
        for (const s of splashes) s.age += dt;
        splashes = splashes.filter((s) => s.age < 0.24);
      },
      draw(g, alpha) {
        let layer = -1;
        for (const d of drops) {
          if (d.layer !== layer) { layer = d.layer; g.globalAlpha = alpha * LAYERS[layer].alpha; }
          g.drawImage(d.sprite, Math.round(d.x), Math.round(d.y));
        }
        g.globalAlpha = alpha * 0.8;
        for (const s of splashes) g.drawImage(SPLASH[Math.min(4, Math.floor(s.age / 0.05))], Math.round(s.x) - 4, Math.round(s.y) - 4);
        if (e.level > 0.6) { g.globalAlpha = alpha * (e.level - 0.6) * 0.9; g.drawImage(mist, 0, H - mist.height); }
      },
    };
  });

  // ---------- smog: banks of haze drifting low across the window, three deep; thicker, higher and redder with each AQI band ----------
  const SMOG = [   // each band's four shades, dark to light: Moderate (ochre), USG (amber), Unhealthy (rust), Very Unhealthy, Hazardous (maroon)
    ["#2A2616", "#433C21", "#5F552D", "#7C6E38"], ["#2D2216", "#4A3420", "#6A4A29", "#8A6132"],
    ["#2B1B17", "#462820", "#62352B", "#7C4335"], ["#28181F", "#3E2330", "#563040", "#6C3C4E"],
    ["#22101A", "#371722", "#4E1F2C", "#652938"]].map((r) => r.map(rgb));
  const smog = effect((e) => {
    const LAYERS = [{cell: 120, flat: 0.32, drift: 1.2, depth: 0.55, seed: 11}, {cell: 80, flat: 0.36, drift: 2.6, depth: 0.8, seed: 23},
                    {cell: 52, flat: 0.42, drift: 5, depth: 1, seed: 37}];
    let built = 0, textures = [];
    function build(level) {
      built = level;
      const shades = SMOG[level - 1], reach = [0.45, 0.58, 0.72, 0.86, 1][level - 1], thick = [0.62, 0.72, 0.82, 0.92, 1][level - 1];
      textures = LAYERS.map((l) => {
        const cells = Math.max(2, Math.round(W / l.cell)), across = cells / W, down = 1 / (l.cell * l.flat);
        const top = H * (1 - reach * (1.1 - 0.25 * l.depth));   // (the far banks reach higher)
        const density = (x, y) => {   // 0-1: the banks, denser lower down
          const low = clamp((y - top) / (H - top), 0, 1);   // (0 at the smog's top, 1 at the window's bottom)
          const n = 0.65 * noise(x * across, y * down, cells, l.seed) + 0.35 * noise(x * across * 2, y * down * 2, cells * 2, l.seed + 1);
          return clamp((n - 0.58 + low * 0.55) * 2.2, 0, 1) * Math.pow(low, 0.3) * thick * l.depth;
        };
        return painted(W, H, (x, y) => {
          if (y < top) return null;
          const v = density(x, y);
          let s = shadeOf(v * 0.8, x, y, 4);
          if (s >= 0 && v > 0.12 && density(x, y - 3) < v - 0.1) s = Math.min(3, s + 1);   // (a bank's top, catching the light)
          return s < 0 ? null : shades[s];
        });
      });
    }
    return {
      strength: () => [0.4, 0.48, 0.56, 0.64, 0.72][Math.max(1, built || e.level) - 1],
      resize() { built = 0; },
      step() { if (e.level > 0 && (e.level !== built || !textures.length)) build(e.level); },
      draw(g, alpha, t) {
        if (!built) return;

          g.drawImage(textures[i], x, y);

    };
  });

  // ---------- heat: a shimmering amber glow rising from the bottom, its ripples riding up and wavering sideways ----------
  const HEAT = ["#3A1C0A", "#62300E", "#955015", "#C97B24", "#EFB05A"].map(rgb);
  const heat = effect((e) => {
    const SPAN = 0.34, PERIOD = 13, LINES = 7, RISE = 9, SPARE = 4;   // its height (of the window's); its ripples' spacing (px), how many
    // differ before they repeat, their speed (px/s); the spare px each side for wavering
    let glow = null, ripples = null, band = 0;
    return {
      strength: () => 0.75,
      resize() {
        band = Math.ceil(H * SPAN);
        glow = painted(W + 2 * SPARE, band, (x, y) => {   // dithered, brightest at the bottom, in slow columns
          const v = Math.pow(y / band, 2.2) * (0.55 + 0.35 * noise(x / 26, 0.5, Math.ceil((W + 2 * SPARE) / 26), 5));
          const s = shadeOf(v, x, y, 3);
          return s < 0 ? null : HEAT[s];
        });
        const across = W + 2 * SPARE;
        ripples = painted(across, PERIOD * LINES, (x, y) => {   // wavy wisps, a bright crest over a dark trough, every PERIOD px
          const line = Math.round(y / PERIOD) % LINES, wave = Math.round(1.4 * Math.sin(x * (0.08 + 0.015 * line) + line * 2.1) +

  // ---------- uv: soft shafts of violet light coming in from the top, slowly sliding and breathing ----------
  // Each shaft a dithered wedge, widening and fading as it comes down; drawn twice, a wide faint halo and a narrow bright core, the two
  // breathing out of step, so it seems to waver. A faint glow along the top.
  const RAD = ["#22153C", "#3C256A", "#6444A8", "#A287E6", "#EFE7FF"].map(rgb);
  const uv = effect((e) => {
    let shafts = [], glow = null;
    const shaft = (wide, long, slope, bright) => painted(wide * 2 + long * Math.abs(slope) + 2, long, (x, y) => {
      const k = y / long, half = wide * (0.6 + 0.6 * k), mid = wide + (slope < 0 ? long * -slope : 0) + y * slope;
      const across = 1 - Math.abs(x - mid) / half;
      if (across <= 0) return null;
      const s = shadeOf(Math.pow(across, 0.7) * Math.pow(1 - k, 1.1) * bright, x, y, 5);
      return s < 0 ? null : RAD[s];
    });
    return {
      strength: () => 0.8,
      resize() {
        const r = seeded(77);
        const n = Math.max(4, Math.round(W / 70));
        shafts = Array.from({length: n}, (_, i) => {
          const wide = Math.round(10 + r() * 22), long = Math.round(H * (0.4 + r() * 0.5)), slope = 0.12 + r() * 0.1;
          const narrow = Math.max(3, Math.round(wide * 0.5));
          const halo = shaft(wide, long, slope, 0.6), core = shaft(narrow, Math.round(long * 0.8), slope, 0.75);
          return {halo, core, inset: wide - narrow,   // (the core down the halo's middle)
                  x: (i + r() * 0.6) * W / n - 10, phase: r() * 7, rate: 0.3 + r() * 0.25, drift: 0.6 + r() * 0.8};
        });
        glow = painted(W, Math.ceil(H * 0.16), (x, y) => {
          const s = shadeOf(Math.pow(1 - y / (H * 0.16), 2.4) * 0.6, x, y, 3);
          return s < 0 ? null : RAD[s];
        });
      },
      draw(g, alpha, t) {
        g.globalAlpha = alpha * 0.8;
        g.drawImage(glow, 0, 0);
        for (const s of shafts) {
          const span = W + s.halo.width, x = Math.round(((s.x + t * s.drift) % span + span) % span - s.halo.width);
          g.globalAlpha = alpha * (0.3 + 0.4 * Math.pow(Math.sin(t * s.rate + s.phase), 2));
          g.drawImage(s.halo, x, 0);
          g.globalAlpha = alpha * (0.15 + 0.55 * Math.pow(Math.sin(t * s.rate * 1.7 + s.phase * 2), 4));

    };
  });

  // ---------- wind: autumn leaves blowing past left to right, three deep, caught in eddies and gusts; wisps of the wind itself ----------
  const LEAF_COLOURS = [   // [shadow, base, light] for: red, amber, ochre, green, brown; and the stem
    ["#5A1915", "#922B20", "#C24C34"], ["#66290F", "#A94B1B", "#D87A33"], ["#62420F", "#9E7024", "#D2A142"],
    ["#2C3F17", "#52702D", "#82A047"], ["#3B2816", "#664629", "#8C6840"]].map((r) => r.map(rgb));

  const LEAF_SHAPES = [   // d shadow, m base, l light, v vein, s stem: far (small), middle, near (a maple, an elm, an oak)
    [[".l.", "lmd", ".d."], ["llm.", "smmd", ".dd."]],
    [["..l...", ".lml.d", "lmvmmd", ".mvmd.", "..s..."], ["..lll..", "slvvvmd", "..mmdd."]],
    [[".....l.....", "..l..l..l..", "..ll.v.ll..", "l..lvvvl..d", ".lllmvmmmd.", "..lmmvmmd..", ".mmmmvmmmd.", "mmmmmvmmmdd",
      "..mmdvmdd..", "....dsd....", ".....s....."],
     ["....lll...", "..llmmmmm.", "ssvvvvvvvd", "..mmmmmdd.", "....ddd..."],
     ["..l.l...", ".lmlmld.", "lmmvmmd.", ".lvmmvmd", "lmmvmmd.", ".dmvmd..", "..dsd...", "...s...."]]];
  const TURN = [1, 0.7, 0.35, -0.35, -0.7, -1, -0.7, -0.35, 0.35, 0.7];   // a leaf turning over and back (negative: its underside)
  const wind = effect((e) => {
    // The air: a steady wind to the right, pulsing with gusts; slow turbulence over it (the curl of a few drifting waves: it swirls,
    // never piles up); and a few eddies drifting along behind it, each a vortex that draws leaves near it onto a ring and sweeps them
    // round and round, then flings them off as it dies away. A leaf eases toward the air's speed where it is (it has a little
    // weight), turning over faster the faster the air turns about it. A few wisps of the wind itself trace the same air.
    const LAYERS = [{speed: 40, alpha: 0.5, share: 0.4}, {speed: 60, alpha: 0.75, share: 0.35}, {speed: 85, alpha: 1, share: 0.25}];
    const CALM = 0.6;                  // on narrow art (a phone's) the wind slower, down to this (else leaves cross before they loop)
    const DRIFT = 60;                  // the turbulence's own speed along (px/s, at no gust); the eddies lag it

    const sprites = LEAF_SHAPES.map((shapes) => shapes.flatMap((rows) => LEAF_COLOURS.flatMap(([d, m, l]) => {
      const under = [d, d, m];   // (its underside: darker)

    // there (its curl, 1/s)

    function airAt(x, y, pace, t) {
      const k = pace / DRIFT;   // (the far layers' air slower, its swirls smaller: parallax)
      // turbulence: the curl of a stream function, two crossed waves riding along with the wind (it swirls, never piles up)
      const X = x - travelled, a = 0.6 * t, A = 420 * (0.7 + 0.6 * gust) * k, B = 110 * k;
      const s1 = Math.sin(0.05 * X + a), c1 = Math.cos(0.05 * X + a), s2 = Math.sin(0.07 * y - 0.7 * a), c2 = Math.cos(0.07 * y - 0.7 * a);
      const s3 = Math.sin(0.11 * X + 1.3 - a), c3 = Math.cos(0.11 * X + 1.3 - a), s4 = Math.sin(0.13 * y - 0.9 * a), c4 = Math.cos(0.13 * y - 0.9 * a);
      let vx = pace * calm * (1 + gust) + A * 0.07 * s1 * c2 + B * 0.13 * s3 * c4;
      let vy = -A * 0.05 * c1 * s2 - B * 0.11 * c3 * s4;

      // While it lasts it draws what comes near onto a ring round its eye (so leaves are caught and go round), then flings them off.
      for (const d of eddies) {

      // on screen rather than being swept across in a moment)
      const narrow = clamp(W / 360, 0.35, 1);
      d.r = Math.min(between(26, 46), 0.3 * Math.min(W, H));
      const edge = Math.min(0.6 * d.r, 0.3 * W);
      d.x = between(edge, anywhere ? W - edge : Math.max(edge, 0.6 * W));   // (springing up on screen, spinning up in place)
      d.y = between(Math.max(H * 0.12, d.r * 0.6), Math.min(H * 0.88, H - d.r * 0.6));
      d.spin = (random() < 0.5 ? -1 : 1) * between(4.5, 6) * d.r;   // (its fastest swirl about 0.43 this, px/s: a turn in 2 s or so)
      d.v = DRIFT * between(0.6, 0.85) * narrow;   // (lagging the wind: swirling faster than it moves, so leaves loop)
      d.vx = d.v; d.vy = 0;
      d.age = anywhere ? between(0, 4) : 0;
      d.life = between(5, 9);
      d.wander = between(0, 7);
      d.on = 0; d.draw = 1;
    };
    const spawn = (f, anywhere) => {
      const set = sprites[f.layer];
      f.frames = set[Math.floor(random() * set.length)];
      f.x = anywhere ? between(-10, W) : between(-30, -8);
      f.y = between(H * 0.05, H * 0.95);
      f.vx = LAYERS[f.layer].speed * calm; f.vy = 0;
      f.weight = between(0.12, 0.3);   // (s: how long it takes to catch the air's speed)
      f.turn = between(0, 10);
      f.spin = between(4, 9);
      f.sink = between(2, 10);
      f.phase = between(0, 7);
    };
    const wisp = (w, anywhere) => {
      w.x = anywhere ? between(0, W) : between(-40, -5);
      w.y = between(H * 0.1, H * 0.9);
      w.trail = [];
      w.fast = between(1.3, 1.7);
    };
    return {
      strength: () => 0.8,
      need: () => W * H / 2600,
      count: () => flying.length,
      resize() { flying = []; eddies = []; wisps = []; },
      step(dt, t, share) {
        calm = clamp(W / 360, CALM, 1);
        const n = Math.round(this.need() * share);
        while (flying.length < n) {
          const k = flying.length / Math.max(n, 1);
          const f = {layer: k < LAYERS[0].share ? 0 : k < LAYERS[0].share + LAYERS[1].share ? 1 : 2};
          spawn(f, true);
          flying.push(f);
        }
        if (flying.length > n) flying.length = n;
        flying.sort((a, b) => a.layer - b.layer);
        // gusts: a sudden push now and then, dying away
        if ((nextGust -= dt) <= 0) { gust += between(0.5, 1.1); nextGust = between(2.5, 6); }
        gust *= Math.exp(-0.9 * dt);
        travelled += DRIFT * calm * (1 + gust) * dt;
        const want = Math.max(4, Math.round(W * H / 30000));   // (at least four, a phone's too)
        while (eddies.length < want) { const d = {}; eddy(d, true); eddies.push(d); }
        for (const d of eddies) {
          d.age += dt;
          const k = clamp(d.age / d.life, 0, 1);
          d.on = Math.pow(Math.sin(Math.PI * k), 0.6);   // (spinning up, and down)
          d.draw = clamp((0.72 - k) * 6, -1, 1);          // (drawing in, then flinging off)
          d.vx = d.v * (1 + 0.6 * gust);
          d.vy = Math.sin(t * 0.5 + d.wander) * 6;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          if (d.age >= d.life || d.x > W + 2 * d.r) eddy(d, false);

          const [vx, vy, curl] = airAt(f.x, f.y, LAYERS[f.layer].speed, t), ease = 1 - Math.exp(-dt / f.weight);

          f.y += f.vy * dt;
          f.turn += (f.spin + Math.min(Math.abs(curl) * 2.5, 14)) * dt;

        while (wisps.length < 4) { const w = {}; wisp(w, true); wisps.push(w); }

      draw(g, alpha, t) {
        for (const w of wisps) {   // (a dotted line along where it went, brightest at its middle, faint at both ends)
          const m = w.trail.length / 2;

  });

  // ---------- humidity: water beading along the top edge, each drop swelling, stretching and falling ----------
  const WATER = ["#1A2E41", "#2C5573", "#5793BC", "#A6D7F2", "#EFFAFF"].map(rgb);
  const humidity = effect((e) => {
    const SIZES = [0.6, 1, 1.4, 1.9, 2.4, 2.9, 3.4];   // a bead's radius, swelling
    // A bead of radius r: dark above, its body, a bright crescent low down where the light comes through, a glint high on the left
    // A bead of radius r hanging from its tip: tapering up to where it clings, a round belly; lit from the top left: a white glint,
    // its body, a bright crescent low inside where the light comes through, a dark rim on the right and below
    const bead = (r) => {
      const w = 2 * Math.ceil(r) + 1, cx = (w - 1) / 2, cy = Math.round(r * 1.3), h = cy + Math.ceil(r) + 1;
      return painted(w, h, (x, y) => {
        const dx = x - cx, dy = y - cy, far = Math.hypot(dx, dy);
        const inside = dy >= 0 ? far <= r + 0.3 : Math.abs(dx) <= r * (y + 0.5) / cy + 0.2;   // (above its middle: the taper)

        if (dy > 0 && far > r - 0.7 && dx > -r * 0.5) return WATER[1];

    const FALLING = [painted(1, 4, (x, y) => WATER[y + 1]), painted(1, 6, (x, y) => [...WATER[Math.min(4, 1 + (y >> 1) + (y > 4))], 80 + 35 * y])];
    let film = null, sites = [];
    const site = (x) => ({x, state: "rest", wait: between(0, 3), r: 0, grow: between(0.35, 0.8), full: between(2.2, 3.4), neck: 0,
                          hang: between(2, 5), drops: []});
    return {
      strength: () => 0.85,
      need: () => W / 16,
      count: () => sites.length,
      resize() {
        film = painted(W, 3, (x, y) => {   // the wet edge
          const s = shadeOf([0.75, 0.45, 0.2][y] + 0.15 * Math.sin(x * 0.21), x, y, 3);
          return s < 0 ? null : WATER[s + (y === 0 ? 1 : 0)];

      },
      step(dt, t, share) {
        const n = Math.max(1, Math.round(this.need() * share));
        if (sites.length !== n) sites = Array.from({length: n}, (_, i) => site(Math.round((i + between(0.2, 0.8)) * W / n)));
        for (const s of sites) {
          if (s.state === "rest") {
            if ((s.wait -= dt) <= 0) { s.state = "swell"; s.r = SIZES[0]; s.neck = 0; }

              Object.assign(s, {state: "rest", wait: between(0.4, 2.5), r: 0, neck: 0, full: between(2.2, 3.4), hang: between(2, 5)});

      draw(g, alpha) {

          g.globalAlpha = alpha;
          if (s.state !== "rest") {
            const sprite = beads[sizeOf(s.r)];
            const neck = Math.floor(s.neck), top = 1 + neck;
            if (neck > 0) { g.fillStyle = `rgb(${WATER[2]})`; g.fillRect(s.x, 2, 1, neck); }   // (stretching: a thread of water)

          for (const d of s.drops) {

      },
    };
  });

  // ---------- ice: frost crystals branching in from the window's edges, thickest in the corners, growing slowly, melting back ----------
  // The crystals are grown once for the window's size (each pixel: how far in it is, on the ice's own measure, and its shade); then
  // shown out to `extent`, drawn to an offscreen canvas only when that has moved half a pixel, and blitted each frame.
  const ICE = ["#132536", "#1F3D56", "#356A8E", "#69A9CF", "#B6E3F7", "#F2FCFF"].map(rgb);
  const ice = effect((e) => {
    const GROW = 2.2, MELT = 4;        // px a second

      d.fill(0);
      const put = (i, c, a = 255) => { d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = a; };
      for (let j = 0; j < rim.length; j++) {

      strength: () => 0.4,             // (faint: crystals cross the tiles at the window's edges; the glints brighter)
      want(v) { e.level = v; if (STILL) extent = reachFor(v); },
      fade() { e.amount = extent > 0 ? 1 : 0; },

                              levels: Object.fromEntries(ORDER.map((k) => [k, effects[k].level])), iceReach: effects.ice.reach()})};
