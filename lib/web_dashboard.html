<!-- The gauges, live (lib/web_dashboard.py): drawn here from /dashboard/data as the PNG (lib/gauges.py) draws them, in the same
     colours and sizes (lib/gauge_look.py, sent with the data); redrawn on each /dashboard/events event, and every minute regardless. -->
<style>
  :root { --bg: #14191D; --ink: #E8EAED; --soft: #B8BDC2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow-x: hidden; overflow-y: auto; }
  #grid { display: grid; justify-content: center; align-content: center; padding: var(--pad, 8px);
    padding-bottom: calc(var(--pad, 8px) + var(--status, 18px)); min-height: 100%; }   /* (room under the tiles for the status line) */
  .tile { position: relative; container-type: inline-size; overflow: hidden; transition: opacity 0.9s ease; }
  .tile.faded { opacity: var(--fade, 0.4); }   /* no reading now: dimmed towards the card (as the PNG blends its colours) */
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tile svg text { font-family: inherit; }
  .at { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 1; }
  .title { left: 0; right: 0; }
  .chip { border-radius: 1.875cqw; }
  #status { position: fixed; right: 0; bottom: 0; height: var(--status, 18px); padding: 0 10px; font-size: 12px;
    line-height: var(--status, 18px); color: var(--soft); background: rgba(20, 25, 29, 0.85); border-top-left-radius: 6px; z-index: 1; }
  html.scroll { scroll-snap-type: y proximity; scroll-padding-top: var(--pad, 8px); }
  .tile { scroll-snap-align: start; }
  #status.lost { color: #F4A93B; }
  #message { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center;
    font-size: 20px; color: var(--soft); }
  body.unavailable #message { display: flex; }
</style>
</head>
<body>
<main id="grid" aria-live="polite"></main>
<div id="message"></div>
<div id="status">loading…</div>
<script>
"use strict";
(() => {
  const BASE = location.pathname.replace(/\/+$/, "");
  const DATA = BASE + "/data", EVENTS = BASE + "/events";
  const REFETCH_MS = 60000;            // the fallback: the data fetched again every minute, events or not
  const MIN_TILE = 160;                // the narrowest tile (CSS px) worth fitting on one screen: narrower, the page scrolls (160: a
                                       // station with its indoor sensor and the air sensor, 17 tiles, fits a 1024x768 tablet)
  const MIN_SCROLL_TILE = 150;         // ... and then the narrowest a column may be (two on a 320-375 px phone, not one huge one)
  const MOVE_MS = 900;                 // how long a gauge takes to move to a new reading
  const RISE_MS = 1000;                // ... and, when the page opens, to rise from its floor (0) to its reading
  const STILL = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PAD = 8, STATUS = 18;
  const NS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("grid"), statusLine = document.getElementById("status"), message = document.getElementById("message");
  let L = null, tiles = [], asOf = null, lost = false, drawn = [], opening = true;   // drawn: each tile on the page, to be moved in place

  // ---------- geometry (lib/gauges.py) ----------
  const rad = (d) => d * Math.PI / 180;
  const polar = (cx, cy, r, deg) => [cx + r * Math.cos(rad(deg)), cy - r * Math.sin(rad(deg))];
  const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
  // How far along its scale (0 to 1) a reading sits (lib/gauge_look.py share): in proportion, or, with `bounds` (the air gauges), each
  // band an equal share and in proportion within it
  const share = (tile, v) => {
    const b = tile.bounds || [];
    if (!b.length) return clamp01((v - tile.low) / (tile.high - tile.low));
    if (v <= b[0]) return 0;
    for (let i = 0; i < b.length - 1; i++) if (v <= b[i + 1]) return (i + (v - b[i]) / (b[i + 1] - b[i])) / (b.length - 1);
    return 1;
  };
  const shown = (t) => t.value === null ? t.floor : t.value;   // a gauge with no reading rests at its floor, and reads it
  const figure = (v, decimals) => Number(v).toFixed(decimals);
  const tickText = (t) => String(Number(t));
  const lw = (points) => points * 100 / 72;   // a line width in points at the PNG's 100 DPI, in pixels

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  function text(svg, x, y, words, size, colour, anchor = "middle", weight = "normal") {
    const t = el("text", {x: x.toFixed(1), y: y.toFixed(1), "font-size": size, fill: colour, "text-anchor": anchor,
                          "dominant-baseline": "central", "font-weight": weight}, svg);
    t.textContent = words;
    return t;
  }

  function scaleBar(svg, x, y0, y1, tile, ink) {
    const n = tile.colours.length, step = (y1 - y0) / n;
    [...tile.colours].reverse().forEach((colour, i) =>
      el("rect", {x, y: y0 + i * step + 1, width: L.bar_width, height: Math.max(step - 2, 0), fill: ink(colour)}, svg));
    for (const tick of tile.ticks) {
      const y = y0 + (tile.high - tick) / (tile.high - tile.low) * (y1 - y0);
      text(svg, x - 6, y, tickText(tick), 17, ink(L.soft), "end");
    }
  }

  function thermometerPath(cx, top, half, bulbY, radius) {
    const join = bulbY - Math.sqrt(radius ** 2 - half ** 2), capY = top + half;
    return `M${cx - half},${join} L${cx - half},${capY} A${half},${half} 0 0 1 ${cx + half},${capY} ` +
           `L${cx + half},${join} A${radius},${radius} 0 1 1 ${cx - half},${join} Z`;
  }

  function thermometer(svg, tile, ink, id) {
    const top = 95, bottom = 238, cx = 285, bulb = 280, half = L.tube_half, radius = L.bulb_radius, gap = L.mercury_gap;
    scaleBar(svg, cx - half - L.bar_gap - L.bar_width, top, bottom, tile, ink);
    const level = (v) => top + (1 - share(tile, v)) * (bottom - top);
    const clip = el("clipPath", {id}, el("defs", {}, svg));
    const mercury = el("rect", {x: 0, y: level(shown(tile)), width: L.cell[0], height: L.cell[1]}, clip);
    el("path", {d: thermometerPath(cx, top - 10 + gap, half - gap, bulb, radius - gap), fill: ink(L.fill), "clip-path": `url(#${id})`}, svg);
    el("path", {d: thermometerPath(cx, top - 10, half, bulb, radius), fill: "none", stroke: ink(L.soft), "stroke-width": lw(2.5),
                "stroke-linejoin": "round"}, svg);
    const label = text(svg, cx - 50, bulb, "", 40, ink(L.soft), "end");
    label.classList.add("reading");
    return (v) => {   // the gauge at reading v (moved in place, frame by frame)
      mercury.setAttribute("y", level(v).toFixed(2));
      label.textContent = `${figure(v, tile.decimals)} ${tile.unit}`;
    };
  }

  function beaker(svg, tile, ink, id) {
    const top = 90, bottom = 300, left = 235, right = 345, r = 34;
    scaleBar(svg, left - L.bar_gap - L.bar_width, top, bottom - 10, tile, ink);
    const jar = `M${left},${top} L${left},${bottom - r} A${r},${r} 0 0 0 ${left + r},${bottom} L${right - r},${bottom} ` +
                `A${r},${r} 0 0 0 ${right},${bottom - r} L${right},${top}`;
    const level = (v) => v <= tile.low ? bottom + 1 : bottom - Math.max(share(tile, v), 0.02) * (bottom - 10 - top);
    const clip = el("clipPath", {id}, el("defs", {}, svg));
    const water = el("rect", {x: 0, y: level(shown(tile)), width: L.cell[0], height: L.cell[1]}, clip);   // (none at 0 mm)
    el("path", {d: jar + " Z", fill: ink(L.water), "clip-path": `url(#${id})`}, svg);
    el("path", {d: jar, fill: "none", stroke: ink(L.soft), "stroke-width": lw(2.5), "stroke-linejoin": "round"}, svg);
    const label = text(svg, 290, 345, "", 46, ink(L.soft));
    label.classList.add("reading");
    return (v) => {
      water.setAttribute("y", level(v).toFixed(2));
      label.textContent = `${figure(v, tile.decimals)} ${tile.unit}`;
    };
  }

  function dial(svg, tile, ink) {
    const cx = 240, cy = 203, angle = (v) => L.start - L.sweep * share(tile, v);
    el("circle", {cx, cy, r: 138, fill: "none", stroke: ink(L.soft), "stroke-width": lw(3)}, svg);
    const n = tile.colours.length, step = L.sweep / n, outer = L.ring_outer, inner = L.ring_outer - L.band_width;
    tile.colours.forEach((colour, i) => {
      const a0 = L.start - i * step - 0.8, a1 = a0 - step + 1.6;
      const [x0, y0] = polar(cx, cy, outer, a0), [x1, y1] = polar(cx, cy, outer, a1);
      const [x2, y2] = polar(cx, cy, inner, a1), [x3, y3] = polar(cx, cy, inner, a0);
      const big = a0 - a1 > 180 ? 1 : 0;
      el("path", {d: `M${x0},${y0} A${outer},${outer} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${inner},${inner} 0 ${big} 0 ${x3},${y3} Z`,
                  fill: ink(colour)}, svg);
    });
    for (const tick of tile.ticks) {
      const [x, y] = polar(cx, cy, L.label_radius, angle(tick));
      text(svg, x, y, tickText(tick), 17, ink(L.soft));
    }
    text(svg, cx, cy + 64, tile.unit, 18, ink(L.soft));
    const needle = el("polygon", {fill: ink(L.needle)}, svg);
    const label = text(svg, cx, cy + 102, "", 50, ink(L.ink));
    label.classList.add("reading");
    const band = text(svg, cx, cy + L.band_y, "", L.band_size, ink(L.soft));   // the air gauges' category ("Moderate")
    band.classList.add("band");
    el("circle", {cx, cy, r: 25, fill: L.bg, stroke: ink(L.soft), "stroke-width": lw(3)}, svg);
    const at = (v) => {
      const a = angle(v);
      const pts = [polar(cx, cy, outer - L.band_width - 6, a), polar(cx, cy, 10, a + 90), polar(cx, cy, -24, a), polar(cx, cy, 10, a - 90)];
      needle.setAttribute("points", pts.map((p) => p.map((n) => n.toFixed(2)).join(",")).join(" "));
      label.textContent = figure(v, tile.decimals);
    };
    at.band = (t) => { band.textContent = t.band && t.value !== null ? t.band : ""; };   // (no reading: no category)
    at.band(tile);
    return at;
  }

  const DRAW = {thermometer, dial, beaker};

  // ---------- HTML: the title and the table, placed in the tile's own pixels (480 x 575), sized with it ----------
  function place(parent, x, y, w, h, size, words, cls, style) {
    const [W, H] = L.cell;
    const d = document.createElement("div");
    d.className = "at " + (cls || "");
    Object.assign(d.style, {left: `${x / W * 100}%`, top: `${y / H * 100}%`, width: `${w / W * 100}%`, height: `${h / H * 100}%`,
                            fontSize: `${size / W * 100}cqw`}, style || {});
    d.textContent = words;
    parent.appendChild(d);
    return d;
  }

  function table(box, tile, ink) {
    const figures = {};
    const left = 60, top = 378, w = 128, h = 38, gap = 4;
    const xs = tile.columns.map((_, i) => left + (w + gap) * (i + 1));
    place(box, left, top, w, h, 17, tile.unit, "unit", {color: ink(L.ink), fontWeight: 700});
    tile.columns.forEach((name, i) =>
      place(box, xs[i], top, w, h, 19, `${L.marks[name]} ${name}`, "chip head", {background: ink(L.chips[name]), color: ink("#FFFFFF"), fontWeight: 700}));
    L.rows.forEach((name, r) => {
      const y = top + (r + 1) * (h + 10);
      place(box, left, y, w, h, 19, name, "chip row", {background: ink(L.chip), color: ink(L.soft)});
      xs.forEach((x, i) => { figures[`${name}/${i}`] = place(box, x, y, w, h, 21, "", "figure", {color: ink(L.ink), fontWeight: 700}); });
    });
    const fill = (t) => L.rows.forEach((name) => xs.forEach((_, i) => {
      const v = (t.rows[name] || [])[i];
      figures[`${name}/${i}`].textContent = v === null || v === undefined ? (i < (t.rows[name] || []).length ? "-" : "") : figure(v, t.decimals);
    }));
    fill(tile);
    return fill;
  }

  // What can't change in place (a tile so different is drawn again): its kind and scale. A reading coming or going doesn't: the tile
  // brightens or dims (its opacity, eased) and the gauge moves from or to its floor.
  const shape = (t) => JSON.stringify([t.kind, t.title, t.unit, t.low, t.high, t.colours, t.ticks, t.bounds, t.columns, t.decimals]);
  const label = (t) => t.value === null ? `${t.title}: no reading` : `${t.title} ${figure(t.value, t.decimals)} ${t.unit}`.trim();
  let clips = 0;

  function drawTile(tile) {
    const ink = (c) => c;   // (dimmed by the tile's opacity, L.fade over the card: the PNG's blend towards it)
    const box = document.createElement("section");
    box.className = "tile" + (tile.faded ? " faded" : "");
    box.dataset.kind = tile.kind;
    box.setAttribute("aria-label", label(tile));
    const svg = el("svg", {viewBox: `0 0 ${L.cell[0]} ${L.cell[1]}`, preserveAspectRatio: "xMidYMid meet", "aria-hidden": "true"});
    box.appendChild(svg);
    const at = DRAW[tile.kind](svg, tile, ink, `clip${clips++}`);
    place(box, 0, 38 - 25, L.cell[0], 50, 38, tile.title, "title", {color: ink(L.ink)});
    const fill = table(box, tile, ink);
    const drawnTile = {box, shape: shape(tile), value: shown(tile), frame: 0};
    drawnTile.update = (t) => {   // the same gauge at a new reading: the needle, mercury or water moves there, the figures change;
      box.setAttribute("aria-label", label(t));   // a reading come or gone: the tile brightens or dims, the gauge from or to its floor
      box.classList.toggle("faded", !!t.faded);
      fill(t);
      if (at.band) at.band(t);
      move(drawnTile.value, shown(t), MOVE_MS);
    };
    const move = (from, to, ms) => {
      drawnTile.value = to;
      cancelAnimationFrame(drawnTile.frame);
      if (from === to || STILL || document.hidden) return at(to);
      const start = performance.now();
      const step = (now) => {
        const p = Math.min((now - start) / ms, 1), eased = 1 - (1 - p) ** 3;
        at(p < 1 ? from + (to - from) * eased : to);
        if (p < 1) drawnTile.frame = requestAnimationFrame(step);
      };
      drawnTile.frame = requestAnimationFrame(step);
    };
    if (opening) move(tile.floor, shown(tile), RISE_MS);   // the page just opened: every gauge rises from its floor to its reading
    else at(shown(tile));
    return drawnTile;
  }

  // ---------- the layout: the columns that make the tiles largest with all of them on the screen ----------
  function layout() {
    const n = grid.children.length;
    if (!n || !L) return;
    const aspect = L.cell[0] / L.cell[1];
    const W = window.innerWidth - 2 * PAD, H = window.innerHeight - 2 * PAD - STATUS;
    let best = {w: 0, cols: 1};
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols), w = Math.min(W / cols, H / rows * aspect);
      if (w > best.w) best = {w, cols};
    }
    let {w, cols} = best, scroll = false;
    if (w < MIN_TILE) {   // too small to read on one screen: as many columns as fit at a readable size, and the page scrolls
      cols = Math.max(1, Math.min(n, Math.floor(W / MIN_SCROLL_TILE)));
      w = W / cols;
      scroll = true;
    }
    w = Math.max(Math.floor(w), 1);
    document.documentElement.style.setProperty("--pad", PAD + "px");
    document.documentElement.style.setProperty("--status", STATUS + "px");
    grid.style.gridTemplateColumns = `repeat(${cols}, ${w}px)`;
    grid.style.gridAutoRows = `${Math.floor(w / aspect)}px`;
    document.body.dataset.columns = cols;
    document.body.dataset.scroll = scroll ? "yes" : "no";
    document.documentElement.classList.toggle("scroll", scroll);   // (a scrolled page stops with a row at the top)
  }

  // ---------- the data ----------
  function showStatus() {
    statusLine.classList.toggle("lost", lost);
    statusLine.textContent = lost ? "reconnecting…" : asOf ? `updated ${asOf.slice(11, 16)}` : "";
  }

  function render(data) {
    L = data.look;
    document.documentElement.style.setProperty("--fade", L.fade);
    tiles = data.tiles || [];
    asOf = data.as_of && data.as_of.time ? data.as_of.time : null;
    document.body.classList.toggle("unavailable", !tiles.length);
    message.textContent = data.unavailable || "";
    if (drawn.length === tiles.length && tiles.every((t, i) => drawn[i].shape === shape(t))) {
      tiles.forEach((t, i) => drawn[i].update(t));   // the usual case: every gauge moved where it is, nothing redrawn
      return;
    }
    drawn = tiles.map(drawTile);
    grid.replaceChildren(...drawn.map((d) => d.box));
    if (drawn.length) opening = false;   // (only the first drawing rises from 0; a tile drawn again later starts at its reading)
    layout();
  }

  let fetching = null;
  async function refresh() {
    if (fetching) return fetching;
    fetching = (async () => {
      try {
        const response = await fetch(DATA, {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
        lost = false;
      } catch (e) {
        lost = true;
      } finally {
        showStatus();
        fetching = null;
      }
    })();
    return fetching;
  }

  // ---------- the events: a new reading, fetched and drawn in place ----------
  let source = null;
  function listen() {
    if (!window.EventSource) return;
    source = new EventSource(EVENTS);
    source.addEventListener("readings", refresh);
    source.onopen = () => { if (lost) refresh(); };
    source.onerror = () => {
      lost = true;
      showStatus();
      if (source.readyState === EventSource.CLOSED) {   // (refused outright: the browser won't retry by itself)
        source.close();
        setTimeout(listen, 10000);
      }
    };
  }

  let resizing = 0;
  const relayout = () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(layout); };
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", relayout);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  setInterval(refresh, REFETCH_MS);
  refresh();
  listen();
})();
</script>
</body>
</html>
