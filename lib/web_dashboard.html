  // (test-only: n frames now, one after another, each TEST.step (or a 30th of a second) times timeScale on, as the loop would
  // make them, ending as it would once nothing is left; how many were made)
  function advance(n = 1) {
    let made = 0;
    for (; made < n && animate && alive(); made++) step((TEST.step || FRAME_MS / 1000) * scale);
    if (!alive()) wipe();
    return made;
  }

  function start() {
    if (!animate || !alive()) {
      cancelAnimationFrame(frame);
      frame = 0;
      wipe();
      return;
    }
    if (DRIVEN) return;   // (the tests' frames only: Sky.advance)
    if (!frame && !document.hidden) {
      last = performance.now() - FRAME_MS;
      frame = requestAnimationFrame(loop);
    }
  }

  // ---------- tilt: a phone's gravity, which way is downhill (grav) ----------
  // tilt(x, y, z, dt): a reading of gravity's pull in the screen's own terms (m/s²: x to the screen's right, y down it, z out of it:
  // upright, (0, 9.8, 0); the page turns the sensor's reading for the screen's rotation: see the page's own script), dt s since the
  // last (none: at once, as the tests do). Its direction is the in-plane part of the pull, at every angle (low-passed (TAU s), kept
  // straight down within SNAP_DEG of it, changed only by STEP_DEG or more at a time: no jitter). How steep it is, s = sin(theta) =
  // in-plane / total (theta: the screen's normal off vertical: 0 lying face up, 90 upright, 180 face down; the readings' size
  // doesn't matter, only their ratio), is a speed factor, grav.steep (0-1, smoothed, also by TAU): 0 under POOL_IN (5 degrees: the
  // water pools: nothing runs; kept till POOL_OUT, 7 degrees, so a wobbling tablet doesn't flicker), rising smoothly (smoothstep) to 1
  // at STEEP_FULL (40 degrees; the thresholds are on sin(theta), so the ramp's midpoint is at 21.4 degrees, not 22.5), 1 beyond; sin being symmetric about 90, it falls again from 140 degrees to 0 at 180 (face down: flat
  // again). The steepness itself is also kept, smoothed by TAU (the first reading at once), as grav.sin: the humidity's beads run only from the
  // radius r_crit = RUN_R / sqrt(sin) (the pinning: gravity's pull grows with a bead's volume, r^3, the surface tension holding it with
  // its width, r; no sensor: RUN_R). A reading of nothing (all zero) is ignored. Ignored while nothing is drawn (the animations off, low or stopped)
  const POOL_IN = Math.sin(5 * Math.PI / 180), POOL_OUT = Math.sin(7 * Math.PI / 180), STEEP_FULL = Math.sin(40 * Math.PI / 180);
  const TAU = 0.25, SNAP_DEG = 4, STEP_DEG = 1.5, DEG = 180 / Math.PI;
  const smooth = {x: 0, y: 1};
  function tilt(sx, sy, sz = 0, dt = Infinity) {
    if (!animate || ![sx, sy, sz].every(Number.isFinite)) return false;
    const m = Math.hypot(sx, sy), total = Math.hypot(m, sz);
    if (!(total > 1e-6)) return false;
    const steep = Math.min(1, m / total);
    grav.readings++;
    grav.sin = grav.raw === null || dt === Infinity ? steep : grav.sin + (steep - grav.sin) * (1 - Math.exp(-Math.max(dt, 0) / TAU));   // (the pinning's steepness: sin(theta) itself, smoothed, the first reading at once)
    grav.raw = [sx, sy, sz];
    grav.pool = steep < (grav.pool ? POOL_OUT : POOL_IN);
    const t = clamp((steep - POOL_IN) / (STEEP_FULL - POOL_IN), 0, 1), k = dt === Infinity ? 1 : 1 - Math.exp(-Math.max(dt, 0) / TAU);
    grav.steep += ((grav.pool ? 0 : t * t * (3 - 2 * t)) - grav.steep) * k;
    grav.flat = grav.pool || grav.steep < POOLED;
    if (grav.pool) return false;   // (pooling: no downhill; the last kept)
    smooth.x += (sx / m - smooth.x) * k;
    smooth.y += (sy / m - smooth.y) * k;
    const n = Math.hypot(smooth.x, smooth.y);
    let ux = n < 0.05 ? 0 : smooth.x / n, uy = n < 0.05 ? 1 : smooth.y / n;
    if (Math.abs(Math.atan2(ux, uy)) * DEG < SNAP_DEG) { ux = 0; uy = 1; }
    const down = ux === 0 && uy === 1;
    if (down ? (grav.bx === 0 && grav.by === 1) : Math.acos(clamp(ux * grav.bx + uy * grav.by, -1, 1)) * DEG < STEP_DEG) return aim();
    grav.bx = ux; grav.by = uy;
    return aim(true);
  }
  // The direction the beads run: the sensor's gravity (bx, by: a unit vector, straight down with none) plus the wind's push, a vector
  // (push * |gravity|, push = p * dir.f * grav.steep: p, the ratio by the wind's speed, pushOf; dir.f, the wind's side, eased through
  // calm as it turns; the steepness factor: none pooled, less on a gentle slope) along the screen's row, normalized; within SNAP_DEG of
  // straight down, straight down; changed (the epoch counted: the beads' bounds begun afresh) only by STEP_DEG or more, or `force`d.
  // Whether it changed: returned
  function aim(force = false) {
    const push = grav.pool ? 0 : grav.p * dir.f * grav.steep;
    grav.push = push;
    let ux = grav.bx + push, uy = grav.by;
    const n = Math.hypot(ux, uy);
    if (n < 0.05) { ux = grav.bx; uy = grav.by; } else { ux /= n; uy /= n; }
    if (Math.abs(Math.atan2(ux, uy)) * DEG < SNAP_DEG) { ux = 0; uy = 1; }
    const down = ux === 0 && uy === 1;
    if (!force && (down ? (grav.x === 0 && grav.y === 1) : Math.acos(clamp(ux * grav.x + uy * grav.y, -1, 1)) * DEG < STEP_DEG)) return false;
    Object.assign(grav, {x: ux, y: uy, px: uy, py: -ux, tilted: !down, mode: downhill(ux, uy), epoch: grav.epoch + 1});
    return true;
  }
  // The effective wind speed low-passed (gale.felt) and the push it gives (dt s on); called every frame
  function blow(dt) {
    const goal = effectiveSpeed();
    gale.felt = gale.seeded ? gale.felt + (goal - gale.felt) * (1 - Math.exp(-dt / (goal > gale.felt ? TAU_UP : TAU_DOWN))) : goal;
    if (Math.abs(goal - gale.felt) < 0.02) gale.felt = goal;
    gale.seeded = true;
    grav.p = pushOf(gale.felt);
    aim();
  }
  function level() {   // straight down again (the sensor gone, the animations stopped, or the test's)
    smooth.x = 0; smooth.y = 1;
    if (grav.tilted || grav.raw) Object.assign(grav, {x: 0, y: 1, px: 1, py: -0, tilted: false, mode: 0, epoch: grav.epoch + 1, raw: null, flat: true});
    grav.pool = false; grav.steep = 1; grav.sin = 1; grav.bx = 0; grav.by = 1;
    aim();   // (the wind's push alone, if it blows)
  }

  function set(want, on) {
    animate = on;
    if (!on) level();
    if (!W) resize();
    for (const k of ORDER) effects[k].want(want[k] || 0);
    // (stopped: every effect gone at once, and all it had forgotten (anything blown across, the glass's streaks, the frost ...),
    // so each starts afresh once the animations are on again)
    if (!on) for (const k of ORDER) { const fx = effects[k]; fx.forget(); fx.amount = 0; fx.held = false; }
    start();
  }

  let resizing = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizing);
    resizing = setTimeout(() => { resize(); if (!frame) start(); }, 150);
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });

  // Something big blown across far behind (a gust over 99 km/h; `kind`: "cow", "barn" or "chicken", else one at random): its kind,
  // or null when nothing is drawn (the animations stopped or never on, the tab hidden)
  function fling(kind) {
    if (!animate || document.hidden) return null;
    if (!W) resize();
    const sent = effects.gust.fling(kind);
    start();
    return sent;
  }

    label.classList.add("reading");                                // colours say it)

  const ROSE_REACH = 0.8, ROSE_HALF = 9;   // the longest petal's reach (of the radius) and each petal's half-width (degrees)

    el("path", {d: fine, stroke: ink(L.soft), "stroke-width": lw(1), "stroke-opacity": 0.7, "stroke-linecap": "round", class: "ticks"}, face);
    el("path", {d: long, stroke: ink(L.soft), "stroke-width": lw(1.8), "stroke-linecap": "round", class: "ticks long"}, face);
    ["N", "E", "S", "W"].forEach((name, i) => {
      const [x, y] = polar(cx, cy, r - 34, 90 - 90 * i);
      text(face, x, y, name, 22, ink(L.soft), "middle", "600").classList.add("point");
    });
    const needle = el("g", {class: "needle"}, svg);
    el("polygon", {points: points(stub(cx, cy, reach)), fill: ink(L.soft), "fill-opacity": 0.45, class: "tail"}, needle);
    el("polygon", {points: points(blade(cx, cy, reach)), fill: ink(L.high_hand), stroke: L.bg, "stroke-width": 1.2, "paint-order": "stroke",
                   "stroke-linejoin": "miter", class: "head"}, needle);
    el("circle", {cx, cy, r: 6.5, fill: L.bg, stroke: ink(L.high_hand), "stroke-width": 2.5, class: "hub"}, svg);
    // the rose: a petal per compass point with any share, a slim wedge from the centre to its share of the longest's reach
    // each fades in from the hub: fully clear there, rising smoothly (SVG's own anti-aliased gradient, no dither or pattern) to the rose's
    // opacity at the longest petal's reach (the fill's 0.32, the outline's 0.55); one pair of gradients, userSpaceOnUse on the hub, shared
    // by every petal and made again with them (the group emptied: no stale defs)
    const FADE = {fill: 0.32, stroke: 0.55}, id = `rose${++roseIds}`;
    const petals = (shares) => {
      rose.replaceChildren();
      const most = Math.max(0, ...(shares || []));
      if (!(most > 0)) return;
      const defs = el("defs", {}, rose);
      for (const [k, top] of Object.entries(FADE)) {
        const g = el("radialGradient", {id: `${id}-${k}`, gradientUnits: "userSpaceOnUse", cx, cy, r: r * ROSE_REACH, class: `fade ${k}`}, defs);
        [[0, 0], [0.5, 0.35 * top], [1, top]].forEach(([at, o]) =>
          el("stop", {offset: at, "stop-color": ink(L.needle), "stop-opacity": o.toFixed(3)}, g));
      }
      shares.forEach((v, i) => {
        if (!(v > 0)) return;
        const out = r * ROSE_REACH * v / most, b = 22.5 * i;
        const [x0, y0] = polar(cx, cy, out, 90 - b + ROSE_HALF), [x1, y1] = polar(cx, cy, out, 90 - b - ROSE_HALF);
        el("path", {d: `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${out.toFixed(2)},${out.toFixed(2)} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`,
                    fill: `url(#${id}-fill)`, stroke: `url(#${id}-stroke)`, "stroke-width": 1,
                    "stroke-linejoin": "round", class: "petal", "data-point": L.points[i], "data-share": v}, rose);
      });
    };
    petals(tile.rose);
    let now = tile;   // (the tile as last given: its reading and the service's compass point)
    const at = (v) => {
      const deg = ((v % 360) + 360) % 360;
      needle.setAttribute("transform", `rotate(${deg.toFixed(2)} ${cx} ${cy})`);
      label.textContent = now.value === null ? "–" : `${Math.round(deg) % 360}°`;
    };
    let drawnRose = JSON.stringify(tile.rose || []);
    at.band = (t) => {   // (the tile as given again: its reading's compass point, and today's rose, redrawn if it changed)
      now = t;
      const next = JSON.stringify(t.rose || []);
      if (next !== drawnRose) petals(t.rose);
      drawnRose = next;
    };
    at.toward = (from, to) => from + ((((to - from) % 360) + 540) % 360) - 180;   // (the short way round: 350° to 10° through north)
    return at;
  }

  const DRAW = {thermometer, dial, beaker, compass};

  // ---------- HTML: the title and the table, placed in the tile's own pixels (480 x 575), sized with it (by its width: cqw) ----------
  function place(parent, x, y, w, h, size, words, cls, style) {
    const W = L.cell[0], u = (v) => `${v / W * 100}cqw`;
    const d = document.createElement("div");
    d.className = "at " + (cls || "");
    Object.assign(d.style, {left: u(x), top: u(y), width: u(w), height: u(h),
                            fontSize: `${size / W * 100}cqw`}, style || {});
    d.textContent = words;
    parent.appendChild(d);
    return d;
  }

  function table(box, tile, ink) {
    if (!tile.columns.length) return () => {};   // (a gauge with no figures: the compass)
    const figures = {};
    const left = 60, top = 378, w = 128, h = 38, gap = 4;
    const xs = tile.columns.map((_, i) => left + (w + gap) * (i + 1));
    place(box, left, top, w, h, 17, tile.unit, "unit", {color: ink(L.ink), fontWeight: 700});
    const chips = tile.columns.includes("Gust") ? L.wind_chips : L.chips;   // (the Wind's: its Max the needle's colour, its Gust its limit mark's red)
    tile.columns.forEach((name, i) =>
      place(box, xs[i], top, w, h, 19, `${L.marks[name]} ${name}`, "chip head", {background: ink(chips[name]), color: ink("#FFFFFF"), fontWeight: 700}));
    L.rows.forEach((name, r) => {
      const y = top + (r + 1) * (h + 10);
      place(box, left, y, w, h, 19, name, "chip row", {background: ink(L.chip), color: ink(L.soft)});
      xs.forEach((x, i) => { figures[`${name}/${i}`] = place(box, x, y, w, h, 21, "", "figure", {color: ink(L.ink), fontWeight: 700}); });
    });
    const fill = (t) => L.rows.forEach((name) => xs.forEach((_, i) => {
      const v = (t.rows[name] || [])[i];
      figures[`${name}/${i}`].textContent = v === null || v === undefined ? (i < (t.rows[name] || []).length ? "-" : "") : figure(v, t.decimals);
    }));
    fill(tile);
    return fill;
  }

  // What can't change in place (a tile so different is drawn again): its kind and scale. A reading coming or going doesn't: the tile
  // brightens or dims (its opacity, eased) and the gauge moves from or to its floor.
  const shape = (t) => JSON.stringify([t.kind, t.title, t.unit, t.low, t.high, t.colours, t.ticks, t.bounds, t.columns, t.decimals,
                                       t.todayHigh !== undefined, t.tendency !== undefined]);
  const label = (t) => t.value === null ? `${t.title}: no reading` : t.kind === "compass" ? `${t.title} ${figure(t.value, t.decimals)}° ${t.band || ""}`.trim()
                                                                     : `${t.title} ${figure(t.value, t.decimals)} ${t.unit}`.trim();
  let clips = 0;

  // (`from`: a tile drawn again in other units, {value, high} where its gauge and red hand were, in the new units: eased on from there)
  function drawTile(tile, from) {
    const ink = (c) => c;   // (dimmed by the tile's opacity, L.fade over the card: the PNG's blend towards it)
    const box = document.createElement("section");
    box.className = "tile" + (tile.faded ? " faded" : "");
    box.dataset.kind = tile.kind;
    box.dataset.id = idOf(tile);
    box.setAttribute("aria-label", label(tile));
    box.tabIndex = 0;   // (focused, Enter or Space zooms it)
    const svg = el("svg", {viewBox: `0 0 ${L.cell[0]} ${L.cell[1]}`, preserveAspectRatio: "xMidYMid meet", "aria-hidden": "true"});
    svg.style.height = `${L.cell[1] / L.cell[0] * 100}cqw`;   // (by the width: zoomed, the tile's box is only its top)
    box.appendChild(svg);
    const gauge = el("g", {class: "gauge", transform: `translate(0 ${DROP})`}, svg);   // (the gauge, a little below the title: room)
    const at = DRAW[tile.kind](gauge, tile, ink, `clip${clips++}`);
    place(box, 0, 38 - 25, L.cell[0], 50, 38, tile.title, "title", {color: ink(L.ink)});
    if (tile.columns.length) place(box, 0, TABLE_TOP, L.cell[0], L.cell[1] - TABLE_TOP, 0, "", "tablearea");   // (the table's area, under
                                                                                                              // its chips: its cursor)
    const fill = table(box, tile, ink);
    const grip = document.createElement("div");   // (the whole gauge drags; the grip is the cue)
    grip.className = "grip";
    const close = document.createElement("button");
    Object.assign(close, {className: "close", type: "button", textContent: "×", title: "Hide"});
    close.setAttribute("aria-label", `Hide ${tile.title}`);
    close.addEventListener("click", () => hide(idOf(tile), close.matches(":focus-visible")));
    box.append(grip, close);
    const drawnTile = {box, tile, shape: shape(tile), value: shown(tile), frame: 0, high: tile.todayHigh ?? null, highFrame: 0};
    drawnTile.update = (t) => {   // the same gauge at a new reading: the needle, mercury or water moves there, the figures change;
      drawnTile.tile = t;
      box.setAttribute("aria-label", label(t));   // a reading come or gone: the tile brightens or dims, the gauge from or to its floor
      box.classList.toggle("faded", !!t.faded);
      fill(t);
      if (at.band) at.band(t);
      move(drawnTile.value, aim(drawnTile.value, shown(t)), MOVE_MS);
      if (at.hand) moveHand(drawnTile.high, t.todayHigh ?? null, MOVE_MS);
    };
    const aim = (from, to) => at.toward ? at.toward(from, to) : to;   // (a compass's needle: the short way round)
    const move = (from, to, ms) => {
      drawnTile.value = to;
      cancelAnimationFrame(drawnTile.frame);
      if (from === to || !MOVING || document.hidden) return at(to);
      const start = performance.now();
      const step = (now) => {
        const p = Math.min(Math.max((now - start) / ms, 0), 1), eased = 1 - (1 - p) ** 3;   // (a frame stamped before the start: 0)
        at(p < 1 ? from + (to - from) * eased : to);
        if (p < 1) drawnTile.frame = requestAnimationFrame(step);
      };
      drawnTile.frame = requestAnimationFrame(step);
    };
    // The red hand on its own clock (its value changes apart from the needle's): eased there, or put there at once with no motion,
    // a hidden page, or coming or going (null)
    const moveHand = (from, to, ms) => {
      drawnTile.high = to;
      cancelAnimationFrame(drawnTile.highFrame);
      if (from === to || from === null || to === null || !MOVING || document.hidden) return at.hand(to);
      const start = performance.now();
      const step = (now) => {
        const p = Math.min(Math.max((now - start) / ms, 0), 1), eased = 1 - (1 - p) ** 3;
        at.hand(p < 1 ? from + (to - from) * eased : to);
        if (p < 1) drawnTile.highFrame = requestAnimationFrame(step);
      };
      drawnTile.highFrame = requestAnimationFrame(step);
    };
    if (opening) move(tile.floor, aim(tile.floor, shown(tile)), RISE_MS);   // the page just opened: every gauge rises from its floor to its reading
    else if (from) { at(from.value); move(from.value, aim(from.value, shown(tile)), MOVE_MS); }   // (other units: on from where it was)
    else at(shown(tile));
    if (at.hand) {   // (its hand with it)
      const was = from && from.high !== null && tile.todayHigh !== null ? from.high : null;
      at.hand(tile.todayHigh === null ? null : opening ? tile.floor : was ?? tile.todayHigh);
      if (opening) moveHand(tile.floor, tile.todayHigh, RISE_MS);
      else if (was !== null) { drawnTile.high = was; moveHand(was, tile.todayHigh, MOVE_MS); }
    }
    return drawnTile;
  }

  // ---------- the layout: the columns that make the tiles largest with all of them on the screen ----------
  // The visible tiles as large as fits (fewer visible: larger, a single one filling the window), never smaller than every tile of the
  // data would be: where those scroll (a phone), fewer scroll at that size too rather than shrink to fit.
  function columns(n, W, H, aspect) {
    let best = {w: 0, cols: 1, scroll: false};
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols), w = Math.min(W / cols, H / rows * aspect);
      if (w > best.w) best = {w, cols, scroll: false};
    }
    if (best.w < MIN_TILE) {   // too small to read on one screen: as many columns as fit at a readable size, and the page scrolls
      const cols = Math.max(1, Math.min(n, Math.floor(W / MIN_SCROLL_TILE)));
      best = {w: W / cols, cols, scroll: true};
    }
    return best;
  }

  function layout() {
    const n = grid.children.length;
    if (!n || !L) return;
    const aspect = L.cell[0] / L.cell[1];
    const W = screenRoom().w - 2 * PAD, H = screenRoom().h - 2 * PAD - STATUS;
    let fit = columns(n, W, H, aspect);
    const all = columns(Math.max(tiles.length, n), W, H, aspect);
    if (fit.w < all.w) fit = all;   // (only where every tile scrolls: then these do too, at that size)
    const w = Math.max(Math.floor(fit.w), 1), {cols, scroll} = fit;
    document.documentElement.style.setProperty("--pad", PAD + "px");
    document.documentElement.style.setProperty("--status", STATUS + "px");
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, ${w}px))`;
    grid.style.gridAutoRows = `${Math.floor(w / aspect)}px`;
    document.body.dataset.columns = cols;
    document.body.dataset.scroll = scroll ? "yes" : "no";
    document.documentElement.classList.toggle("scroll", scroll);   // (a scrolled page stops with a row at the top)
    if (zoom) galleryLayout();
  }

  // ---------- the preferences: the tiles' order and the hidden ones, kept in the browser ----------
  // localStorage under one versioned key; missing, unreadable or blocked (a private window, storage off): the defaults, nothing saved.
  // Keys this stage doesn't know (a later stage's) are kept as they are.
  // A tile's earlier ids (titles it had before) are read as its id now, so a tile saved moved or hidden stays as it was left.
  const idOf = (t) => t.id || t.title;   // a tile's stable id: its title (unique on the dashboard)
  const RENAMED = new Map([["US AQI", "AQI"]]);   // earlier id: id now
  const blank = () => ({order: [], hidden: []});
  const prefs = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(PREFS_KEY));
      if (saved && typeof saved === "object" && !Array.isArray(saved)) {
        const ids = (list) => Array.isArray(list)
          ? [...new Set(list.filter((id) => typeof id === "string").map((id) => RENAMED.get(id) || id))] : [];
        return {...saved, order: ids(saved.order), hidden: ids(saved.hidden)};
      }
    } catch (e) { /* unreadable or blocked: the defaults */ }
    return blank();
  })();
  function save() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { /* blocked or full: not saved */ }
  }

  // Every id in its order: the saved order (with the ids of tiles absent just now, so they come back where they were), and each tile
  // new to it in its usual place: just after the tile before it in the default order (first, if none is).
  function ordered() {
    const out = [...prefs.order];
    let before = null;
    for (const id of tiles.map(idOf)) {
      if (!out.includes(id)) out.splice(before === null ? 0 : out.indexOf(before) + 1, 0, id);
      before = id;
    }
    return out;
  }
  function visibleIds() {
    const present = new Set(tiles.map(idOf));
    return ordered().filter((id) => present.has(id) && !prefs.hidden.includes(id));
  }

  // The tile `id` moved to place `to` among the visible ones (the hidden keep their places among the rest)
  function moveTile(id, to) {
    const visible = visibleIds(), from = visible.indexOf(id);
    if (from < 0 || from === to) return;
    const order = ordered().filter((x) => x !== id);
    order.splice(order.indexOf(visible[to]) + (to > from ? 1 : 0), 0, id);
    prefs.order = order;
    save();
    arrange();
  }

  function hideTile(id) {
    if (!prefs.hidden.includes(id)) prefs.hidden.push(id);
    save();
    arrange();
    showStatus();
  }
  // The × (`keyboard`: pressed from the keyboard, so the focus goes on to the next tile's ×, or the previous one's if it was the last,
  // or the reset link if none is left, rather than dropping to the page's start)
  function hide(id, keyboard) {
    const visible = visibleIds(), at = visible.indexOf(id);
    reflow(() => hideTile(id));
    if (!keyboard) return;
    const next = visible[at + 1] !== undefined ? visible[at + 1] : visible[at - 1];
    const d = next !== undefined && drawn.get(next);
    const target = d ? d.box.querySelector(".close") : resetBar.querySelector(".reset");
    if (target) target.focus();
  }

  // What "reset preferences" puts back: every tile shown, in the default order, the units metric (and whatever a later stage keeps)
  const resettable = () => prefs.hidden.length > 0 || Object.keys(UNITS).some((k) => unitOf(k) !== UNITS[k].metric);
  function reset() {
    Object.keys(prefs).forEach((k) => delete prefs[k]);
    Object.assign(prefs, blank());
    try { localStorage.removeItem(PREFS_KEY); } catch (e) { /* blocked: nothing was saved */ }
    tiles = raw.map(inUnits);
    reflow(() => arrange(true));
    showUnits();
    weather();
    showStatus();
  }

  // ---------- the units: the temperatures in °C or °F, the wind in km/h or mph, the pressure in hPa or inHg, the rain in mm or in (its
  // rate in mm/h or in/h with it), each browser its own (prefs.temperature, prefs.wind, prefs.pressure, prefs.rain: kept only when not
  // metric). The server sends metric; a tile in °C, km/h, hPa, mm or mm/h is converted here, its reading, scale, ticks, figures, unit
  // and red hand, with the same decimals (inHg and inches with two). Its scale's ends converted (a thermometer's 0 to 40 °C: 32 to 104
  // °F, its coloured bands as they were), its ticks every round step (0.5, 1, 2, 5, 10 ...) that gives no more of them than it had; a
  // dial's (the wind's 0 to 100 km/h), and a scale `round` (the rain's beaker), ending on its ticks (0 to 60 mph, every 10; 950 to 1050
  // hPa: 28 to 31 inHg, every 0.5; 0 to 100 mm: 0 to 4 in, every 1; 0 to 50 mm/h: 0 to 2 in/h, every 0.5). The pressure's arrow (its
  // 3-hour tendency, told in hPa) as it was: the same way in either, just after the reading whatever its width. The weather's marks (heat from 35 °C, leaves from 15 km/h, flood above 30
  // mm/h) read the server's own figures: unchanged by these.
  const UNITS = {temperature: {metric: "°C", other: "°F", name: "Temperature unit", convert: (c) => c * 9 / 5 + 32},
                 wind: {metric: "km/h", other: "mph", name: "Wind speed unit", convert: (k) => k / 1.609344},
                 pressure: {metric: "hPa", other: "inHg", name: "Pressure unit", convert: (h) => h / 33.8639, decimals: 2, round: true},
                 rain: {metric: "mm", other: "in", name: "Rain unit", convert: (m) => m / 25.4, decimals: 2, round: true,
                        also: {"mm/h": "in/h"}}};   // (the rain rate's with the rain's)
  const unitOf = (key) => prefs[key] === UNITS[key].other ? UNITS[key].other : UNITS[key].metric;
  const STEPS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  function inUnits(t) {
    const key = Object.keys(UNITS).find((k) => UNITS[k].metric === t.unit || t.unit in (UNITS[k].also || {}));
    if (!key || unitOf(key) === UNITS[key].metric) return t;
    const u = UNITS[key], conv = u.convert, c = (v) => typeof v === "number" ? conv(v) : v;
    const dial = t.kind === "dial", most = t.ticks.length + (dial ? 1 : 0);
    let low = conv(t.low), high = conv(t.high);
    const step = STEPS.find((s) => Math.floor((high - low) / s + 1e-9) + 1 <= most) || STEPS[STEPS.length - 1];
    if (dial || u.round) { low = Math.floor(low / step + 1e-9) * step; high = Math.max(low + step, Math.round(high / step) * step); }
    low = Math.round(low * 1e6) / 1e6; high = Math.round(high * 1e6) / 1e6;
    const ticks = [];
    for (let i = Math.ceil(low / step - 1e-9); i * step <= high + 1e-9; i++) ticks.push(Math.round(i * step * 1e6) / 1e6);
    if (t.ticks.length > 1 && t.ticks[0] > t.ticks[t.ticks.length - 1]) ticks.reverse();   // (a thermometer's: high to low)
    const rows = Object.fromEntries(Object.entries(t.rows || {}).map(([name, figures]) => [name, figures.map(c)]));
    return {...t, unit: t.unit === u.metric ? u.other : u.also[t.unit], value: c(t.value), floor: t.floor === t.low ? low : c(t.floor),
            low, high, ticks, rows, decimals: u.decimals ?? t.decimals, ...("todayHigh" in t ? {todayHigh: c(t.todayHigh)} : {})};
  }
  // A unit chosen: saved, every tile it changes drawn again in it, its gauge (and red hand) eased on from where it was
  function setUnit(key, unit) {
    if (unitOf(key) === unit) return;
    if (unit === UNITS[key].metric) delete prefs[key];
    else prefs[key] = unit;
    save();
    tiles = raw.map(inUnits);
    if (press && press.engaged) press.rearrange = true;
    else arrange(true);
    showUnits();
    showStatus();
  }
  // The switches, made once (the keyboard's focus stays on them): a group each, its two units buttons, the one in use pressed
  const switches = Object.entries(UNITS).map(([key, u]) => {
    const group = Object.assign(document.createElement("span"), {className: `switch ${key}`});
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", u.name);
    for (const unit of [u.metric, u.other]) {
      const b = Object.assign(document.createElement("button"), {type: "button", textContent: unit});
      b.dataset.unit = unit;
      b.addEventListener("click", () => setUnit(key, unit));
      group.appendChild(b);
    }
    return [key, group];
  });
  units.replaceChildren(...switches.map(([, g]) => g));
  function showUnits() {
    for (const [key, group] of switches)
      for (const b of group.children) b.setAttribute("aria-pressed", String(b.dataset.unit === unitOf(key)));
  }
  showUnits();

  // The tile for this data, drawn (again if its shape changed; `ease`: its units changed, its gauge eased on from where it was, the
  // new box standing in for the old in a reflow)
  function tileFor(t, ease) {
    let d = drawn.get(idOf(t));
    if (!d || d.shape !== shape(t)) {
      const was = ease && d;
      d = drawTile(t, was ? carried(was, t) : undefined);
      if (was) d.box._was = was.box;
      drawn.set(idOf(t), d);
    }
    return d;
  }
  // Where a drawn tile's gauge and red hand are, as readings of the tile `t` (the same place on its scale)
  function carried(was, t) {
    const at = (v) => v === null ? null : t.bounds.length ? shown(t) : t.low + share(was.tile, v) * (t.high - t.low);
    return {value: at(was.value), high: at(was.high)};
  }

  // The visible tiles on the page in their order (moved, not drawn again), and laid out
  function arrange(ease) {
    const byId = new Map(tiles.map((t) => [idOf(t), t]));
    const boxes = visibleIds().map((id) => tileFor(byId.get(id), ease === true).box);
    if (boxes.length !== grid.children.length || boxes.some((b, i) => grid.children[i] !== b)) {
      const focused = grid.contains(document.activeElement) && document.activeElement;
      grid.replaceChildren(...boxes);   // (moving a node drops its focus: put back, if it's still here)
      if (focused && grid.contains(focused)) focused.focus({preventScroll: true});
    }
    if (drawn.size) opening = false;   // (only the first drawing rises from 0; a tile drawn later starts at its reading)
    if (zoom && !boxes.length) zoomOut(false);   // (every tile gone from the readings: nothing to show)
    document.body.classList.toggle("unavailable", !boxes.length);
    message.textContent = tiles.length ? "Every gauge is hidden." : unavailable;
    layout();
  }

  // A change to the tiles' places (`change`), animated: each tile glides (transform only) from where it was to where it lands, and
  // one newly shown grows in. The tiles are measured once before and once after.
  function reflow(change) {
    if (!MOVING || zoom) return change();   // (zoomed: the gallery keeps the tile shown in place)
    const before = new Map([...grid.children].map((b) => [b, b.getBoundingClientRect()]));
    change();
    const boxes = [...grid.children];
    for (const b of boxes) {
      const was = before.get(b) || before.get(b._was), now = b.getBoundingClientRect();
      delete b._was;
      b.style.transition = "none";
      if (!was) b.style.transform = "translate(4%, 4%) scale(0.92)";
      else if (Math.abs(was.left - now.left) + Math.abs(was.top - now.top) + Math.abs(was.width - now.width) > 0.5)
        b.style.transform = `translate(${was.left - now.left}px, ${was.top - now.top}px) scale(${was.width / now.width})`;
    }
    void grid.offsetWidth;   // (the starting places applied, then eased away)
    for (const b of boxes) { b.style.transition = ""; b.style.transform = ""; }
  }

  // ---------- the data ----------
  // The bottom strip, at the bottom right: its link (only while it does something), then the time of the reading at the far right; and
  // at the bottom left, "stop" while an effect is called for
  function link(words, action, name, title, label) {
    const a = document.createElement("button");
    Object.assign(a, {type: "button", className: `link ${name}`, textContent: words});
    if (title) a.title = title;
    if (label) a.setAttribute("aria-label", label);
    a.addEventListener("click", action);
    return a;
  }
  // The time: "last reading HH:MM" (as_of, the newer of the devices' readings). A device's reading more than STALE_MS old while
  // another's is fresh: its name and own time first, greyed out, then the fresh one's ("air sensor 08:12 · last reading 10:42"),
  // till it reports again; none fresh (or the only device's stale): the whole time greyed out. Shown again as each turns stale, data
  // or not (a stalled device sends nothing). A device not configured isn't in `devices`, so never named.
  const STALE_MS = 3600e3, DEVICES = {station: "weather station", air: "air sensor"};
  let staleTimer = 0;
  function stale(at, now) { return !at || !(now - Date.parse(at) <= STALE_MS); }
  function readingTime() {
    clearTimeout(staleTimer);
    if (lost) return "reconnecting…";
    const now = Date.now(), all = Object.entries(devices).filter(([d]) => d in DEVICES);
    const old = all.filter(([, at]) => stale(at, now)), fresh = all.filter(([, at]) => !stale(at, now));
    const turns = Math.min(...fresh.map(([, at]) => Date.parse(at) + STALE_MS - now));
    if (turns < Infinity) staleTimer = setTimeout(showStatus, Math.max(0, turns) + 50);
    const grey = (text) => Object.assign(document.createElement("span"), {className: "stale", textContent: text});
    if (!old.length) return asOf ? `last reading ${asOf.slice(11, 16)}` : "";
    if (!fresh.length) return asOf ? grey(`last reading ${asOf.slice(11, 16)}`) : "";
    const newest = fresh.map(([, at]) => at).sort((a, b) => Date.parse(b) - Date.parse(a))[0];
    return [...old.map(([d, at]) => grey(`${DEVICES[d]} ${at ? at.slice(11, 16) : "no reading"}`)), `last reading ${newest.slice(11, 16)}`];
  }
  function showStatus() {
    statusLine.classList.toggle("lost", lost);
    const had = resetBar.firstChild;
    if (!resettable()) resetBar.replaceChildren();
    else if (!had) resetBar.replaceChildren(link("reset preferences", reset, "reset"));
    const parts = [...[readingTime()].flat().filter(Boolean)];
    statusLine.replaceChildren(...parts.flatMap((p, i) => i ? [" · ", p] : [p]));
    motion.replaceChildren(...animated() && calling() ? [link("stop", stopAnimations, "animations", STOP_TITLE, STOP_LABEL)] : []);
    placeCorner();
  }
  // The bottom left corner beside the strip, in the room it leaves; where that's too little for the corner at its narrowest (a phone),
  // just above the strip instead, across the window
  // The units' switches too: beside the strip, on its left, where both fit across the window; else just above it, at the right (and
  // the corner then beside them, if it fits there, else above them)
  // "reset preferences" (its own piece, left of the switches): on their row where it fits (the switches stay where they are, the bar
  // grows leftwards), else on its own line just above that row, at the right
  function placeCorner() {
    const W = screenRoom().w, strip = statusLine.offsetWidth, h = statusLine.offsetHeight;
    units.style.right = "0";
    const unitsW = units.offsetWidth, beside = strip + unitsW <= W, resetW = resetBar.firstChild ? resetBar.offsetWidth : 0;
    document.body.dataset.units = beside ? "beside" : "above";
    Object.assign(units.style, {right: beside ? `${strip}px` : "0", bottom: beside ? "0" : `${h}px`});
    const used = beside ? strip + unitsW : unitsW, inRow = resetW > 0 && used + resetW <= W;
    document.body.dataset.reset = !resetW ? "" : inRow ? "row" : "above";
    const rows = [beside ? used : strip, ...beside ? [] : [unitsW]];   // what each row of the bar holds, from the bottom
    if (resetW) {
      if (inRow) rows[beside ? 0 : 1] += resetW;
      else rows.push(resetW);
      const at = inRow ? (beside ? 0 : 1) : rows.length - 1;
      Object.assign(resetBar.style, {right: inRow ? `${used}px` : "0", bottom: `${at * h}px`});
    }
    corner.style.width = "min-content";
    corner.style.maxWidth = "";   // (its last row's room mustn't clamp what it measures)
    const need = corner.offsetWidth;
    corner.style.width = "";
    let row = rows.findIndex((w) => need <= W - w - 8);
    const most = row < 0 ? "100vw" : `${W - rows[row] - 8}px`;
    if (row < 0) row = rows.length;
    corner.style.bottom = `${row * h}px`;
    corner.style.maxWidth = most;
  }
  window.addEventListener("resize", placeCorner);
  new ResizeObserver(placeCorner).observe(statusLine);   // (the strip's text, its font, its height)

  function render(data) {
    L = data.look;
    document.documentElement.style.setProperty("--fade", L.fade);
    raw = data.tiles || [];   // (as the server sends them: metric; the weather's marks read these)
    const highs = data.today_highs || {};   // (the dials with a limit mark: today's highest, null with none; none shown while it's 0)
    for (const t of raw) if (t.title in highs) t.todayHigh = highs[t.title] > 0 ? highs[t.title] : null;
    tiles = raw.map(inUnits);   // (in this browser's units)
    asOf = data.as_of && data.as_of.time ? data.as_of.time : null;
    devices = data.devices || {};
    unavailable = data.unavailable || "";
    const present = new Set(tiles.map(idOf));
    for (const id of [...drawn.keys()]) if (!present.has(id)) drawn.delete(id);
    for (const t of tiles) {   // the usual case: every gauge moved where it is, nothing redrawn
      const d = drawn.get(idOf(t));
      if (d && d.shape === shape(t)) d.update(t);
    }
    if (press && press.engaged) press.rearrange = true;   // (mid-drag: the page's tiles stay put until it's dropped)
    else arrange();
    real = conditionsOf(data);
    realSide = windSideOf(data) || realSide;   // (a reading due north or south, or none: the way it was)
    const speedNow = conditionsOfWind(data); realSpeed = speedNow.speed; realGust = speedNow.gust;
    realRate = typeof data.rain_rate === "number" ? data.rain_rate : 0;
    realPm25 = typeof data.pm25 === "number" && Number.isFinite(data.pm25) ? data.pm25 : null;
    Sky.setSun(data.sun);   // (the beams lean with the station's time of day)
    weather();
    gusting(data);
  }

  // The data fetched and drawn now
  let fetching = null;
  async function refresh() {
    if (fetching) return fetching;
    fetching = (async () => {
      try {
        const response = await fetch(DATA, {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
        lost = false;
      } catch (e) {
        lost = true;
      } finally {
        showStatus();
        fetching = null;
      }
    })();
    return fetching;
  }

  // ---------- dragging: a tile picked up and moved to a new place, or dropped on the remove zone (Pointer Events: mouse, pen, touch) ----
  // A mouse or pen press on the gauge (not its title, reading or table, which keep their text selectable) becomes a drag once it moves;
  // a touch held still for LONG_PRESS_MS picks the tile up (moving first scrolls; a short tap is left alone, as is every click but the
  // one ending a drag). While a tile is up the others make room (transform only) and the remove zone shows at the top.
  // The press under way: {box, id, pointerId, touch, x0, y0, x, y, scroll0, engaged, moved, from, to, slots, maxScroll, over}
  let press = null;
  let swallowUntil = 0, autoscroll = 0;
  const pagePoint = () => [press.x + window.scrollX, press.y + window.scrollY];

  function draggable(e, box) {
    if (e.target.closest(".close, .title, .unit, .chip, .figure")) return false;
    const r = box.getBoundingClientRect();
    if ((e.clientY - r.top) / r.width * L.cell[0] >= TABLE_TOP && box.querySelector(".tablearea")) return false;   // (the table, gaps
                                                                                                                  // between its chips too)
    const reading = box.querySelector("svg text.reading");
    const t = reading && reading.getBoundingClientRect();
    return !(t && t.width && e.clientX >= t.left - 2 && e.clientX <= t.right + 2 && e.clientY >= t.top - 2 && e.clientY <= t.bottom + 2);
  }

  function disarm(except) {
    for (const b of grid.querySelectorAll(".tile.armed")) if (b !== except) b.classList.remove("armed");
  }

  grid.addEventListener("pointerdown", (e) => {
    const box = e.target.closest(".tile");
    disarm(e.target.closest(".close") ? box : null);
    if (zoom) return pageDown(e);   // (zoomed: a drag pages through the tiles instead)
    if (press || !e.isPrimary || (e.pointerType !== "touch" && e.button !== 0) || !box || !draggable(e, box)) return;
    press = {box, id: box.dataset.id, pointerId: e.pointerId, touch: e.pointerType === "touch", x0: e.clientX, y0: e.clientY,
             x: e.clientX, y: e.clientY, scroll0: [window.scrollX, window.scrollY], engaged: false, moved: false};
    if (press.touch) press.timer = setTimeout(engage, LONG_PRESS_MS);
  });

  window.addEventListener("pointermove", (e) => {
    if (pager && e.pointerId === pager.pointerId) return pageMove(e);
    if (!press || e.pointerId !== press.pointerId) return;
    press.x = e.clientX;
    press.y = e.clientY;
    const far = Math.hypot(press.x - press.x0, press.y - press.y0);
    if (!press.engaged) {
      if (press.touch && far > TOUCH_SLOP) release();   // (a swipe: the page scrolls)
      else if (!press.touch && far > MOUSE_SLOP) engage();
      return;
    }
    if (far > TOUCH_SLOP) press.moved = true;
    dragTo();
  });
  window.addEventListener("pointerup", (e) => {
    if (pager && e.pointerId === pager.pointerId) pageUp(e);
    else if (press && e.pointerId === press.pointerId) press.engaged ? drop() : release();
  });
  window.addEventListener("pointercancel", (e) => {
    if (pager && e.pointerId === pager.pointerId) pageUp(e);
    else if (press && e.pointerId === press.pointerId) press.engaged ? drop(true) : release();
  });
  window.addEventListener("blur", () => {
    if (pager) pageUp(null);
    if (press) press.engaged ? drop(true) : release();
  });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape" && press && press.engaged) drop(true); });
  // A touch that has picked a tile up doesn't scroll the page (touch-action stays as it was, so an ordinary swipe still scrolls),
  // nor opens the long press's menu
  grid.addEventListener("touchmove", (e) => { if (press && press.engaged) e.preventDefault(); }, {passive: false});
  grid.addEventListener("contextmenu", (e) => { if (press && press.touch) e.preventDefault(); });
  // The click that ends a drag isn't a click on the tile
  // (a browser may send none: a press after the drop, which starts any click of its own, ends the wait, so that click is left alone)
  window.addEventListener("click", (e) => {
    if (performance.now() < swallowUntil) { e.stopPropagation(); e.preventDefault(); swallowUntil = 0; }
  }, true);
  window.addEventListener("pointerdown", (e) => { swallowUntil = 0; lastDown = {x: e.clientX, y: e.clientY, t: e.timeStamp, touch: e.pointerType === "touch"}; }, true);

  function release() {   // a press that never became a drag: nothing done
    clearTimeout(press.timer);
    press = null;
  }

  function engage() {
    const {box} = press;
    press.engaged = true;
    clearTimeout(press.timer);
    const boxes = [...grid.children];
    press.boxes = boxes;
    press.slots = boxes.map((b) => {   // each place, in page pixels (as the tiles sit now, unmoved)
      const r = b.getBoundingClientRect();
      return {left: r.left + window.scrollX, top: r.top + window.scrollY, width: r.width, height: r.height};
    });
    press.from = press.to = boxes.indexOf(box);
    press.maxScroll = document.documentElement.scrollHeight - window.innerHeight;   // (the lifted tile can stretch the page: not past this)
    box.classList.add("lifted");
    if (press.touch) {
      box.classList.add("armed");
      if (navigator.vibrate) try { navigator.vibrate(BUZZ_MS); } catch (e) { /* not allowed: no buzz */ }
    }
    try { box.setPointerCapture(press.pointerId); } catch (e) { /* (the pointer already gone) */ }
    document.body.classList.add("dragging");
    removeZone.classList.add("on");
    autoscroll = requestAnimationFrame(scrollNearEdges);
    dragTo();
  }

  // The tile under the pointer, the others making room, the remove zone lit when it's over it
  function dragTo() {
    const {box, slots, from} = press, slot = slots[from];
    const [px, py] = pagePoint();
    const dx = px - (press.x0 + press.scroll0[0]), dy = py - (press.y0 + press.scroll0[1]);
    box.style.transform = `translate(${dx - slot.width * (LIFT - 1) / 2}px, ${dy - slot.height * (LIFT - 1) / 2}px) scale(${LIFT})`;
    press.over = press.y <= removeZone.offsetHeight;
    removeZone.classList.toggle("over", press.over);
    box.classList.toggle("doomed", press.over);
    if (press.over) return;
    let to = slots.findIndex((s) => px >= s.left && px < s.left + s.width && py >= s.top && py < s.top + s.height);
    if (to < 0) {   // (between or beyond the tiles: the nearest place)
      const d = slots.map((s) => Math.hypot(px - s.left - s.width / 2, py - s.top - s.height / 2));
      to = d.indexOf(Math.min(...d));
    }
    if (to === press.to) return;
    press.to = to;
    const order = slots.map((_, i) => i).filter((i) => i !== from);
    order.splice(to, 0, from);
    order.forEach((was, now) => {
      if (was === from) return;
      const a = slots[was], b = slots[now];
      press.boxes[was].style.transform = now === was ? "" : `translate(${b.left - a.left}px, ${b.top - a.top}px)`;
    });
  }

  function scrollNearEdges() {   // (only a page that scrolls: a phone's)
    if (!press || !press.engaged) return;
    if (document.documentElement.classList.contains("scroll")) {
      const top = removeZone.offsetHeight;
      let by = press.y > window.innerHeight - EDGE ? EDGE_SPEED : press.y > top && press.y < top + EDGE ? -EDGE_SPEED : 0;
      by = Math.max(-window.scrollY, Math.min(by, press.maxScroll - window.scrollY));   // (only within the page as it was)
      if (by) {
        const was = window.scrollY;
        window.scrollBy(0, by);
        if (window.scrollY !== was) dragTo();
      }
    }
    autoscroll = requestAnimationFrame(scrollNearEdges);
  }

  // Let go: on the remove zone, the tile hidden; elsewhere, moved to the place it's over; cancelled (Esc, the pointer lost): put back
  function drop(cancelled = false) {
    const {box, id, from, to, over, touch, moved, boxes} = press;
    cancelAnimationFrame(autoscroll);
    swallowUntil = performance.now() + 400;
    document.body.classList.remove("dragging");
    removeZone.classList.remove("on", "over");
    box.classList.remove("lifted", "doomed");
    if (!touch || moved || cancelled) box.classList.remove("armed");   // (a long press let go in place keeps its grip and × showing)
    const rearrange = press.rearrange;
    press = null;
    reflow(() => {
      for (const b of boxes) { b.style.transition = "none"; b.style.transform = ""; }
      if (cancelled) { if (rearrange) arrange(); }
      else if (over) hideTile(id);
      else if (to !== from) moveTile(id, to);
      else if (rearrange) arrange();
    });
    for (const b of boxes) b.style.transition = "";   // (one hidden, out of the page: ready for when it's back)
  }

  // ---------- the zoomed view: one tile filling the window, and a gallery through the others ----------
  // A click or tap on a tile's gauge (not its text) zooms its title and gauge (its table hidden) to fill the window; a click or tap
  // without moving (with a mouse, not on the text) or Esc goes back. Both are a FLIP: the tiles laid out where they end, then each eased by its transform from where
  // it was (the tile shown grows from, or shrinks to, its place; the others fade out where they were, or in where they are).
  // Zoomed, the visible tiles stand side by side in #grid, one window-width apart, and #grid slides sideways (its transform only) to
  // page through them, in the saved order, stopping at the first and the last: ←/→, Space and Backspace step; a drag on the gauge (a
  // touch's anywhere), and a trackpad's sideways two-finger swipe, follow the input and then settle on the nearest tile (a flick goes
  // on). The tiles are the grid's own, so the data keeps every one of them live as it slides in.
  // The view: {id (the tile shown), index (its place among the visible), pitch (one place's width, px), x (#grid's offset, px), scrollY
  // (the page's scroll to go back to)}, or null
  let zoom = null;
  let zoomUntil = 0;   // (a zoom's animation runs until then: a click meanwhile is ignored)
  let bounce = null;   // (a key's nudge past the first or last tile, under way: cancelled by whatever moves #grid next)
  let lastDown = {x: 0, y: 0, t: 0, touch: false};   // (the last press anywhere: was the click after it one without moving, how long
                                                     // held, and a touch?)
  const translate = (x) => `translate3d(${x.toFixed(1)}px, 0, 0)`;
  const trackX = () => new DOMMatrixReadOnly(getComputedStyle(grid).transform).m41;   // (where #grid is now, mid-slide too)

  function zoomIn(box) {
    const boxes = [...grid.children];
    const before = new Map(boxes.map((b) => [b, b.getBoundingClientRect()]));
    zoom = {id: box.dataset.id, index: 0, pitch: 0, x: 0, scrollY: window.scrollY};
    if (FULL) for (const b of boxes) b.classList.toggle("fading", b !== box);   // (before `zoomed`: their tables never hidden meanwhile)
    document.documentElement.classList.add("zoomed");
    document.body.classList.add("zoomed");
    layout();   // (the gallery's places, the strip at this tile)
    window.addEventListener("wheel", wheeled, {passive: false});
    flip(box, before, false);
  }

  // Back to the dashboard (`animate` false: at once, as when the other tiles are gone from the data)
  function zoomOut(animate = true) {
    if (!zoom) return;
    if (pager) pageUp(null);
    if (wheel) { clearTimeout(wheel.timer); wheel = null; }
    const boxes = [...grid.children], box = boxes[zoom.index];
    const before = new Map(boxes.map((b) => [b, b.getBoundingClientRect()]));
    const {scrollY} = zoom;
    zoom = null;
    window.removeEventListener("wheel", wheeled);
    document.documentElement.classList.remove("zoomed");
    document.body.classList.remove("zoomed");
    stopBounce();
    Object.assign(grid.style, {transform: "", transition: ""});
    for (const b of boxes) b.style.removeProperty("--i");
    markShown();
    layout();
    window.scrollTo(0, scrollY);   // (where the page was; and if the tile shown last is off the screen, scrolled to it)
    if (box) {
      const r = box.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight - STATUS) window.scrollBy(0, r.top - PAD);
    }
    if (animate && box) flip(box, before, true);
  }

  // The zoom's animation: `box` from its place before to its place now, the others fading out (zooming in) or in (zooming out).
  // Each tile's running zoom animation is cancelled first (Esc mid-zoom: `before` was taken mid-way, so the new one starts from where
  // the tile is drawn, no jump), and only a tile's newest animation, on finishing, ends its `zooming` (the table hidden, over the
  // others) or `fading` (the others, fading out in their grid places, set by zoomIn(): their table kept, fading with them, not gone at
  // once)
  function flip(box, before, out) {
    const drawn = new Map();   // (a tile's opacity mid-way through the zoom cancelled: the fade back in from there)
    for (const b of before.keys()) {
      const running = b.getAnimations().filter((a) => a.id === "zoom");
      if (running.length) drawn.set(b, getComputedStyle(b).opacity);
      for (const a of running) a.cancel();
      if (out) b.classList.remove("fading");
    }
    if (!FULL) { box.classList.remove("zooming"); return; }
    zoomUntil = performance.now() + ZOOM_MS;
    const timing = {duration: ZOOM_MS, easing: "ease-out", id: "zoom"};
    const shown = new Map([...before.keys()].map((b) => [b, getComputedStyle(b).opacity]));
    for (const [b, was] of before) {
      const now = b.getBoundingClientRect();
      const from = `translate(${was.left - now.left}px, ${was.top - now.top}px) scale(${was.width / now.width})`;
      const opacity = shown.get(b);
      let anim;
      if (b === box) {
        b.classList.add("zooming");
        anim = b.animate([{transform: from}, {transform: "none"}], timing);
      } else if (out) anim = b.animate([{opacity: drawn.get(b) ?? 0}, {opacity}], timing);
      else anim = b.animate([{transform: from, opacity}, {transform: from, opacity: 0}], timing);
      b._zoomAnim = anim;
      anim.finished.then(() => { if (b._zoomAnim === anim) b.classList.remove("zooming", "fading"); }, () => {});
    }
  }

  // The gallery's places for the window's size now: each tile's title and gauge (its top, to TABLE_TOP: the table hidden) as large as
  // fits beside the status strip, centred in its place
  function galleryLayout() {
    const boxes = [...grid.children], n = boxes.length;
    const aspect = L.cell[0] / TABLE_TOP, W = screenRoom().w, H = screenRoom().h - 2 * PAD - STATUS;
    const w = Math.min(W - 2 * PAD, H * aspect), h = w / aspect;
    for (const [k, v] of Object.entries({"--zw": w, "--zh": h, "--zfull": w * L.cell[1] / L.cell[0], "--zx": (W - w) / 2, "--zy": PAD + (H - h) / 2, "--pitch": W}))
      grid.style.setProperty(k, `${v}px`);
    grid.style.setProperty("--n", n);
    boxes.forEach((b, i) => b.style.setProperty("--i", i));
    const at = boxes.findIndex((b) => b.dataset.id === zoom.id);   // (the tile shown gone from the readings, its neighbour)
    zoom.index = at >= 0 ? at : Math.max(0, Math.min(zoom.index, n - 1));
    zoom.id = boxes[zoom.index].dataset.id;
    zoom.pitch = W;
    if (!pager && !wheel) slide(-zoom.index * W, 0);
    markShown();
  }

  // Zoomed, only the tile shown can be reached (by the keyboard, by assistive technology): the others are inert until shown; the
  // keyboard's focus, on a tile, goes along to the one shown (a click's, on a tile's text, doesn't: it'd show as the keyboard's at the
  // next key). Not zoomed, every tile.
  function markShown() {
    const focused = grid.contains(document.activeElement) && document.activeElement.matches(":focus-visible");
    [...grid.children].forEach((b, i) => { b.inert = !!zoom && i !== zoom.index; });
    if (zoom && focused) grid.children[zoom.index].focus({preventScroll: true});
  }

  // #grid to offset x, in ms (0: at once, as a drag follows its pointer)
  function slide(x, ms) {
    stopBounce();
    zoom.x = x;
    grid.style.transition = ms && FULL ? `transform ${ms}ms ${EASE}` : "none";
    grid.style.transform = translate(x);
  }
  // ... following a drag: past the first or the last tile it gives, ever less (a rubber band)
  function follow(x) {
    const max = 0, min = -(grid.children.length - 1) * zoom.pitch;
    const give = (over) => (1 - 1 / (over * 0.55 / zoom.pitch + 1)) * zoom.pitch;
    slide(x > max ? max + give(x - max) : x < min ? min - give(min - x) : x, 0);
  }
  // ... to tile i: the one shown now
  function goTo(i, ms) {
    zoom.index = i;
    zoom.id = grid.children[i].dataset.id;

  function tiltReadout(g, angle, source, x, y) {
    if (!tiltBox) {
      tiltBox = document.createElement("pre");
      tiltBox.id = "tiltdebug";
      tiltBox.style.cssText = "position:fixed;left:4px;bottom:4px;z-index:99999;margin:0;padding:4px 6px;font:11px/1.3 monospace;color:#fff;background:rgba(0,0,0,.7);pointer-events:none;white-space:pre";
      document.body.appendChild(tiltBox);
    }
    const f = (v) => typeof v === "number" ? v.toFixed(2) : String(v), so = window.screen && window.screen.orientation;
    tiltBox.textContent = [`raw x ${f(g.x)} y ${f(g.y)} z ${f(g.z)}`,
      `screen.orientation.angle ${so ? so.angle : "-"} type ${so ? so.type : "-"}`, `window.orientation ${window.orientation}`,
      `window ${window.innerWidth}x${window.innerHeight}  used angle ${angle} (from ${source})  ios ${IOS}`,
      `platform ${navigator.platform} touch ${navigator.maxTouchPoints}`, `ua ${navigator.userAgent}`,
      `screen gravity x ${f(x)} y ${f(y)} (x right, y down)`].join("\n");

  function offerTilt() {
    tiltLink.replaceChildren();
    if (!ALLOWED || typeof DeviceMotionEvent === "undefined") return;
    window.addEventListener("devicemotion", moved);
    if (typeof DeviceMotionEvent.requestPermission !== "function" || !(navigator.maxTouchPoints > 0)) return;
    const ask = () => {
      tiltLink.replaceChildren();
      placeCorner();
      DeviceMotionEvent.requestPermission().catch(() => {});   // (granted: the readings come; denied: none, and the link is not offered again)
    };
    setTimeout(() => {
      if (heard) return;
      tiltLink.replaceChildren(link("tilt", ask, "tilt", "let the beads run downhill as the phone tilts", "tilt the beads"));
      placeCorner();
    }, TILT_WAIT_MS);
  }
  const TILT_WAIT_MS = 1200;
  offerTilt();

  // ---------- the events: a new reading, fetched and drawn in place ----------
  let source = null;
  function listen() {
    if (!window.EventSource) return;
    source = new EventSource(EVENTS);
    source.addEventListener("readings", refresh);
    source.onopen = () => { if (lost) refresh(); };
    source.onerror = () => {
      lost = true;
      showStatus();
      if (source.readyState === EventSource.CLOSED) {   // (refused outright: the browser won't retry by itself)
        source.close();
        setTimeout(listen, 10000);
      }
    };
  }

  // Re-measured on every signal that a rotation (or a browser's late report of it) can give, at the next frame and again at
  // 100/300/800 ms, and each 150 ms until the size has read the same twice running (iOS Safari can report the new size late or
  // only through one of these). After each, a page the browser has shifted sideways (scrollX, the visual viewport's offsetLeft) goes back to 0.
  let resizing = 0;
  let timers = [];
  let lastSize = "";
  const sizeNow = () => { const v = window.visualViewport; return [screenRoom().w, screenRoom().h, window.innerWidth, v ? Math.round(v.width) : 0].join("x"); };
  const recentre = () => {
    const v = window.visualViewport;
    if (v && v.scale > 1.01) return;   // (pinched in on purpose: left as it is)
    if (window.scrollX || (v && v.offsetLeft)) window.scrollTo(0, window.scrollY);
    if (document.documentElement.scrollLeft) document.documentElement.scrollLeft = 0;
    if (document.body.scrollLeft) document.body.scrollLeft = 0;
  };
  const remeasure = () => { layout(); placeCorner(); recentre(); };
  const relayout = () => {
    cancelAnimationFrame(resizing); resizing = requestAnimationFrame(remeasure);
    timers.forEach(clearTimeout);
    timers = [100, 300, 800].map((ms) => setTimeout(remeasure, ms));
    let steady = 0, tries = 0;
    const watch = () => {   // (until the size has read the same twice, at most about 2 s)
      const now = sizeNow();
      steady = now === lastSize ? steady + 1 : 0; lastSize = now;
      remeasure();
      if (steady < 2 && ++tries < 14) timers.push(setTimeout(watch, 150));
    };
    timers.push(setTimeout(watch, 150));
  };
  for (const name of ["resize", "orientationchange", "pageshow"]) window.addEventListener(name, relayout);
  if (window.visualViewport) for (const name of ["resize", "scroll"]) window.visualViewport.addEventListener(name, () => {
    if (sizeNow() !== lastSize) relayout(); else recentre();   // (a scroll of it alone: only put back)
  });
  if (window.screen && screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener("change", relayout);
  if (window.matchMedia) window.matchMedia("(orientation: landscape)").addEventListener("change", relayout);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  setInterval(refresh, REFETCH_MS);
  refresh();
  listen();
})();
</script>

<div id="fxtest" role="group" aria-label="Effect test links"></div>
<script>
"use strict";
(() => {
  // Each effect's simulated levels, one click a step (back to off after the last): as the page's conditions (rain: its strength;
  // haze: its band; ice: degrees below 0 °C). Rain's third, heavy with a flash flood (FLOOD: the flood's level too, the test's own)
  const STEPS = {rain: [0.35, 1, 1], haze: [1, 2, 3, 4, 5], uv: [1], humidity: [0.1, 1], wind: [1], heat: [1], ice: [5]};
  const FLOOD = 2;
  const ALL = {rain: 1, haze: 3, uv: 1, humidity: 1, wind: 1, heat: 1, ice: 5};   // (?fx=all)
  const OLD = {leaves: "wind", radiation: "uv", drips: "humidity"};   // (their earlier names, in links saved before)
  const row = document.getElementById("fxtest");
  document.getElementById("motion").before(row);   // (into the page's bottom left corner, just left of "stop")
  // Too narrow for all of it (a phone, "stop" beside it): scrolled to its end, its last link just left of "stop"
  function fit() { row.scrollLeft = row.scrollWidth; }
  new ResizeObserver(fit).observe(row);
  let on = {};   // {effect: its step's index}
  let windWay = null;   // the wind simulated blowing from "east" (leftward) or "west" (rightward) (?fx=wind-east, wind-west); else by the reading
  const name = (k) => k === "rain" || k === "humidity" ? [k, `${k}2`, `${k}3`][on[k]] : k === "haze" ? `haze${on[k] + 1}` : k === "wind" && windWay ? `wind-${windWay}` : k;   // (in the URL)
  const label = (k) => k in on ? (k === "rain" || k === "humidity" ? `${k}: ${["light", "heavy", "flood"][on[k]]}` : k === "haze" ? `haze ${on[k] + 1}` : k) : k;
  // On a phone (the row above the strip, across the window): no "test:", and a link's step as a small raised figure (rain¹ light, rain²
  // heavy, haze³), so every link and "stop" fit, with room for one more
  const PHONE = matchMedia("(max-width: 480px)"), RAISED = "¹²³⁴⁵";
  const shown = (k) => !PHONE.matches || !(k in on) || STEPS[k].length === 1 ? label(k) : k + RAISED[on[k]];

  function read(param) {   // ?fx=... into `on`
    on = {};
    windWay = null;
    for (const word of (param || "").split(",").map((w) => w.trim().toLowerCase()).filter(Boolean)) {
      if (word === "all") Object.entries(ALL).forEach(([k, v]) => { on[k] = STEPS[k].indexOf(v); });
      else if (/^wind-?(east|west)$/.test(word)) { on.wind = 0; windWay = word.endsWith("east") ? "east" : "west"; }   // (a wind from the east blows leftward)
      else if (word === "rain" || word === "rain1") on.rain = 0;
      else if (word === "rain2" || word === "heavyrain") on.rain = 1;
      else if (word === "rain3" || word === "flood") on.rain = 2;
      else if (word === "humidity1") on.humidity = 0;
      else if (word === "humidity2") on.humidity = 1;
      else if (/^(haze|smog)[1-5]?$/.test(word)) on.haze = Number(word.slice(4) || 1) - 1;   // (smog: its earlier name)
      else if (word in STEPS) on[word] = 0;
      else if (word in OLD) on[OLD[word]] = 0;
    }
  }
  function apply() {
    if (!("wind" in on)) windWay = null;
    const detail = Object.fromEntries(Object.entries(on).map(([k, i]) => [k, STEPS[k][i]]));
    if (on.rain === 2) detail.flood = FLOOD;
    if (windWay) detail.windDir = windWay === "east" ? -1 : 1;   // (the wind's way: Sky.setWind)

    const b = document.createElement("button");
    Object.assign(b, {type: "button", textContent: words});
    if (fx) b.dataset.fx = fx;
    b.addEventListener("click", action);
    row.append(b);
    return b;
  };
  for (const k of Object.keys(STEPS)) button(k, k, () => {
    const next = k in on ? on[k] + 1 : 0;
    if (next < STEPS[k].length) on[k] = next; else delete on[k];
    apply();
  });
  // "gust": each click sends something big across (a cow, a barn or a chicken, at random), as a gust over 99 km/h does; not on or
  // off, a one-off: never in the URL (so a reload sends nothing), and ?fx=gust as the page opens is ignored (read(): an unknown word)
  const gustLink = button("gust", null, () => document.dispatchEvent(new Event("ecobot-gust")));

  apply();
  window.dispatchEvent(new Event("resize"));   // (the page places its corner again, the row in it)
})();
</script>
