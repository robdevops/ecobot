[pytest]
asyncio_mode = auto
testpaths = tests
# run in parallel, each worker taking the next test as it frees up (pytest-xdist 3.2+, see requirements-dev.txt); `pytest -n0` runs in one process
addopts = -n auto --dist worksteal
markers =
    golden: compares charts with the reference images in tests/charts (pinned Pillow); skipped with -m 'not golden'
