[pytest]
asyncio_mode = auto
testpaths = tests
# run in parallel, each worker taking the next test as it frees up (pytest-xdist 3.2+, see requirements-dev.txt); `pytest -n0` runs in one process
addopts = -n auto --dist worksteal
# a test that hangs fails after 60 s with every thread's stack (pytest-timeout), rather than hold the run up until it is killed
timeout = 60
# a test's tmp_path is removed once it passes (a copy of the fake station's archive in each is 14 MB): kept only for a failure
tmp_path_retention_policy = failed
markers =
    golden: compares charts with the reference images in tests/charts (pinned Pillow); skipped with -m 'not golden'
