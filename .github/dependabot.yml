version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      charts:   # Pillow draws the chart pictures: its update is the cue to redo the reference images
        patterns: [pillow]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
