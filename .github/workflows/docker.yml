name: Docker images

on:
  push:   # any branch, so a pull request's commits carry the check too
    paths: [Dockerfile, .dockerignore, requirements.txt, requirements-bot.txt, requirements-mcp.txt, requirements-charts.txt, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # Both images build from the Dockerfile (each target's build imports its program, ecobot-mcp's with no Telegram and no model
    # client in it, the bot's with no Pillow and no source), each program starts in its image, and the charts ecobot-mcp draws are the
    # approved ones, in Inter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ecobot-mcp
        run: docker build --target ecobot-mcp --build-arg COMMIT="$GITHUB_SHA" -t ecobot-mcp .
      - name: Build ecobot (the bot)
        run: docker build --target ecobot --build-arg COMMIT="$GITHUB_SHA" -t ecobot .
      - name: ecobot-mcp starts and names this commit
        run: |
          docker run --rm --network none ecobot-mcp > start-mcp.log 2>&1 || true   # stops: no data source set
          cat start-mcp.log
          grep -q "Starting ecobot-mcp ${GITHUB_SHA::7}" start-mcp.log
      - name: The bot starts and names this commit
        run: |
          docker run --rm --network none -e BOT_TELEGRAM_TOKEN=0:x -e BOT_OPENROUTER_API_KEY=x ecobot > start.log 2>&1 || true   # stops: no BOT_MCP_URL
          cat start.log
          grep -q "Starting ecobot ${GITHUB_SHA::7}" start.log
      - name: Charts drawn in ecobot-mcp's image (the bot's draws none: it has no Pillow)
        run: |
          for image in ecobot-mcp; do
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" "$image" python -c '
          from PIL import Image
          from lib import charts
          from tests import chart_samples, imagecmp
          assert (charts.FONT, charts.TITLE_WEIGHT) == ("Inter", "semibold"), (charts.FONT, charts.TITLE_WEIGHT)
          for name, make in chart_samples.SAMPLES.items():
              share = imagecmp.difference(imagecmp.snapshot(make(), name.endswith("_dark")), Image.open(imagecmp.GOLDEN / f"{name}.png"))[0]
              assert share <= imagecmp.TOLERANCE, f"{name}: {share:.2%} of the pixels differ from tests/charts/{name}.png"
          print("Inter with semibold titles; every sample chart matches its reference image")'
          done
      - name: Size
        run: |
          for image in ecobot-mcp ecobot; do
            unpacked=$(docker run --rm --network none --user 0 --entrypoint du "$image" -sx --apparent-size --block-size=1M / | cut -f1)
            compressed=$(docker save "$image" | gzip -c | wc -c)
            echo "The image ${image}: ${unpacked} MB unpacked, $((compressed / 1000000)) MB compressed" | tee -a "$GITHUB_STEP_SUMMARY"
          done
