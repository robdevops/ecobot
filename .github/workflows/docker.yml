name: Docker image

on:
  push:   # any branch, so a pull request's commits carry the check too
    paths: [Dockerfile, .dockerignore, requirements.txt, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # The image builds from the Dockerfile, the bot starts in it, and the charts it draws there are the approved ones, in Inter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --build-arg COMMIT="$GITHUB_SHA" -t ecobot .
      - name: The bot starts and names this commit
        run: |
          docker run --rm --network none -e TELEGRAM_BOT_TOKEN=0:x -e OPENROUTER_API_KEY=x ecobot > start.log 2>&1 || true   # stops: no data source set
          cat start.log
          grep -q "Starting ecobot ${GITHUB_SHA::7}" start.log
      - name: Charts drawn in the image
        run: |
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" ecobot python -c '
          from PIL import Image
          from lib import charts
          from tests import chart_samples, imagecmp
          assert (charts.FONT, charts.TITLE_WEIGHT) == ("Inter", "semibold"), (charts.FONT, charts.TITLE_WEIGHT)
          for name, make in chart_samples.SAMPLES.items():
              share = imagecmp.difference(imagecmp.snapshot(make()), Image.open(imagecmp.GOLDEN / f"{name}.png"))[0]
              assert share <= imagecmp.TOLERANCE, f"{name}: {share:.2%} of the pixels differ from tests/charts/{name}.png"
          print("Inter with semibold titles; every sample chart matches its reference image")'
      - name: Size
        run: |
          unpacked=$(docker run --rm --network none --user 0 --entrypoint du ecobot -sx --apparent-size --block-size=1M / | cut -f1)
          compressed=$(docker save ecobot | gzip -c | wc -c)
          echo "The image: ${unpacked} MB unpacked, $((compressed / 1000000)) MB compressed" | tee -a "$GITHUB_STEP_SUMMARY"
