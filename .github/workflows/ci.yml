name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * 0"   # Sundays 21:17 UTC: the check against the newest Pillow (the "newest" job below)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # The gate: the exact versions in requirements.txt and requirements-charts.txt (the ones production runs), tests and chart images included.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"   # the latest 3.13.x; the programs run on 3.13.5 (.python-version)
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -m ""   # every test, the slow ones too; pytest.ini runs them in parallel (-n auto)
      - name: Chart pictures that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chart-diffs
          path: chart-diffs/
          if-no-files-found: ignore
          retention-days: 14

  newest:
    # Advisory, never blocks: the same tests with the newest Pillow. If the chart pictures differ, a new release
    # draws things differently: look at the artifact, then bump the pin in requirements-charts.txt and run scripts/update_charts.py.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt && pip install --upgrade pillow
      - run: pip list | grep -i -E "^pillow "
      - name: Tests (not the chart pictures)
        run: python -m pytest -q -m "not golden"   # (the slow ones too: -m replaces pytest.ini's "not slow")
      - name: Chart pictures
        id: pictures
        continue-on-error: true
        run: python -m pytest -q -m golden
      - name: Chart pictures that differ
        if: steps.pictures.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: chart-diffs-newest
          path: chart-diffs/
          if-no-files-found: ignore
          retention-days: 30
