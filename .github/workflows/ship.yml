name: Ship

# The one button: Actions > Ship > Run workflow, with the dev branch (any branch but main) selected. It runs the CI gate on that
# branch, opens the pull request to main (or reuses the open one), merges it with a merge commit, and fast-forwards the dev branch to
# the new main so the same branch carries on. Claude starts it too when asked to "ship".

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  merge:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Open the pull request, merge it, bring the dev branch up to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = main ]; then echo "Select the dev branch (not main) in 'Use workflow from'."; exit 1; fi
          git fetch origin main
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then echo "Nothing to ship: $branch has no commits main lacks."; exit 0; fi
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "$(git log -1 --format=%s)" \
              --body "$(git log origin/main..HEAD --reverse --format='- %s')"
          fi
          gh pr merge "$branch" --merge
          git fetch origin main
          git push origin "origin/main:refs/heads/${branch}" || echo "::warning::$branch moved while shipping; merge main into it by hand."
