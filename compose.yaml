# The bot in Docker: `sudo docker compose up -d --build` builds the image and starts the bot, and replaces a running one only when its
# image or settings changed (README). The commit the log's first line names is read from the clone's .git (see the Dockerfile).
# LOG_DRIVER, from a .env file next to this one (README): journald where the host has a journal (then
# `journalctl -f CONTAINER_NAME=ecobot` reads the log), else Docker's own.
services:
  ecobot:
    image: ecobot
    container_name: ecobot
    build:
      context: .
      args:
        COMMIT: ${COMMIT:-}
    restart: unless-stopped
    # Docker's default is a private bridge network, where .local names (mDNS) can't be found: use IP addresses in HOMEASSISTANT_URL and
    # AIRGRADIENT_LOCAL_URL, or share the host's network by removing the # below (README: "Docker networking").
    # network_mode: host
    env_file: /etc/ecobot.env
    volumes:
      - /var/lib/private/ecobot:/data
    logging:
      driver: ${LOG_DRIVER:-local}
