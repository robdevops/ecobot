# ecobot in Docker (README). `sudo docker compose up -d --build` builds the images and starts ecobot-mcp; the Telegram bot is
# optional, under the `bot` profile: `sudo docker compose --profile bot up -d --build`, or COMPOSE_PROFILES=bot in /opt/ecobot/.env;
# so is irrigation-mcp, under the `irrigation` profile (COMPOSE_PROFILES=bot,irrigation for both).
# Three images from the one Dockerfile: ecobot-mcp (its target ecobot-mcp: no Telegram, no model client), irrigation-mcp (its own
# packages alone) and ecobot (the bot: its own packages alone, no Pillow and no source).
# Compose replaces a running container only when its image or settings changed. The commit the log's first line names is read from
# the clone's .git (see the Dockerfile). Logs: Docker's `local` driver (README: "Docker logging", compose.journald.yaml for the
# journal), which compresses and rotates its files (5 of 10 MB here); read them with `docker logs -tf ecobot-mcp` (or `ecobot`,
# `irrigation-mcp`).
# Settings (/etc/ecobot.env, docs/configuration.md): MCP_ ones are ecobot-mcp's, IRRIGATION_ ones irrigation-mcp's, BOT_ ones the bot's,
# the rest all read.
services:
  # ecobot-mcp, the MCP server (docs/ecobot-mcp.md 3.8, DEVELOPMENT.md "ecobot-mcp"): the sources and their syncers, the alert rules
  # and the MCP server, on port 8765 of every address the host has, so other machines on the network can reach it too (plain HTTP,
  # with a token; put TLS in front of it, e.g. Caddy, to reach it over the internet; for this host only, publish 127.0.0.1:8765:8765).
  # Every request needs a token: one of AUTH_TOKENS (token,token,..., in /etc/ecobot.env), or, with that unset, the one it generates
  # at its first start in the data folder (/var/lib/private/ecobot/auth_token on the host), which the bot reads from there. It answers
  # its own name (hostname, below), 127.0.0.1 and localhost; MCP_ALLOWED_HOSTS adds more: the host's IP address or name, as LAN
  # clients write it in their URL, and a proxy's name.
  ecobot-mcp:
    image: ecobot-mcp
    container_name: ecobot-mcp
    hostname: ecobot-mcp
    build:
      context: .
      target: ecobot-mcp
      args:
        COMMIT: ${COMMIT:-}
    restart: unless-stopped
    # Docker's default network is private, where .local names (mDNS) can't be found (README: "Docker networking", compose.host-network.yaml)
    env_file: /etc/ecobot.env
    environment:
      MCP_BIND: 0.0.0.0:8765
    ports:
      - 8765:8765
    volumes:
      - /var/lib/private/ecobot:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  # irrigation-mcp, the irrigation controller's MCP server (docs/ecobot-mcp.md 3.9), optional, under the `irrigation` profile:
  # `sudo docker compose --profile irrigation up -d --build` (or COMPOSE_PROFILES=irrigation, or bot,irrigation, in /opt/ecobot/.env).
  # It needs IRRIGATION_TUYA_DEVICE_ID, _CLIENT_ID and _CLIENT_SECRET in /etc/ecobot.env, runs the controller's watchdog and daily
  # check, asks ecobot-mcp for the rain and the forecast (by its name on the project's network), and answers on port 8766 with the same
  # tokens (AUTH_TOKENS, or the generated one in the data folder they share). Its state and alert log are kept in the same folder.
  # The bot reaches it only with BOT_IRRIGATION_MCP_URL=http://irrigation-mcp:8766/mcp in /etc/ecobot.env (docker/bot.env leaves it
  # empty: no Irrigation button without this container). IRRIGATION_ECOBOT_MCP_URL is set in docker/irrigation.env; a systemd value
  # (127.0.0.1) in /etc/ecobot.env would win over it and point at this container itself: leave it out (it says so in its log).
  irrigation-mcp:
    image: irrigation-mcp
    container_name: irrigation-mcp
    hostname: irrigation-mcp
    build:
      context: .
      target: irrigation-mcp
      args:
        COMMIT: ${COMMIT:-}
    profiles: [irrigation]
    restart: unless-stopped
    depends_on: [ecobot-mcp]
    env_file: [docker/irrigation.env, /etc/ecobot.env]
    environment:
      IRRIGATION_BIND: 0.0.0.0:8766
    ports:
      - 8766:8766
    volumes:
      - /var/lib/private/ecobot:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  # The Telegram bot, a client of ecobot-mcp (BOT_MCP_URL, docker/bot.env), sending the first of AUTH_TOKENS, or, with that unset, the
  # token ecobot-mcp generated in the data folder they share; and, with BOT_IRRIGATION_MCP_URL set, of irrigation-mcp (the same token).
  # It keeps its own state (chats, alert settings) in the same folder.
  ecobot:
    image: ecobot
    container_name: ecobot
    build:
      context: .
      target: ecobot
      args:
        COMMIT: ${COMMIT:-}
    profiles: [bot]
    restart: unless-stopped
    depends_on: [ecobot-mcp]
    env_file: [docker/bot.env, /etc/ecobot.env]
    volumes:
      - /var/lib/private/ecobot:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
