# The bot in Docker: `sudo docker compose up -d --build` builds the image and starts the bot, and replaces a running one only when its
# image or settings changed (README). The commit the log's first line names is read from the clone's .git (see the Dockerfile).
# Logs: Docker's `local` driver (README: "Docker logging", compose.journald.yaml for the journal), which compresses and rotates its files (5 of 10 MB here); read them with `docker logs -tf ecobot`.
services:
  ecobot:
    image: ecobot
    container_name: ecobot
    build:
      context: .
      args:
        COMMIT: ${COMMIT:-}
    restart: unless-stopped
    # Docker's default network is private, where .local names (mDNS) can't be found (README: "Docker networking", compose.host-network.yaml)
    env_file: /etc/ecobot.env
    volumes:
      - /var/lib/private/ecobot:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  # The MCP service on its own (docs/mcp-service.md 3.8, DEVELOPMENT.md "The MCP service"): the same image, `python -m ecobot_service`,
  # at http://127.0.0.1:8765/mcp on the host (put TLS in front of it, e.g. Caddy, to reach it from elsewhere). Off unless asked for
  # (`sudo docker compose --profile service up -d ecobot-service`). Run it only with the bot as its client (WEATHER_MCP_URL=
  # http://ecobot-service:8765/mcp and WEATHER_MCP_TOKEN in /etc/ecobot.env, and ecobot-service in MCP_SERVICE_ALLOWED_HOSTS), recreating the
  # bot first: one process runs the service per data folder (service.lock), so it won't start beside a bot running it. It needs MCP_SERVICE_TOKENS
  # (token,token,..., in /etc/ecobot.env): it listens on all of the container's addresses, which it refuses to do without tokens.
  # MCP_SERVICE_ALLOWED_HOSTS: add the name a proxy or a LAN client uses for it.
  ecobot-service:
    image: ecobot
    container_name: ecobot-service
    profiles: [service]
    command: ["python", "-m", "ecobot_service"]
    restart: unless-stopped
    env_file: /etc/ecobot.env
    environment:
      MCP_SERVICE_BIND: 0.0.0.0:8765
    ports:
      - 127.0.0.1:8765:8765
    volumes:
      - /var/lib/private/ecobot:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
